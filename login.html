<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | DEV MENU</title>

<!-- Tailwind CSS & FontAwesome -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --brand: #233d2c;
    --brand-dark: #15271b;
    --sand: #f5f2eb;
    --cream: #fdfbf7;
    --gold: #c9a227;
    --gold-deep: #8a6d0f;
  }
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Cairo', sans-serif; background-color: var(--sand); color: #1b3022; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; overflow-x: hidden; }

  .page-bg {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(55% 40% at 88% -5%, rgba(35,61,44,.12), transparent 70%),
                radial-gradient(45% 35% at 5% 15%, rgba(201,162,39,.10), transparent 70%);
  }
  .page-bg::after {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(35,61,44,.06) 1px, transparent 1.6px);
    background-size: 26px 26px;
  }

  .pro-card {
    background: #fff; border: 1.5px solid rgba(35,61,44,.14);
    border-radius: 26px; box-shadow: 0 24px 50px -24px rgba(35,61,44,.22);
  }

  .btn-primary {
    background: var(--brand); color: var(--sand); transition: all .25s ease;
    box-shadow: 0 14px 28px -12px rgba(35,61,44,.55);
  }
  .btn-primary:hover {
    background: var(--brand-dark); transform: translateY(-2px);
    box-shadow: 0 20px 36px -14px rgba(35,61,44,.6);
  }
  .btn-primary:disabled { opacity: .7; cursor: not-allowed; transform: none; }

  .lbl { display: block; font-size: 11px; font-weight: 800; color: var(--brand); margin-bottom: 6px; }
  .input-pro {
    width: 100%; background: var(--cream); border: 1.5px solid #d8d2c2;
    border-radius: 14px; padding: .85rem 1rem; padding-inline-start: 2.7rem;
    color: #1b3022; font-size: .85rem; font-weight: 600; transition: all .2s;
  }
  .input-pro::placeholder { color: rgba(35,61,44,.35); font-weight: 600; }
  .input-pro:focus {
    outline: none; border-color: var(--brand); background: #fff;
    box-shadow: 0 0 0 4px rgba(35,61,44,.08);
  }

  .otp-box {
    width: 44px; height: 54px; text-align: center; font-size: 1.4rem; font-weight: 900;
    font-family: 'Cairo', sans-serif; background: var(--cream); border: 1.5px solid #d8d2c2;
    border-radius: 14px; color: var(--brand); transition: all .2s;
  }
  .otp-box:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(35,61,44,.08); transform: translateY(-2px); }
  .otp-box.filled { background: var(--brand); color: var(--sand); border-color: var(--brand); }

  #toast-wrap {
    position: fixed; top: 18px; inset-inline: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none; padding: 0 16px;
  }
  .toast {
    display: flex; align-items: center; gap: 10px; background: var(--brand-dark);
    color: var(--sand); font-size: 12px; font-weight: 800; padding: 12px 18px;
    border-radius: 14px; max-width: min(92vw, 480px);
    box-shadow: 0 20px 40px -12px rgba(21,39,27,.5);
  }
  .toast i { font-size: 14px; }
  .toast-success i { color: #4ade80; }
  .toast-error i { color: #fbbf24; }
</style>
</head>
<body>

<div class="page-bg"></div>
<div id="toast-wrap"></div>

<header class="w-full max-w-md flex items-center justify-between py-4">
  <div class="flex items-center gap-2.5">
    <div class="w-10 h-10 bg-brand text-white rounded-xl flex items-center justify-center font-black text-sm tracking-wider shadow-md">DM</div>
    <span class="font-black text-sm tracking-widest text-brand">DEV MENU</span>
  </div>
  <a href="index.html" class="text-xs font-bold bg-white border border-[#233d2c]/20 px-4 py-2 rounded-xl text-brand hover:bg-[#f5f2eb] transition shadow-sm">
    <i class="fa-solid fa-house ml-1"></i> الرئيسية
  </a>
</header>

<div class="pro-card p-6 md:p-8 w-full max-w-md space-y-6 my-auto">
  <div class="text-center space-y-2">
    <div class="w-12 h-12 rounded-2xl bg-[#233d2c]/10 text-brand border border-[#233d2c]/20 flex items-center justify-center mx-auto text-xl">
      <i class="fa-solid fa-user-lock"></i>
    </div>
    <h1 id="main-title" class="text-lg font-black text-brand">تسجيل الدخول عبر البريد</h1>
    <p id="main-desc" class="text-xs text-gray-600">أدخل بريدك الإلكتروني المسجل لنرسل لك رمز التحقق الحقيقي.</p>
  </div>

  <!-- نموذج إدخال البريد -->
  <form id="login-form" class="space-y-4">
    <div>
      <label class="lbl">البريد الإلكتروني</label>
      <div class="relative">
        <i class="fa-solid fa-envelope absolute start-3.5 top-1/2 -translate-y-1/2 text-brand/40 text-xs"></i>
        <input type="email" id="identifier-input" placeholder="example@mail.com" required class="input-pro" dir="ltr">
      </div>
    </div>
    <button type="submit" id="send-otp-btn" class="w-full btn-primary font-bold py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
      <span id="btn-text">إرسال رمز التحقق للبريد</span>
      <i id="btn-spinner" class="fa-solid fa-spinner fa-spin hidden"></i>
    </button>
  </form>

  <!-- نموذج إدخال كود التحقق (6 خانات) -->
  <form id="otp-form" class="space-y-5 hidden">
    <div class="bg-[#c9a227]/10 border border-[#c9a227]/30 rounded-2xl p-4 text-center space-y-1">
      <p class="text-xs font-black text-[#1b3022]">تم إرسال رمز التحقق إلى بريدك الإلكتروني.</p>
      <p class="text-[10px] text-gray-600">يرجى تفقد صندوق الوارد أو الرسائل غير المرغوب فيها (Spam).</p>
    </div>

    <div>
      <label class="lbl text-center mb-3">أدخل رمز التحقق (6 أرقام)</label>
      <div class="flex justify-center gap-1.5" dir="ltr">
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
      </div>
      <input type="hidden" id="otp-input">
    </div>

    <button type="submit" id="verify-otp-btn" class="w-full btn-primary font-bold py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
      <span id="v-btn-text">تأكيد الرمز ودخول لوحة التحكم</span>
      <i id="v-btn-spinner" class="fa-solid fa-spinner fa-spin hidden"></i>
    </button>

    <div class="text-center">
      <button type="button" onclick="backToLogin()" class="text-xs text-brand/60 hover:text-brand font-bold">تغيير البريد الإلكتروني</button>
    </div>
  </form>
</div>

<footer class="text-center py-4 text-[11px] text-gray-600 font-bold">
  © DEV MENU 2026 — منصة المنيو الرقمي الفاخر
</footer>

<script>
  const SUPABASE_URL = 'https://czdoamcgxgkicrbufpcn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6ZG9hbWNneGdraWNyYnVmcGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTA5MzAsImV4cCI6MjEwNTU4NjkzMH0.45zKx4ljXJ27SS-ukc62qiu52movhDgSoC9OEnK9NHk';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let inputEmail = '';

  function showToast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `<span>${msg}</span>`;
    document.getElementById('toast-wrap').appendChild(el);
    setTimeout(() => el.remove(), 3800);
  }

  // التحقق من جدول clients أولاً، ثم إرسال الرمز الحقيقي عبر Supabase Auth
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    inputEmail = document.getElementById('identifier-input').value.trim().toLowerCase();
    const btn = document.getElementById('send-otp-btn');
    const spinner = document.getElementById('btn-spinner');

    if (!inputEmail) return;

    btn.disabled = true; spinner.classList.remove('hidden');

    // 1. التأكد من أن الإيميل مسجل في جدول clients الخاص بالمتاجر
    const { data: clientCheck, error: dbError } = await supabaseClient
      .from('clients')
      .select('client_slug')
      .eq('email', inputEmail)
      .maybeSingle();

    if (dbError || !clientCheck) {
      btn.disabled = false; spinner.classList.add('hidden');
      showToast('عذراً، هذا البريد غير مسجل لأي متجر في النظام.', 'error');
      return;
    }

    // 2. إرسال الكود الحقيقي عبر Supabase Auth مع تفعيل السماح بالإنشاء لتجاوز خطأ الـ Signups
    const { error } = await supabaseClient.auth.signInWithOtp({
      email: inputEmail,
      options: { shouldCreateUser: true }
    });

    btn.disabled = false; spinner.classList.add('hidden');

    if (error) {
      showToast(error.message || 'عذراً، حدث خطأ أثناء إرسال الرمز.', 'error');
      return;
    }

    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('otp-form').classList.remove('hidden');
    document.getElementById('main-title').textContent = 'أدخل رمز التحقق';
    document.getElementById('main-desc').textContent = `تم إرسال الرمز إلى ${inputEmail}`;
    setupOtpInputs();
    showToast('تم إرسال رمز التحقق إلى بريدك بنجاح', 'success');
  });

  function setupOtpInputs() {
    const boxes = document.querySelectorAll('.otp-box');
    boxes.forEach((box, idx) => {
      box.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '').slice(0, 1);
        box.value = val;
        if (val) {
          box.classList.add('filled');
          if (idx < boxes.length - 1) boxes[idx + 1].focus();
        } else {
          box.classList.remove('filled');
        }
        updateHiddenOtp();
      });
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && idx > 0) {
          boxes[idx - 1].focus();
          boxes[idx - 1].value = '';
          boxes[idx - 1].classList.remove('filled');
          updateHiddenOtp();
        }
      });
    });
    boxes[0].focus();
  }

  function updateHiddenOtp() {
    const boxes = document.querySelectorAll('.otp-box');
    let code = '';
    boxes.forEach(b => code += b.value);
    document.getElementById('otp-input').value = code;
  }

  function backToLogin() {
    document.getElementById('otp-form').classList.add('hidden');
    document.getElementById('login-form').classList.remove('hidden');
    document.getElementById('main-title').textContent = 'تسجيل الدخول عبر البريد';
    document.getElementById('main-desc').textContent = 'أدخل بريدك الإلكتروني المسجل لنرسل لك رمز التحقق الحقيقي.';
  }

  // التحقق من الرمز الحقيقي والدخول
  document.getElementById('otp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const otp = document.getElementById('otp-input').value.trim();
    const btn = document.getElementById('verify-otp-btn');
    const spinner = document.getElementById('v-btn-spinner');

    if (otp.length < 6) {
      showToast('يرجى إدخال رمز التحقق كاملاً (6 أرقام)', 'error');
      return;
    }

    btn.disabled = true; spinner.classList.remove('hidden');

    const { data, error } = await supabaseClient.auth.verifyOtp({
      email: inputEmail,
      token: otp,
      type: 'email'
    });

    btn.disabled = false; spinner.classList.add('hidden');

    if (error || !data.session) {
      showToast('رمز التحقق غير صحيح أو منتهي الصلاحية', 'error');
      return;
    }

    const { data: client } = await supabaseClient
      .from('clients')
      .select('client_slug')
      .eq('email', inputEmail)
      .maybeSingle();

    const clientSlug = client ? client.client_slug : 'alqarya-restaurant';

    showToast('تم تسجيل الدخول بنجاح! جاري تحويلك...', 'success');
    setTimeout(() => {
      window.location.href = `admin.html?client=${clientSlug}`;
    }, 1000);
  });
</script>
</body>
</html>
