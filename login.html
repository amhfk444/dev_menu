<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="/js/i18n.js?v=7" data-dict="login"></script>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>تسجيل الدخول | DEV MENU</title>

<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/icons.css">
<script src="js/api.js"></script>

<style>
  :root {
    --brand: #233d2c;
    --brand-dark: #15271b;
    --sand: #f5f2eb;
    --cream: #fdfbf7;
    --gold: #c9a227;
    --gold-deep: #8a6d0f;
  }
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: var(--sand); color: #1b3022; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; overflow-x: hidden; }

  .page-bg {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(55% 40% at 88% -5%, rgba(35,61,44,.12), transparent 70%),
                radial-gradient(45% 35% at 5% 15%, rgba(201,162,39,.10), transparent 70%);
  }
  .page-bg::after {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(35,61,44,.06) 1px, transparent 1.6px);
    background-size: 26px 26px;
  }

  .pro-card {
    background: #fff; border: 1.5px solid rgba(35,61,44,.14);
    border-radius: 26px; box-shadow: 0 24px 50px -24px rgba(35,61,44,.22);
  }

  .btn-primary {
    background: var(--brand); color: var(--sand); transition: all .25s ease;
    box-shadow: 0 14px 28px -12px rgba(35,61,44,.55);
  }
  .btn-primary:hover {
    background: var(--brand-dark); transform: translateY(-2px);
    box-shadow: 0 20px 36px -14px rgba(35,61,44,.6);
  }
  .btn-primary:disabled { opacity: .7; cursor: not-allowed; transform: none; }

  .lbl { display: block; font-size: 11px; font-weight: 800; color: var(--brand); margin-bottom: 6px; }
  .input-pro {
    width: 100%; background: var(--cream); border: 1.5px solid #d8d2c2;
    border-radius: 14px; padding: .85rem 1rem; padding-inline-start: 2.7rem;
    color: #1b3022; font-size: .85rem; font-weight: 600; transition: all .2s;
  }
  .input-pro::placeholder { color: rgba(35,61,44,.35); font-weight: 600; }
  .input-pro:focus {
    outline: none; border-color: var(--brand); background: #fff;
    box-shadow: 0 0 0 4px rgba(35,61,44,.08);
  }

  .otp-box {
    width: 44px; height: 54px; text-align: center; font-size: 1.4rem; font-weight: 900;
    font-family: 'IBM Plex Sans Arabic', sans-serif; background: var(--cream); border: 1.5px solid #d8d2c2;
    border-radius: 14px; color: var(--brand); transition: all .2s;
  }
  .otp-box:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(35,61,44,.08); transform: translateY(-2px); }
  .otp-box.filled { background: var(--brand); color: var(--sand); border-color: var(--brand); }

  #toast-wrap {
    position: fixed; top: 18px; inset-inline: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none; padding: 0 16px;
  }
  .toast {
    display: flex; align-items: center; gap: 10px; background: var(--brand-dark);
    color: var(--sand); font-size: 12px; font-weight: 800; padding: 12px 18px;
    border-radius: 14px; max-width: min(92vw, 480px);
    box-shadow: 0 20px 40px -12px rgba(21,39,27,.5);
  }
  .toast i { font-size: 14px; }
  .toast-success i { color: #4ade80; }
  .toast-error i { color: #fbbf24; }

  /* ═══ نفس أساس النظام: Shopify Polaris (@shopify/polaris-tokens 9.4.2)، وأخضر DEV MENU ═══ */
  :root { --brand: #384f3d; --brand-dark: #2a3e2f; --sand: #f1f1f1; --cream: #fdfdfd; }
  body { background: #f1f1f1; color: #303030; }
  .page-bg { display: none; }
  .pro-card { border: 0; border-radius: 12px; box-shadow: 0 1px 0 rgba(26,26,26,.07), inset 1px 0 0 rgba(0,0,0,.13), inset -1px 0 0 rgba(0,0,0,.13), inset 0 -1px 0 rgba(0,0,0,.17), inset 0 1px 0 rgba(204,204,204,.5); }
  .btn-primary { color: #fff; border-radius: 8px !important; box-shadow: inset 0 -1px 0 1px rgba(0,0,0,.55), inset 0 0 0 1px var(--brand), inset 0 .5px 0 1.5px rgba(255,255,255,.25); }
  .btn-primary:hover { transform: none; box-shadow: inset 0 -1px 0 1px rgba(0,0,0,.55), inset 0 0 0 1px var(--brand-dark), inset 0 .5px 0 1.5px rgba(255,255,255,.25); }
  .lbl { font-size: 13px; font-weight: 600; color: #303030; }
  .input-pro, .otp-box { background: #fdfdfd; border: 1px solid #8a8a8a; border-radius: 8px; font-weight: 500; color: #303030; }
  .input-pro:hover, .otp-box:hover { border-color: #616161; }
  .input-pro:focus, .otp-box:focus { outline: 2px solid #005bd3; outline-offset: 1px; border-color: #8a8a8a; box-shadow: none; background: #fdfdfd; transform: none; }
  .otp-box.filled { background: var(--brand); color: #fff; border-color: var(--brand); }
</style>
<link rel="stylesheet" href="/css/tw/login.css">
<style>#oauth-wait{display:none}html.oauth-return #oauth-wait{display:flex}html.oauth-return body{overflow:hidden}</style>
<script>if (/access_token=/.test(location.hash)) document.documentElement.classList.add('oauth-return');</script>
</head>
<body>
<!-- الرجوع من Google: شاشة انتظار بدل ما تبان الصفحة من جديد -->
<div id="oauth-wait" role="status" aria-live="polite" style="position:fixed;inset:0;z-index:9999;background:#f1f1f1;flex-direction:column;align-items:center;justify-content:center;gap:14px">
  <img src="images/logo-full-sm.png" alt="DEV MENU" style="width:150px;height:auto">
  <i class="ph-bold ph-spinner-gap ph-spin" style="font-size:22px;color:#384f3d"></i>
  <p id="oauth-wait-text" style="font-size:14px;font-weight:700;color:#303030;margin:0">جاري تسجيل دخولك…</p>
</div>


<div class="page-bg"></div>
<div id="toast-wrap"></div>

<header class="w-full max-w-md flex items-center justify-between py-4">
  <a href="index.html" class="flex items-center" dir="ltr" aria-label="DEV MENU">
    <img src="images/logo-full-sm.png" alt="DEV MENU" width="96" height="66" class="h-[52px] w-auto">
  </a>
  <a href="index.html" class="text-xs font-semibold bg-white px-4 py-2 rounded-lg text-[#303030] hover:bg-[#384f3d]/10 hover:text-brand transition" style="box-shadow: inset 0 -1px 0 #b5b5b5, inset 0 0 0 1px rgba(0,0,0,.1), inset 0 .5px 0 1.5px #fff">
    <i class="ph-bold ph-house ml-1"></i> الرئيسية
  </a>
</header>

<div class="pro-card p-6 md:p-8 w-full max-w-md space-y-6 my-auto">
  <div class="text-center space-y-2">
    <div class="w-12 h-12 rounded-2xl bg-[#233d2c]/10 text-brand border border-[#233d2c]/20 flex items-center justify-center mx-auto text-xl">
      <i class="ph-bold ph-lock-key"></i>
    </div>
    <h1 id="main-title" class="text-lg font-black text-brand">تسجيل الدخول</h1>
    <p id="main-desc" class="text-xs text-gray-600">ادخل بحساب Google، أو ببريدك الإلكتروني ورمز تحقق.</p>
  </div>

  <!-- الدخول بحساب Google -->
  <button type="button" id="google-btn" onclick="loginWithGoogle()" style="box-shadow: inset 0 -1px 0 #b5b5b5, inset 0 0 0 1px rgba(0,0,0,.1), inset 0 .5px 0 1.5px #fff" class="w-full bg-white hover:bg-[#384f3d]/10 text-[#303030] font-semibold py-3.5 rounded-lg text-xs flex items-center justify-center gap-3 shadow-sm transition disabled:opacity-60">
    <svg class="w-4 h-4" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.31 7.25 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.19C.43 8.15 0 9.89 0 12s.43 3.85 1.19 5.39l4.08-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.25 0 3.18 2.69 1.19 6.61l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
    <span>الدخول بحساب Google</span>
  </button>
  <div id="or-line" class="flex items-center gap-3 text-[10px] font-bold text-gray-400">
    <span class="flex-1 border-t border-gray-200"></span> أو <span class="flex-1 border-t border-gray-200"></span>
  </div>

  <!-- نموذج إدخال البريد -->
  <form id="login-form" class="space-y-4">
    <div>
      <label class="lbl">البريد الإلكتروني</label>
      <div class="relative">
        <i class="ph-bold ph-envelope-simple absolute start-3.5 top-1/2 -translate-y-1/2 text-brand/40 text-xs"></i>
        <input type="email" id="identifier-input" placeholder="example@mail.com" required class="input-pro" dir="ltr">
      </div>
    </div>
    <button type="submit" id="send-otp-btn" class="w-full btn-primary font-bold py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
      <span id="btn-text">إرسال رمز التحقق للبريد</span>
      <i id="btn-spinner" class="ph-bold ph-spinner-gap ph-spin hidden"></i>
    </button>
  </form>

  <!-- نموذج إدخال كود التحقق (6 خانات) -->
  <form id="otp-form" class="space-y-5 hidden">
    <div class="bg-[#c9a227]/10 border border-[#c9a227]/30 rounded-2xl p-4 text-center space-y-1">
      <p class="text-xs font-black text-[#1b3022]">تم إرسال رمز التحقق إلى بريدك الإلكتروني.</p>
      <p class="text-[10px] text-gray-600">يرجى تفقد صندوق الوارد أو الرسائل غير المرغوب فيها (Spam).</p>
    </div>

    <div>
      <label class="lbl text-center mb-3">أدخل رمز التحقق (6 أرقام)</label>
      <div class="flex justify-center gap-1.5" dir="ltr">
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
      </div>
      <input type="hidden" id="otp-input">
    </div>

    <button type="submit" id="verify-otp-btn" class="w-full btn-primary font-bold py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
      <span id="v-btn-text">تأكيد الرمز ودخول لوحة التحكم</span>
      <i id="v-btn-spinner" class="ph-bold ph-spinner-gap ph-spin hidden"></i>
    </button>

    <div class="text-center">
      <button type="button" onclick="backToLogin()" class="text-xs text-brand/60 hover:text-brand font-bold">تغيير البريد الإلكتروني</button>
    </div>
  </form>
</div>

<footer class="text-center py-4 text-[11px] text-gray-600 font-bold">
  © DEV MENU 2026 — منصة المنيو الرقمي
</footer>

<script>
  // تسجيل الدخول عبر Supabase Auth، والتوجيه حسب رد خادمنا /api

  // حماية من حقن الكود: أي نص قادم من قاعدة البيانات يمر من هنا قبل عرضه
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // يقبل روابط http/https فقط (يمنع روابط javascript:)
  function safeUrl(u) {
    if (!u) return '';
    try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : ''; }
    catch { return ''; }
  }
  let inputEmail = '';
  const boxes = Array.from(document.querySelectorAll('.otp-box'));

  function showToast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    const icon = document.createElement('i');
    icon.className = `ph-bold ${type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'}`;
    const text = document.createElement('span');
    text.textContent = msg;
    el.append(icon, text);
    document.getElementById('toast-wrap').appendChild(el);
    setTimeout(() => el.remove(), 3800);
  }

  function setBusy(btnId, spinnerId, busy) {
    document.getElementById(btnId).disabled = busy;
    document.getElementById(spinnerId).classList.toggle('hidden', !busy);
  }

  // بعد الدخول: المدير العام يروح لوحته، وصاحب المتجر يروح لوحة متجره
  // الخادم يحدد: مدير عام ← لوحة المشتركين، صاحب متجر ← لوحته
  async function goToDashboard() {
    let who;
    try { who = await DM.get('/api/owner?action=whoami', true); }
    catch (e) {
      if (e.status === 401) { await DM.logout(); return; }
      document.documentElement.classList.remove('oauth-return');
      return showToast(e.message, 'error');
    }
    if (who.is_admin) { window.location.href = 'super-admin.html'; return; }
    // حساب جديد (دخل بـ Google أو بالرمز وما عنده منشأة): يكمل التسجيل وهو داخل، بدون ما يعيد التحقق
    if (!who.has_store) { window.location.replace('index.html?continue=signup#register'); return; }
    window.location.replace('admin.html');
  }

  // الدخول بحساب Google: نروح لصفحة Google ونرجع لهذي الصفحة
  function loginWithGoogle() {
    document.getElementById('google-btn').disabled = true;
    location.href = DM.googleUrl(location.origin + location.pathname);
  }

  // بعد الرجوع من Google، أو إذا كان داخل مسبقاً: نحوّله للوحته
  (async () => {
    try {
      await DM.consumeOAuthRedirect();
    } catch (e) { document.documentElement.classList.remove('oauth-return'); return showToast(e.message, 'error'); }
    if (DM.signedIn()) goToDashboard();
  })();

  // نسخة التجربة: كلمة سر بدل رمز البريد (الحسابات التجريبية في .env.staging-login)
  if (DM.staging) {
    document.getElementById('identifier-input').closest('div').parentElement.insertAdjacentHTML('afterend', `
      <div><label class="lbl">كلمة السر (نسخة التجربة)</label>
      <input type="password" id="staging-password" required class="input-pro" dir="ltr" autocomplete="current-password"></div>`);
    document.getElementById('btn-text').textContent = 'دخول';
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault(); e.stopImmediatePropagation();
      setBusy('send-otp-btn', 'btn-spinner', true);
      try { await DM.passwordLogin(document.getElementById('identifier-input').value.trim().toLowerCase(), document.getElementById('staging-password').value); goToDashboard(); }
      catch (err) { showToast(err.message || 'البريد أو كلمة السر غلط', 'error'); }
      setBusy('send-otp-btn', 'btn-spinner', false);
    }, true);
  }

  // 1. إرسال الرمز
  // shouldCreateUser: true حتى تقدر المتاجر القديمة تدخل بدون إضافتها يدوياً.
  // هذا آمن: الدخول وحده لا يعطي أي صلاحية، الصلاحية مربوطة ببريد المتجر في جدول clients
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    inputEmail = document.getElementById('identifier-input').value.trim().toLowerCase();
    if (!inputEmail) return;

    setBusy('send-otp-btn', 'btn-spinner', true);
    let error = null;
    try { await DM.sendOtp(inputEmail); } catch (e) { error = e; }
    setBusy('send-otp-btn', 'btn-spinner', false);

    if (error) {
      console.error('OTP error:', error);
      const m = (error.message || '').toLowerCase();
      let msg;
      if (error.status === 429 || m.includes('rate limit') || m.includes('security purposes'))
        msg = 'طلبت رموزاً كثيرة، انتظر دقيقة ثم حاول مرة أخرى';
      else if (m.includes('signups not allowed') || m.includes('user not found'))
        msg = 'هذا البريد غير مسجل لدينا. أنشئ متجرك من الصفحة الرئيسية.';
      else if (m.includes('not authorized'))
        msg = 'خدمة البريد لا تسمح بالإرسال لهذا العنوان (يلزم إعداد SMTP في Supabase).';
      else
        msg = `تعذر إرسال الرمز: ${error.message}`;
      showToast(msg, 'error');
      return;
    }

    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('google-btn').classList.add('hidden');
    document.getElementById('or-line').classList.add('hidden');
    document.getElementById('otp-form').classList.remove('hidden');
    document.getElementById('main-title').textContent = 'أدخل رمز التحقق';
    document.getElementById('main-desc').textContent = `تم إرسال الرمز إلى بريدك: ${inputEmail}`;
    resetBoxes();
    boxes[0].focus();
    showToast('تم إرسال رمز التحقق إلى بريدك', 'success');
  });

  function resetBoxes() { boxes.forEach(b => { b.value = ''; b.classList.remove('filled'); }); }
  const getOtp = () => boxes.map(b => b.value).join('');

  // تجهيز خانات الرمز مرة واحدة فقط
  boxes.forEach((box, idx) => {
    box.addEventListener('input', () => {
      box.value = box.value.replace(/\D/g, '').slice(0, 1);
      box.classList.toggle('filled', !!box.value);
      if (box.value && idx < boxes.length - 1) boxes[idx + 1].focus();
      if (getOtp().length === boxes.length) document.getElementById('otp-form').requestSubmit();
    });
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !box.value && idx > 0) {
        boxes[idx - 1].value = '';
        boxes[idx - 1].classList.remove('filled');
        boxes[idx - 1].focus();
      }
    });
    box.addEventListener('paste', (e) => {
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, boxes.length);
      if (!digits) return;
      e.preventDefault();
      boxes.forEach((b, i) => { b.value = digits[i] || ''; b.classList.toggle('filled', !!b.value); });
      boxes[Math.min(digits.length, boxes.length) - 1].focus();
      if (digits.length === boxes.length) document.getElementById('otp-form').requestSubmit();
    });
  });

  function backToLogin() {
    resetBoxes();
    document.getElementById('otp-form').classList.add('hidden');
    document.getElementById('login-form').classList.remove('hidden');
    document.getElementById('google-btn').classList.remove('hidden');
    document.getElementById('or-line').classList.remove('hidden');
    document.getElementById('main-title').textContent = 'تسجيل الدخول';
    document.getElementById('main-desc').textContent = 'ادخل بحساب Google، أو ببريدك الإلكتروني ورمز تحقق.';
  }

  // 2. التحقق من الرمز ثم التحويل
  let verifying = false;
  document.getElementById('otp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (verifying) return;
    const otp = getOtp();
    if (otp.length < boxes.length) return showToast('يرجى إدخال رمز التحقق كاملاً (6 أرقام)', 'error');

    verifying = true;
    setBusy('verify-otp-btn', 'v-btn-spinner', true);
    let ok = true;
    try { await DM.verifyOtp(inputEmail, otp); } catch { ok = false; }

    if (!ok) {
      verifying = false;
      setBusy('verify-otp-btn', 'v-btn-spinner', false);
      return showToast('رمز التحقق غير صحيح أو منتهي الصلاحية', 'error');
    }

    showToast('تم تسجيل الدخول بنجاح، جاري تحويلك...', 'success');
    await goToDashboard();
    verifying = false;
    setBusy('verify-otp-btn', 'v-btn-spinner', false);
  });
</script>
</body>
</html>
