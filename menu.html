          </div>
          ${desc ? `<p class="pc-desc line-clamp-1">${esc(desc)}</p>` : ''}
          ${dealBadges(p)}
          ${!available ? `<p class="text-[11px] font-bold mt-1" style="color:#fca5a5">${currentLang === 'ar' ? 'غير متوفر حالياً' : 'Currently unavailable'}</p>` : ''}
        </div>
      </article>`;
  }

  function renderMenu(products, isSearch) {
    const container = document.getElementById('dynamic-menu-sections');
    container.removeAttribute('aria-busy');
    // البحث يشمل كل الأقسام، والتصفح يعرض أقسام الفئة المختارة فقط
    const groups = (isSearch ? allCategories : visibleCats()).map(c => [c, productsIn(c, products)]).filter(([, ps]) => ps.length > 0);

    if (groups.length === 0) {
      const msg = isSearch
        ? (currentLang === 'ar' ? 'لا توجد نتائج مطابقة لبحثك.' : 'No dishes match your search.')
        : (currentLang === 'ar' ? 'لم تتم إضافة أطباق لهذا المنيو بعد.' : 'No dishes added yet.');
      container.innerHTML = `<p class="text-center text-xs text-gray-400 py-10">${msg}</p>`;
      return;
    }

    container.innerHTML = groups.map(([cat, ps]) => `
      <section id="section-${esc(cat.id)}" class="space-y-3 scroll-mt-24">
        <h3 class="sec-title font-bold text-base text-white tracking-wide border-b pb-1.5">${esc(catName(cat))}</h3>
        <div class="${photoLayout() ? 'space-y-3.5' : 'space-y-2.5'}">${ps.map(photoLayout() ? photoCard : productCard).join('')}</div>
      </section>`).join('');
  }

  function handleSearch() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    if (!q) return renderMenu(allProducts, false);
    const filtered = allProducts.filter(p =>
      [p.name, p.description, p.name_en, p.description_en, translationCache[p.name], translationCache[p.description],
       ...(p.coffee && coffeeOn() ? [p.coffee.origin, p.coffee.region, p.coffee.variety, ...(p.coffee.notes || []).flatMap(n => [n, translationCache[n]])] : [])]
        .some(t => t && String(t).toLowerCase().includes(q)));
    renderMenu(filtered, true);
  }

  // ─── التنقل بين الأقسام ───
  document.getElementById('fast-filter-bar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    const target = document.getElementById(`section-${btn.dataset.cat}`);
    if (target) window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
  });

  let scrollTick = false;
  window.addEventListener('scroll', () => {
    if (scrollTick) return;
    scrollTick = true;
    requestAnimationFrame(() => {
      scrollTick = false;
      const sections = [...document.querySelectorAll('#dynamic-menu-sections section')];
      let current = sections[0];
      for (const s of sections) if (s.getBoundingClientRect().top < 120) current = s;
      if (!current) return;
      const id = current.id.replace('section-', '');
      document.querySelectorAll('.cat-pill').forEach(b => {
        const on = b.dataset.cat === id;
        b.classList.toggle('active', on);
        if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      });
    });
  }, { passive: true });

  // ─── نافذة تفاصيل الطبق ───
  const menuEl = document.getElementById('dynamic-menu-sections');
  menuEl.addEventListener('click', (e) => {
    const add = e.target.closest('[data-add]');
    if (add) {
      e.stopPropagation();
      if (sizesOf(productById(add.dataset.add)).length) openModal(add.dataset.add);
      else addToCart(add.dataset.add, 1);
      return;
    }
    const card = e.target.closest('[data-product]');
    if (card) openModal(card.dataset.product);
  });
  menuEl.addEventListener('keydown', (e) => {
    const card = e.target.closest('[data-product]');
    if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openModal(card.dataset.product); }
  });

  function openModal(id) {
    const p = allProducts.find(x => String(x.id) === String(id));
    if (!p) return;
    const img = safeUrl(p.image_url);
    const modalImg = document.getElementById('modalImg');
    modalImg.parentElement.classList.toggle('hidden', !img);
    modalImg.src = img || '';
    document.getElementById('modalImgBlur').style.backgroundImage = img ? `url("${img.replace(/"/g, '%22')}")` : '';
    document.getElementById('modalTitle').closest('.p-5').classList.toggle('pt-14', !img);
    document.getElementById('modalTitle').textContent = productName(p);
    modalSize = sizesOf(p).length ? sizesOf(p)[0].name : null;

    // التفاصيل بالترتيب: الوصف ← معلومات إضافية ← ملاحظة
    const Lx = currentLang === 'ar' ? 0 : 1;
    const details = [
      [['الوصف', 'Description'], productDesc(p)],
      [['معلومات إضافية', 'Additional info'], tr(p.extra_info)],
      [['ملاحظة', 'Note'], tr(p.note)]
    ].filter(([, v]) => v && String(v).trim());
    document.getElementById('modalDetails').innerHTML = details.map(([label, v]) =>
      `<p><b class="text-white font-black">${label[Lx]} :</b> ${esc(v)}</p>`).join('');

    // السعرات على زاوية الصورة (إذا كان المتجر مفعّلها)
    const cal = document.getElementById('modalCal');
    const showCal = caloriesOn() && p.calories != null && !!img;
    cal.classList.toggle('hidden', !showCal);
    cal.classList.toggle('inline-flex', showCal);
    if (showCal) cal.innerHTML = `<i class="fa-solid fa-fire-flame-simple text-amber-500"></i> ${Number(p.calories)} ${Lx ? 'kcal' : 'سعرة حرارية'}`;
    renderCoffeeModal(p.coffee);

    const L = currentLang === 'ar' ? 0 : 1;
    const meta = [];
    if (caloriesOn() && p.calories != null && !img) {
      meta.push(`<span class="inline-flex items-center gap-1 bg-amber-400/15 text-amber-200 border border-amber-400/30 text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-fire-flame-simple"></i> ${Number(p.calories)} ${L ? 'kcal' : 'سعرة حرارية'}</span>`);
    }
    String(p.allergens || '').split(',').filter(k => ALLERGEN_LABELS[k]).forEach(k => {
      meta.push(`<span class="inline-flex items-center gap-1 bg-white/10 text-gray-200 border border-white/15 text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-triangle-exclamation text-[9px] text-amber-300"></i> ${ALLERGEN_LABELS[k][L]}</span>`);
    });
    document.getElementById('modalMeta').innerHTML = meta.join('');

    const box = document.getElementById('modalOrderBox');
    const canOrder = orderingOn() && p.is_available !== false;
    box.classList.toggle('hidden', !canOrder);
    box.classList.toggle('flex', canOrder);
    modalQty = 1;
    renderModalSizes(p);
    updateModalAdd(p);

    currentModalProduct = p.id;
    trackOnce(`d:${p.id}`, 'dish', p.id);
    document.getElementById('productModal').classList.remove('opacity-0', 'pointer-events-none');
  }

  let currentModalProduct = null, modalQty = 1, modalSize = null;

  function renderModalSizes(p) {
    const box = document.getElementById('modalSizes');
    const zs = sizesOf(p);
    box.classList.toggle('hidden', !zs.length);
    box.classList.toggle('flex', zs.length > 0);
    box.innerHTML = zs.map((z, i) => `
      <button type="button" data-size="${i}" class="size-chip ${z.name === modalSize ? 'on' : ''} px-3.5 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5">
        <span>${esc(sizeName(z))}</span><span class="opacity-75">${esc(money(discounted(p, Number(z.price))))}</span>
      </button>`).join('');
  }
  document.getElementById('modalSizes').addEventListener('click', (e) => {
    const b = e.target.closest('[data-size]'); if (!b) return;
    const p = productById(currentModalProduct); if (!p) return;
    const z = sizesOf(p)[Number(b.dataset.size)]; if (!z) return;
    modalSize = z.name;
    renderModalSizes(p);
    updateModalAdd(p);
  });

  // ─── سلة الطلب عبر واتساب ───
  const T = (ar, en) => currentLang === 'ar' ? ar : en;
  let cart = [];   // [{ id, size, qty }] — size = اسم الحجم أو null
  let coupon = null; // نتيجة فحص الكوبون من الخادم: { coupon, subtotal, discount, total }
  const cartKey = () => `cart:${project.id}`;
  const waNumber = () => String((project && project.whatsapp_number) || '').replace(/\D/g, '');
  // الطلب للكاشير من المنيو (صاحب المحل مشغّله): 'table' طاولات، 'self' خدمة ذاتية مع رقم بيجر. وإلا واتساب
  const directMode = () => (project && ['table', 'self'].includes(project.order_mode)) ? project.order_mode : null;
  const orderingOn = () => {
    if (directMode()) return true;
    const wa = waNumber();
    const valid = wa.startsWith('966') ? /^9665\d{8}$/.test(wa) : /^[1-9]\d{10,14}$/.test(wa);
    return !!(project && project.whatsapp_orders && valid);
  };
  const cartQty = (id) => cart.filter(c => String(c.id) === String(id)).reduce((n, c) => n + c.qty, 0);
  const sameLine = (c, id, size, note) => String(c.id) === String(id) && (c.size || null) === (size || null) && (c.note || null) === (note || null);
  const lineName = (p, c) => productName(p) + (c.size ? ` (${sizeName(sizesOf(p).find(z => z.name === c.size) || { name: c.size })})` : '');
  const productById = (id) => allProducts.find(x => String(x.id) === String(id));
  const round2 = (n) => Math.round(n * 100) / 100;

  function loadCart() {
    try { cart = JSON.parse(sessionStorage.getItem(cartKey()) || '[]'); } catch { cart = []; }
    // نشيل أي صنف انحذف أو صار غير متوفر
    cart = cart.filter(c => {
      const p = productById(c.id);
      if (!p || p.is_available === false || !(c.qty > 0)) return false;
      // الحجم لازم يكون موجود للطبق اللي له أحجام، وفاضي للطبق اللي ما له
      return sizesOf(p).length ? unitPrice(p, c.size) !== null : !c.size;
    }).map(c => ({ id: c.id, size: c.size || null, qty: c.qty, note: c.note || null }));
  }
  function saveCart() {
    try { sessionStorage.setItem(cartKey(), JSON.stringify(cart)); } catch {}
    renderCartBar();
    handleSearch();   // تحديث أرقام الكمية على البطاقات
    // أي تغيير في السلة يعيد حساب الكوبون من الخادم
    if (coupon) { clearTimeout(saveCart.t); saveCart.t = setTimeout(() => cart.length ? applyCoupon(true) : resetCoupon(), 350); }
  }
  function cartTotals() {
    let count = 0, total = 0;
    cart.forEach(c => { const p = productById(c.id); const u = p && unitPrice(p, c.size); if (u != null) { count += c.qty; total += u * c.qty; } });
    return { count, total: round2(total) };
  }

  function menuToast(msg) {
    const t = document.getElementById('menuToast');
    document.getElementById('menuToastText').textContent = msg;
    t.classList.remove('opacity-0', '-translate-y-3');
    clearTimeout(menuToast.t);
    menuToast.t = setTimeout(() => t.classList.add('opacity-0', '-translate-y-3'), 1600);
  }

  function addToCart(id, qty, size = null, note = null) {
    note = directMode() ? (String(note || '').trim().slice(0, 100) || null) : null;
    const p = productById(id);
    if (!p || p.is_available === false || !orderingOn()) return;
    if (sizesOf(p).length && unitPrice(p, size) === null) return openModal(id);
    if (!sizesOf(p).length) size = null;
    const item = cart.find(c => sameLine(c, p.id, size, note));
    if (item) item.qty = Math.min(directMode() ? 20 : 99, item.qty + qty);
    else cart.push({ id: p.id, size, qty: Math.min(directMode() ? 20 : 99, qty), note });
    saveCart();
    const n = lineName(p, { size });
    menuToast(T(`أُضيف للطلب: ${n}`, `Added: ${n}`));
  }
  function setQty(i, qty) {
    if (!cart[i]) return;
    if (qty <= 0) cart.splice(i, 1); else cart[i].qty = Math.min(directMode() ? 20 : 99, qty);
    saveCart();
    renderCartItems();
    if (!cart.length) closeCart();
  }

  function renderCartBar() {
    const bar = document.getElementById('cartBar');
    const { count, total } = cartTotals();
    const show = orderingOn() && count > 0;
    bar.classList.toggle('hidden', !show);
    bar.classList.toggle('flex', show);
    document.body.style.paddingBottom = show ? '96px' : '';
    if (!show) return;
    document.getElementById('cartCount').textContent = count;
    document.getElementById('cartBarText').textContent = T('عرض الطلب', 'View order');
    document.getElementById('cartBarTotal').textContent = money(coupon ? coupon.total : total);
  }

  function renderCartItems() {
    document.getElementById('cartItems').innerHTML = cart.map((c, i) => {
      const p = productById(c.id); if (!p) return '';
      const u = unitPrice(p, c.size) || 0;
      return `
        <li class="bg-white/5 border border-white/10 rounded-2xl p-2.5">
          <div class="flex items-center gap-3">
            <div class="flex-1 min-w-0">
              <p class="text-sm font-bold text-white leading-snug line-clamp-2">${esc(lineName(p, c))}</p>
              <p class="text-[11px] text-gray-400 mt-0.5">${esc(money(round2(u * c.qty)))}</p>
            </div>
            <div class="flex items-center bg-white/10 border border-white/15 rounded-xl shrink-0" dir="ltr">
              <button type="button" onclick="setQty(${i}, ${c.qty - 1})" aria-label="-" class="w-9 h-9 text-white font-black">${c.qty === 1 ? '<i class="fa-solid fa-trash text-[11px] text-red-300"></i>' : '−'}</button>
              <span class="w-6 text-center text-sm font-black text-white">${c.qty}</span>
              <button type="button" onclick="setQty(${i}, ${c.qty + 1})" aria-label="+" class="w-9 h-9 text-white font-black">+</button>
            </div>
          </div>
          ${directMode() ? `<input data-note="${i}" value="${esc(c.note || '')}" maxlength="100" autocomplete="off" placeholder="${esc(T('ملاحظة على هذا الصنف (اختياري)', 'Note for this item (optional)'))}" class="mt-2 w-full bg-white/5 border border-white/15 rounded-lg px-2.5 py-2 text-amber-100 placeholder-gray-500 focus:outline-none focus:border-white/40" style="font-size:16px">` : ''}
        </li>`;
    }).join('');
    renderCouponTotals();
  }

  // ملاحظة الصنف تنحفظ وهو يكتب (بدون إعادة رسم السلة عشان ما يطلع الكيبورد)
  document.getElementById('cartItems').addEventListener('input', (e) => {
    const el = e.target.closest('[data-note]'); if (!el || !cart[+el.dataset.note]) return;
    cart[+el.dataset.note].note = el.value.slice(0, 100) || null;
    try { sessionStorage.setItem(cartKey(), JSON.stringify(cart)); } catch {}
  });
  // ─── كوبون الخصم (الخادم يتحقق منه ويحسب الخصم بأسعار قاعدة البيانات) ───
  function renderCouponTotals() {
    const row = document.getElementById('discountRow');
    row.classList.toggle('hidden', !coupon); row.classList.toggle('flex', !!coupon);
    if (coupon) {
      document.getElementById('discountLabel').textContent = `${T('الخصم', 'Discount')} (${coupon.coupon.code})`;
      document.getElementById('discountValue').textContent = `− ${money(coupon.discount)}`;
    }
    document.getElementById('cartTotal').textContent = money(coupon ? coupon.total : cartTotals().total);
    document.getElementById('couponBtn').textContent = coupon ? T('إزالة', 'Remove') : T('تطبيق', 'Apply');
  }
  function couponMsg(text, ok) {
    const m = document.getElementById('couponMsg');
    m.textContent = text || '';
    m.classList.toggle('hidden', !text);
    m.className = `${text ? '' : 'hidden '}text-[11px] font-bold ${ok ? 'text-green-300' : 'text-red-300'}`;
  }
  function resetCoupon() {
    coupon = null;
    document.getElementById('couponInput').value = '';
    couponMsg('');
    renderCouponTotals();
    renderCartBar();
  }
  async function applyCoupon(silent = false) {
    if (!silent && coupon) return resetCoupon();   // الزر يصير "إزالة" بعد التطبيق
    const code = document.getElementById('couponInput').value.trim().toUpperCase();
    if (!code) return couponMsg(T('اكتب رمز الكوبون', 'Enter a coupon code'), false);
    const btn = document.getElementById('couponBtn');
    btn.disabled = true;
    try {
      coupon = await DM.post('/api/public?action=coupon', {
        slug: project.client_slug, code, items: cart.map(c => ({ id: c.id, size: c.size, qty: c.qty }))
      });
      couponMsg(T(`تم تطبيق الكوبون، وفّرت ${money(coupon.discount)}`, `Coupon applied — you save ${money(coupon.discount)}`), true);
    } catch (e) {
      coupon = null;
      couponMsg(e.status === 0 ? T('تعذر الاتصال، حاول مرة ثانية', 'Connection failed, try again') : (currentLang === 'ar' ? e.message : 'This coupon cannot be applied'), false);
    } finally {
      btn.disabled = false;
      renderCouponTotals();
      renderCartBar();
    }
  }
  document.getElementById('couponInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (!coupon) applyCoupon(); } });

  function openCart() {
    if (!cart.length) return;
    const dm = directMode();
    document.getElementById('cartTitle').innerHTML = `<i class="${dm ? 'fa-solid fa-list' : 'fa-brands fa-whatsapp text-[#25d366]'}"></i> ${T('طلبك', 'Your order')}`;
    document.getElementById('cartNoteLabel').textContent = T('ملاحظات على الطلب (اختياري)', 'Order notes (optional)');
    document.getElementById('cartNote').placeholder = T('مثال: بدون بصل، سكر خفيف...', 'e.g. no onions, less sugar...');
    document.getElementById('cartTotalLabel').textContent = T('المجموع', 'Total');
    document.getElementById('cartSendText').textContent = dm ? T('أرسل الطلب للكاشير', 'Send order to the cashier') : T('إرسال الطلب عبر واتساب', 'Send order via WhatsApp');
    document.querySelector('#cartSend i').className = dm ? 'fa-solid fa-arrow-up text-lg' : 'fa-brands fa-whatsapp text-lg';
    renderDirect();
    document.getElementById('cartClear').textContent = T('تفريغ الطلب', 'Clear order');
    document.getElementById('couponBox').classList.toggle('hidden', project.has_coupons !== true);
    document.getElementById('couponLabel').textContent = T('كوبون خصم', 'Discount coupon');
    renderCartItems();
    document.getElementById('cartModal').classList.remove('opacity-0', 'pointer-events-none');
    lockPage(true);
  }
  function closeCart() { document.getElementById('cartModal').classList.add('opacity-0', 'pointer-events-none'); lockPage(false); fitCart(); }
  // الصفحة اللي ورا نافذة الطلب تثبت مكانها (سفاري ما يقدر يمرّرها لما يطلع الكيبورد، فما تهتز النافذة)
  let lockedY = null;
  function lockPage(on) {
    const b = document.body;
    if (on && lockedY === null) {
      lockedY = window.scrollY;
      Object.assign(b.style, { position: 'fixed', top: `-${lockedY}px`, left: '0', right: '0', width: '100%' });
    } else if (!on && lockedY !== null) {
      Object.assign(b.style, { position: '', top: '', left: '', right: '', width: '' });
      window.scrollTo(0, lockedY); lockedY = null;
    }
  }
  // الكيبورد في نافذة الطلب (ملاحظة الصنف، رقم الطاولة): النافذة تاخذ المساحة الظاهرة بالضبط وتثبت،
  // والخانة اللي يكتب فيها تبقى ظاهرة، والصفحة اللي وراها ما تتحرك (نفس طريقة المساعد)
  let cartFit = 0;
  const cartOpen = () => !document.getElementById('cartModal').classList.contains('opacity-0');
  function fitCart() {
    if (cartFit) return;
    cartFit = requestAnimationFrame(() => {
      cartFit = 0;
      const m = document.getElementById('cartModal'), panel = m.querySelector('.modal-panel'), vv = window.visualViewport;
      const kb = !!vv && cartOpen() && window.innerHeight - vv.height > 120;
      if (!kb) { m.style.top = m.style.height = m.style.bottom = m.style.transition = panel.style.maxHeight = ''; return; }
      // بالضبط فوق الكيبورد: بدون حركة، والقيم تتغير بس لو تغيّرت فعلاً (عشان ما ترجف)
      const top = `${Math.round(vv.offsetTop)}px`, h = `${Math.round(vv.height)}px`;
      m.style.transition = 'opacity .3s'; m.style.bottom = 'auto';
      if (m.style.top !== top) m.style.top = top;
      if (m.style.height !== h) m.style.height = h;
      const mh = `${Math.round(vv.height) - 6}px`; if (panel.style.maxHeight !== mh) panel.style.maxHeight = mh;
    });
  }
  // الخانة اللي ضغطها تنزل لمكان ظاهر داخل النافذة (مرة وحدة بعد ما يطلع الكيبورد)
  function showField() {
    const a = document.activeElement, panel = document.querySelector('#cartModal .modal-panel');
    if (!a || !panel.contains(a) || !/INPUT|TEXTAREA/.test(a.tagName)) return;
    const r = a.getBoundingClientRect(), pr = panel.getBoundingClientRect();
    if (r.bottom > pr.bottom - 12 || r.top < pr.top + 70) panel.scrollTop += r.top - pr.top - pr.height / 2 + r.height / 2;
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', fitCart); visualViewport.addEventListener('scroll', fitCart); }
  document.getElementById('cartModal').addEventListener('focusin', () => { [60, 250, 500].forEach(t => setTimeout(fitCart, t)); setTimeout(showField, 450); });
  document.getElementById('cartModal').addEventListener('focusout', () => setTimeout(fitCart, 150));
  // وهو فاتح الطلب: السحب برّا قائمة الطلب ما يحرّك المنيو اللي وراه
  document.addEventListener('touchmove', (e) => {
    if (!cartOpen()) return;
    const panel = e.target.closest('#cartModal .modal-panel');
    if (panel && panel.scrollHeight > panel.clientHeight + 1) return;
    e.preventDefault();
  }, { passive: false });
  function clearCart() { cart = []; resetCoupon(); saveCart(); closeCart(); }

  // رسالة واحدة فيها كل الأصناف والكميات والمجموع
  function sendCart() {
    if (!cart.length || !orderingOn()) return;
    if (directMode()) return sendDirect();
    const ar = currentLang === 'ar';
    const cur = DM.currencyText(project && project.currency, currentLang);
    const lines = cart.map(c => {
      const p = productById(c.id); if (!p) return '';
      const u = unitPrice(p, c.size); if (u == null) return '';
      const sub = round2(u * c.qty);
      return ar ? `• ${c.qty} × ${p.name}${c.size ? ` (${c.size})` : ''} — ${sub} ${cur}` : `• ${c.qty} × ${lineName(p, c)} — ${sub} ${cur}`;
    }).filter(Boolean);
    const { total } = cartTotals();
    const baseTotal = round2(cart.reduce((n, c) => { const p = productById(c.id); const b = p && basePrice(p, c.size); return b == null ? n : n + b * c.qty; }, 0));
    const autoSaved = round2(baseTotal - total);
    const dealLine = autoSaved > 0 ? [ar ? `خصم العروض: ${autoSaved} ${cur} (الأسعار أعلاه بعد الخصم)` : `Deals: −${autoSaved} ${cur} (prices above are discounted)`] : [];
    // مع الكوبون: المجموع قبل الخصم + الخصم + المطلوب دفعه (أرقام الخادم)
    const totals = coupon
      ? (ar ? [`المجموع: ${coupon.subtotal} ${cur}`, `كوبون ${coupon.coupon.code}: خصم ${coupon.discount} ${cur}`, `المطلوب: ${coupon.total} ${cur}`]
            : [`Subtotal: ${coupon.subtotal} ${cur}`, `Coupon ${coupon.coupon.code}: −${coupon.discount} ${cur}`, `Total: ${coupon.total} ${cur}`])
      : [ar ? `المجموع: ${total} ${cur}` : `Total: ${total} ${cur}`];
    const note = document.getElementById('cartNote').value.trim();
    const msg = ar
      ? [`مرحباً ${project.name || ''} 👋`, 'أبغى أطلب:', ...lines, '', ...dealLine, ...totals, ...(note ? [`ملاحظات: ${note}`] : []), '', '(طلب من المنيو الرقمي)'].join('\n')
      : [`Hello ${project.name || ''} 👋`, "I'd like to order:", ...lines, '', ...dealLine, ...totals, ...(note ? [`Notes: ${note}`] : []), '', '(Order from the digital menu)'].join('\n');
    if (coupon) DM.post('/api/public?action=coupon-redeem', { slug: project.client_slug, code: coupon.coupon.code }).catch(() => {});

    // تسجيل الطلب في الإحصائيات (مجهول)
    cart.forEach(c => DM.post('/api/public?action=track', { client_id: project.id, kind: 'order', product_id: c.id }).catch(() => {}));

    window.open(`https://wa.me/${waNumber()}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
    cart = [];
    resetCoupon();
    document.getElementById('cartNote').value = '';
    saveCart();
    closeCart();
  }

  // ─── الطلب للكاشير (بدون واتساب) ───
  // الطاولات: رقم الطاولة إجباري. الخدمة الذاتية: محلي أو سفري، والطاولة اختيارية للمحلي، ويطلع له رقم بيجر
  let dine = 'in', tableEdit = false;
  // رقم الطاولة من QR الطاولة (?table=12): ينحفظ للجلسة عشان يبقى لو تنقّل في المنيو
  const qrTable = (() => {
    const v = String(urlParams.get('table') || '').trim().replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) & 15)).toUpperCase();
    return /^[A-Z0-9-]{1,6}$/.test(v) ? v : '';
  })();
  const devId = () => { try { let d = localStorage.getItem('dm_dev'); if (!d) { d = Array.from(crypto.getRandomValues(new Uint8Array(18)), b => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'[b & 63]).join(''); localStorage.setItem('dm_dev', d); } return d; } catch { return ''; } };
  const tableKey = () => `dm_table_${project.id}`;
  function renderDirect() {
    const dm = directMode();
    document.getElementById('cartDirect').classList.toggle('hidden', !dm);
    // الطلب للكاشير: الملاحظة على كل صنف لحاله (تحت اسمه)، بدل ملاحظة عامة
    document.getElementById('cartNoteBox').classList.toggle('hidden', !!dm);
    if (!dm) return;
    const self = dm === 'self';
    document.getElementById('dineBox').classList.toggle('hidden', !self);
    document.querySelectorAll('[data-dine]').forEach(b => { b.classList.toggle('on', b.dataset.dine === dine); b.setAttribute('aria-checked', b.dataset.dine === dine); });
    document.getElementById('dineInText').textContent = T('محلي', 'Dine in');
    document.getElementById('dineOutText').textContent = T('سفري', 'Takeaway');
    const ti0 = document.getElementById('tableInput');
    const fixed = !tableEdit && !!qrTable && !(self && dine === 'out');
    if (fixed) ti0.value = qrTable;
    document.getElementById('tableFixed').classList.toggle('hidden', !fixed); document.getElementById('tableFixed').classList.toggle('flex', fixed);
    document.getElementById('tableFixedNo').textContent = qrTable || '';
    document.getElementById('tableFixedLabel').textContent = T('طاولتك', 'Your table');
    document.getElementById('tableChange').textContent = T('تغيير', 'Change');
    document.getElementById('tableBox').classList.toggle('hidden', fixed || (self && dine === 'out'));
    document.getElementById('tableLabel').textContent = self ? T('رقم الطاولة (اختياري)', 'Table number (optional)') : T('رقم الطاولة', 'Table number');
    const ti = document.getElementById('tableInput');
    // رقم الطاولة من رابط QR الطاولة (?table=) أو آخر مرة
    if (!ti.value) { try { ti.value = urlParams.get('table') || sessionStorage.getItem(tableKey()) || ''; } catch {} }
    document.getElementById('directMsg').classList.add('hidden');
  }
  document.getElementById('tableChange').addEventListener('click', () => { tableEdit = true; renderDirect(); const t = document.getElementById('tableInput'); t.focus(); t.select(); });
  document.getElementById('dineBox').addEventListener('click', (e) => { const b = e.target.closest('[data-dine]'); if (b) { dine = b.dataset.dine; renderDirect(); } });
  function directErr(msg) { const m = document.getElementById('directMsg'); m.textContent = msg; m.classList.remove('hidden'); }
  async function sendDirect() {
    const dm = directMode();
    // معاينة لوحة التحكم: نوري صاحب المحل الخطوات بدون ما يوصل طلب للكاشير
    if (urlParams.get('preview') === '1') return directErr(T('هذي معاينة: الطلب ما ينرسل للكاشير', 'Preview only: the order is not sent'));
    const table = document.getElementById('tableInput').value.trim().replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) & 15));
    if (dm === 'table' && !table) { directErr(T('اكتب رقم طاولتك عشان يوصلك الطلب', 'Enter your table number')); return document.getElementById('tableInput').focus(); }
    const btn = document.getElementById('cartSend'); btn.disabled = true;
    const body = { items: cart.map(c => ({ id: c.id, qty: c.qty, size: c.size, note: c.note })), note: '', table: dm === 'self' && dine === 'out' ? '' : table, coupon: coupon ? coupon.coupon.code : undefined };
    try {
      try { if (table) sessionStorage.setItem(tableKey(), table); } catch {}
      if (dm === 'self') {
        const lt = await DM.loyaltyToken(project.client_slug).catch(() => '');
        const r = await DM.post('/api/pager?action=take', { slug: project.client_slug, dev: devId(), lt: lt || undefined, order: { ...body, dine } });
        cart.forEach(c => DM.post('/api/public?action=track', { client_id: project.id, kind: 'order', product_id: c.id }).catch(() => {}));
        try { localStorage.setItem(`dm_pager_${String(project.client_slug).toLowerCase()}`, r.token); } catch {}
        cart = []; resetCoupon(); saveCart();
        location.href = DM.storePage('pager', project.client_slug);
        return;
      }
      const r = await DM.post('/api/public?action=order', { slug: project.client_slug, dev: devId(), lang: currentLang, ...body });
      cart.forEach(c => DM.post('/api/public?action=track', { client_id: project.id, kind: 'order', product_id: c.id }).catch(() => {}));
      myOrders = [{ token: r.token, ...r.order }, ...myOrders.filter(o => o.token !== r.token)].slice(0, 5);
      saveOrders(); watchOrder(r.live); clearTimeout(refreshOrders.t); refreshOrders.t = setTimeout(refreshOrders, 8000);
      cart = []; resetCoupon(); document.getElementById('cartNote').value = ''; saveCart(); closeCart();
      renderOrders(); openOrders();
    } catch (e) {
      // صاحب المحل غيّر طريقة الطلب: نحدّث المنيو عشان تطلع الطريقة الجديدة
      if (e.code === 'ORDERS_OFF') return checkForUpdates(true).then(() => {
        if (!orderingOn()) return closeCart();
        openCart(); directErr(T('تغيّرت طريقة الطلب في المحل، راجع طلبك وأرسله مرة ثانية', 'The ordering method changed, please review and send again'));
      });
      directErr(e.status === 0 ? T('تعذر الاتصال، حاول مرة ثانية', 'Connection failed, try again') : (currentLang === 'ar' ? (e.message || 'ما انرسل الطلب، حاول مرة ثانية') : 'The order was not sent, please try again'));
    } finally { btn.disabled = false; }
  }

  // ─── طلباتي (الطاولات): تتحفظ في الجوال، والحالة تتحدث لحظياً ───
  let myOrders = [];
  const ordersKey = () => `dm_mo_${project.id}`;
  function saveOrders() { try { localStorage.setItem(ordersKey(), JSON.stringify(myOrders.map(o => ({ token: o.token, at: o.created_at })))); } catch {} }
  function watchOrder(topic) { if (topic && !watchOrder.on.has(topic)) { watchOrder.on.add(topic); DM.live(topic, () => refreshOrders()); } }
  watchOrder.on = new Set();
  // رجع للمنيو من تطبيق ثاني: نحدّث حالة طلباته على طول
  document.addEventListener('visibilitychange', () => { if (!document.hidden && project && directMode() === 'table') refreshOrders(); });
  async function refreshOrders() {
    let saved = []; try { saved = JSON.parse(localStorage.getItem(ordersKey()) || '[]'); } catch {}
    saved = saved.filter(o => o && o.token && Date.now() - Date.parse(o.at || 0) < 12 * 3600e3);
    if (!saved.length) { myOrders = []; return renderOrders(); }
    try {
      const r = await DM.get(`/api/public?action=order-status&slug=${encodeURIComponent(project.client_slug)}&t=${saved.map(o => o.token).join(',')}`);
      const before = new Map(myOrders.map(o => [o.token, o.status]));
      myOrders = r.orders.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
      // اللي خلص من أكثر من دقيقة ما نحتاج نسأل عنه مرة ثانية
      myOrders = myOrders.filter(o => ['new', 'accepted'].includes(o.status) || Date.now() - Date.parse(o.closed_at || o.created_at) < 60000);
      saveOrders();
      // التحديث اللحظي لكل طلب مفتوح (حتى بعد ما يحدّث الصفحة)
      myOrders.forEach(o => watchOrder(o.live));
      // تغيّرت الحالة: تنبيه صغير + اهتزاز
      const changed = myOrders.find(o => before.has(o.token) && before.get(o.token) !== o.status);
      if (changed) { menuToast(ST[changed.status][currentLang === 'ar' ? 0 : 1]); try { navigator.vibrate && navigator.vibrate(200); } catch {} }
    } catch {}
    renderOrders();
    clearTimeout(refreshOrders.t);
    // احتياطي لو التحديث اللحظي انقطع: كل 8 ثواني طول ما فيه طلب مفتوح
    if (myOrders.some(o => ['new', 'accepted'].includes(o.status))) refreshOrders.t = setTimeout(refreshOrders, 8000);
  }
  const ST = { new: ['وصل طلبك للكاشير', 'Sent to the cashier'], accepted: ['الكاشير استلم طلبك، وجاري تحضيره', 'The cashier has it, being prepared'], served: ['تم تقديم طلبك، بالعافية', 'Served, enjoy'], cancelled: ['انلغى الطلب، كلّم الكاشير', 'Cancelled, ask the cashier'] };
  function renderOrders() {
    const bar = document.getElementById('moBar');
    // الطلب اللي انقدّم أو انلغى: يطلع دقيقة بس عشان يشوفه، وبعدها يختفي من المنيو
    const live = myOrders.filter(o => ['new', 'accepted'].includes(o.status) || Date.now() - Date.parse(o.closed_at || o.created_at) < 60000);
    clearTimeout(renderOrders.t);
    if (live.some(o => !['new', 'accepted'].includes(o.status))) renderOrders.t = setTimeout(renderOrders, 61000);
    const top = live[0];
    bar.classList.toggle('hidden', !top); bar.classList.toggle('flex', !!top);
    if (top) {
      const L = currentLang === 'ar' ? 0 : 1;
      bar.className = `${bar.className.replace(/\bst-\w+/g, '').trim()} st-${top.status}`;
      bar.innerHTML = `<i class="fa-solid ${top.status === 'served' ? 'fa-utensils text-green-700' : top.status === 'accepted' ? 'fa-fire text-amber-700' : 'fa-clock'} text-xl"></i>
        <span class="flex-1 min-w-0"><b class="block text-sm font-black">${ST[top.status][L]}</b><small class="block text-[11px] font-bold opacity-70">${top.table_no ? `${T('طاولة', 'Table')} <span dir="ltr">${esc(top.table_no)}</span> · ` : ''}${esc(money(top.total))}${live.length > 1 ? ` · ${T(`${live.length} طلبات`, `${live.length} orders`)}` : ''}</small></span>
        <span class="text-[11px] font-black underline">${T('التفاصيل', 'Details')}</span>`;
    }
    document.getElementById('moTitle').textContent = T('طلباتك', 'Your orders');
    const step = (o) => { const i = { new: 0, accepted: 1, served: 2 }[o.status] ?? -1; return `<div class="mo-steps">${[['وصل', 'Sent'], ['يتحضّر', 'Preparing'], ['انقدّم', 'Served']].map((x, k) => `<span class="${k <= i ? 'on' : ''}">${x[currentLang === 'ar' ? 0 : 1]}</span>`).join('')}</div>`; };
    if (!live.length) closeOrders();
    document.getElementById('moList').innerHTML = live.length ? live.map(o => `
      <div class="bg-white/5 border border-white/10 rounded-2xl p-3.5 space-y-2.5">
        <div class="flex items-center justify-between gap-2"><b class="text-white text-sm font-black">${o.table_no ? `${T('طاولة', 'Table')} <span dir="ltr">${esc(o.table_no)}</span>` : T('طلبك', 'Your order')}</b><span class="text-[11px] font-bold text-gray-400">${new Date(o.created_at).toLocaleTimeString(currentLang === 'ar' ? 'ar-SA-u-nu-latn' : 'en-GB', { hour: '2-digit', minute: '2-digit' })}</span></div>
        ${o.status === 'cancelled' ? `<p class="text-[12px] font-black text-red-300">${ST.cancelled[currentLang === 'ar' ? 0 : 1]}</p>` : step(o)}
        <ul class="space-y-1">${(o.items || []).map(i => `<li class="text-[13px] text-white"><b>${i.qty}×</b> ${esc(i.name)}${i.size ? ` <span class="text-gray-400">(${esc(i.size)})</span>` : ''}${i.note ? `<span class="block text-[11px] text-amber-200 font-bold">${esc(i.note)}</span>` : ''}</li>`).join('')}</ul>
        ${o.note ? `<p class="text-[11px] text-gray-300">${T('ملاحظات', 'Notes')}: ${esc(o.note)}</p>` : ''}
        <div class="flex items-center justify-between border-t border-white/10 pt-2"><span class="text-[12px] text-gray-300 font-bold">${T('المجموع (تدفعه عند الكاشير)', 'Total (pay at the counter)')}</span><b class="text-white">${esc(money(o.total))}</b></div>
      </div>`).join('') : `<p class="text-sm text-gray-400 text-center">${T('ما عندك طلبات', 'No orders yet')}</p>`;
  }
  function openOrders() { renderOrders(); document.getElementById('moModal').classList.remove('opacity-0', 'pointer-events-none'); }
  function closeOrders() { document.getElementById('moModal').classList.add('opacity-0', 'pointer-events-none'); }
  document.getElementById('moModal').addEventListener('click', (e) => { if (e.target.id === 'moModal') closeOrders(); });

  // أزرار الكمية في نافذة الطبق
  function updateModalAdd(p) {
    const u = unitPrice(p, modalSize) ?? minPrice(p);
    const b = basePrice(p, modalSize) ?? minBase(p);
    document.getElementById('modalPrice').innerHTML = priceHtml(b, u);
    document.getElementById('mQty').textContent = modalQty;
    document.getElementById('mAddText').textContent =
      `${T('أضف للطلب', 'Add to order')} · ${money(round2(u * modalQty))}`;
  }
  document.getElementById('mQtyMinus').addEventListener('click', () => {
    const p = productById(currentModalProduct); if (!p) return;
    modalQty = Math.max(1, modalQty - 1); updateModalAdd(p);
  });
  document.getElementById('mQtyPlus').addEventListener('click', () => {
    const p = productById(currentModalProduct); if (!p) return;
    modalQty = Math.min(directMode() ? 20 : 99, modalQty + 1); updateModalAdd(p);
  });
  document.getElementById('mAddBtn').addEventListener('click', () => {
    addToCart(currentModalProduct, modalQty, modalSize);
    closeModal();
  });
  document.getElementById('cartModal').addEventListener('click', (e) => { if (e.target.id === 'cartModal') closeCart(); });

  function closeModal() {
    document.getElementById('productModal').classList.add('opacity-0', 'pointer-events-none');
    closeImgViewer();
  }
  // الصورة بملء الشاشة (تقدر تكبّرها بإصبعين)
  function openImgViewer() {
    const src = document.getElementById('modalImg').src;
    if (!src) return;
    const v = document.getElementById('imgViewer');
    v.querySelector('img').src = src;
    v.querySelector('p').textContent = document.getElementById('modalTitle').textContent;
    v.classList.remove('hidden'); v.classList.add('flex');
  }
  function closeImgViewer() { const v = document.getElementById('imgViewer'); v.classList.add('hidden'); v.classList.remove('flex'); }
  document.getElementById('productModal').addEventListener('click', (e) => { if (e.target.id === 'productModal') closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!document.getElementById('imgViewer').classList.contains('hidden')) return closeImgViewer(); closeModal(); closeCart(); } });

  initMenu();
</script>
</body>
</html>
