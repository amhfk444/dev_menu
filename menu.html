<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنيو الرقمي الفاخر | Dev Menu</title>

<!-- Tailwind CSS & FontAwesome -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Cairo', sans-serif;
    background-color: #0b0b0b;
    color: #f5f5f5;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #bg-media-container {
    position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden;
  }
  #bg-video, #bg-image {
    width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75) contrast(1.05);
  }
  .bg-overlay {
    position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(10,10,10,0.4) 0%, rgba(10,10,10,0.85) 100%); z-index: -1;
  }
  .glass-card {
    background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 18px;
    transition: all 0.3s ease;
  }
  .glass-card:active { transform: scale(0.98); }
  .glass-header {
    background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  }
  .leader-line {
    flex: 1 1 10px; border-bottom: 1.5px dotted rgba(255, 255, 255, 0.3); margin: 0 8px 6px 8px;
  }
  .product-img {
    width: 90px; height: 90px; object-fit: cover; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .cat-pill.active {
    background: #ffffff; color: #000000; font-weight: 800; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25);
  }
</style>
</head>

<body class="font-sans antialiased pb-16">

<!-- ميديا الخلفية -->
<div id="bg-media-container">
  <video id="bg-video" autoplay loop muted playsinline class="hidden"></video>
  <img id="bg-image" class="hidden">
</div>
<div class="bg-overlay"></div>

<!-- المحتوى الرئيسي للمنيو -->
<div id="app-content" class="w-full max-w-md mx-auto px-4 pt-4 relative z-10 space-y-5">

  <!-- زر تبديل اللغة وشعار الديجيتال منيو -->
  <div class="flex justify-between items-center">
    <button onclick="toggleLanguage()" class="bg-white/10 hover:bg-white/20 text-white px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition flex items-center gap-2 backdrop-blur-md">
      <i class="fa-solid fa-globe text-white"></i>
      <span id="lang-btn-text">English</span>
    </button>
    <span class="text-[10px] bg-white/10 text-white/80 border border-white/20 px-3 py-1 rounded-full font-bold">Digital Menu</span>
  </div>

  <!-- شريط العروض والرسائل الترويجية -->
  <div id="promo-banner" class="hidden bg-white text-black p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white">
    <div class="w-8 h-8 rounded-xl bg-black text-white flex items-center justify-center shrink-0 text-xs">
      <i class="fa-solid fa-bullhorn"></i>
    </div>
    <div class="flex-1 min-w-0">
      <p id="promo-label" class="text-[10px] font-black uppercase tracking-wider text-gray-600">إعلان / عرض خاص</p>
      <p id="promo-text" class="text-xs font-bold text-black"></p>
    </div>
  </div>

  <!-- الترويسة والشعار -->
  <header class="text-center space-y-3 pt-1">
    <div class="relative w-32 h-32 mx-auto">
      <div class="absolute inset-0 bg-white/10 rounded-full blur-xl"></div>
      <div class="relative w-full h-full p-2 rounded-full bg-black/90 border-2 border-white/40 shadow-2xl flex items-center justify-center overflow-hidden">
        <img id="project-logo" src="images/logo.jpeg" class="w-full h-full object-cover rounded-full" onerror="this.src='https://via.placeholder.com/150/000000/ffffff?text=LOGO'">
      </div>
    </div>
    <div class="space-y-1">
      <h1 id="project-title" class="text-2xl font-black text-white tracking-widest uppercase">Dev Menu</h1>
      <p class="text-xs text-gray-300 font-semibold tracking-wider">RESTAURANT &amp; CAFE</p>
    </div>
  </header>

  <!-- البحث السريع -->
  <div class="relative">
    <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3.5 text-gray-400 text-xs"></i>
    <input type="text" id="search-input" oninput="handleSearch()" placeholder="ابحث عن طبقك المفضل..." 
      class="w-full bg-black/60 border border-white/20 rounded-2xl pr-10 pl-4 py-2.5 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-white backdrop-blur-md shadow-lg">
  </div>

  <!-- شريط الأقسام السريع -->
  <div class="sticky top-2 z-40">
    <div id="fast-filter-bar" class="glass-header rounded-2xl p-1.5 flex gap-2 overflow-x-auto no-scrollbar text-xs border border-white/20 shadow-xl"></div>
  </div>

  <!-- الأقسام والمنتجات -->
  <main id="dynamic-menu-sections" class="space-y-8 min-h-[300px]"></main>

  <!-- أزرار التواصل الاجتماعي -->
  <div id="social-links-container" class="hidden pt-4 pb-2 border-t border-white/10 flex justify-center items-center gap-3"></div>

  <!-- التذييل (مُلغى منه زر تسجيل الدخول نهائياً) -->
  <footer class="text-center pt-8 mt-6 border-t border-white/10 space-y-2">
    <a href="index.html" class="inline-block text-xs font-black text-white/80 hover:text-amber-300 transition">DEV MENU — أنشئ منيوك الرقمي</a>
    <p class="text-[9px] font-bold text-gray-600">© DEV MENU 2026</p>
  </footer>

</div>

<!-- Modal تفاصيل المنتج -->
<div id="productModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/85 backdrop-blur-xl opacity-0 pointer-events-none transition-all duration-300">
  <div class="bg-zinc-900 border border-white/20 w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl relative text-right">
    <button onclick="closeModal()" class="absolute top-4 left-4 z-20 w-8 h-8 rounded-full bg-black/80 text-white flex items-center justify-center border border-white/30">
      <i class="fas fa-xmark"></i>
    </button>
    <div class="relative h-60 bg-black">
      <img id="modalImg" src="" class="w-full h-full object-cover">
    </div>
    <div class="p-5 space-y-3">
      <div class="flex justify-between items-start gap-2">
        <h3 id="modalTitle" class="font-bold text-lg text-white"></h3>
        <span id="modalPrice" class="text-base font-black text-white bg-white/10 px-3 py-1 rounded-xl border border-white/20"></span>
      </div>
      <p id="modalDesc" class="text-xs text-gray-300 leading-relaxed font-normal"></p>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://czdoamcgxgkicrbufpcn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6ZG9hbWNneGdraWNyYnVmcGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTA5MzAsImV4cCI6MjEwNTU4NjkzMH0.45zKx4ljXJ27SS-ukc62qiu52movhDgSoC9OEnK9NHk';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // حماية من حقن الكود: أي نص قادم من قاعدة البيانات يمر من هنا قبل عرضه
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // يقبل روابط http/https فقط (يمنع روابط javascript:)
  function safeUrl(u) {
    if (!u) return '';
    try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : ''; }
    catch { return ''; }
  }
  const urlParams = new URLSearchParams(window.location.search);
  const clientSlug = (urlParams.get('client') || '').trim().toLowerCase();

  let project = null, allProducts = [], allCategories = [];
  let currentLang = 'ar', translating = false;
  const translationCache = {};

  // ─── الترجمة ───
  async function translateText(text) {
    if (!text || translationCache[text]) return;
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|en`);
      const data = await res.json();
      const t = data && data.responseData && data.responseData.translatedText;
      if (t) translationCache[text] = t;
    } catch (e) { console.error(e); }
  }
  // يترجم كل النصوص دفعة وحدة (6 طلبات بالتوازي) بدل طبق طبق
  async function translateAll() {
    const texts = new Set();
    allCategories.forEach(c => c.name && texts.add(c.name));
    allProducts.forEach(p => {
      if (!p.name_en && p.name) texts.add(p.name);
      if (!p.description_en && p.description) texts.add(p.description);
    });
    if (project && project.promo_message) texts.add(project.promo_message);
    const list = [...texts].filter(t => !translationCache[t]);
    for (let i = 0; i < list.length; i += 6) await Promise.all(list.slice(i, i + 6).map(translateText));
  }
  const tr = (t) => (currentLang === 'en' && t) ? (translationCache[t] || t) : (t || '');
  const productName = (p) => currentLang === 'en' ? (p.name_en || tr(p.name)) : p.name;
  const productDesc = (p) => currentLang === 'en' ? (p.description_en || tr(p.description)) : (p.description || '');

  async function toggleLanguage() {
    if (translating) return;
    const btnText = document.getElementById('lang-btn-text');
    if (currentLang === 'ar') {
      translating = true;
      btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Translating...';
      currentLang = 'en';
      await translateAll();
      translating = false;
    } else {
      currentLang = 'ar';
    }
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('search-input').placeholder = currentLang === 'ar' ? 'ابحث عن طبقك المفضل...' : 'Search for your favorite dish...';
    document.getElementById('promo-label').textContent = currentLang === 'ar' ? 'إعلان / عرض خاص' : 'Special offer';
    if (project && project.promo_message) document.getElementById('promo-text').textContent = tr(project.promo_message);
    renderFilterBar();
    handleSearch();
    btnText.textContent = currentLang === 'ar' ? 'English' : 'عربي';
  }

  // ─── تحميل المنيو ───
  function showUnavailable(title, sub) {
    document.getElementById('app-content').innerHTML = `
      <div class="min-h-[85vh] flex flex-col items-center justify-center text-center gap-3 px-6">
        <div class="w-16 h-16 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-2xl"><i class="fa-solid fa-store-slash"></i></div>
        <h1 class="text-lg font-black">${esc(title)}</h1>
        <p class="text-xs text-gray-400 max-w-xs leading-relaxed">${esc(sub)}</p>
        <a href="index.html" class="mt-4 text-[11px] font-bold text-white/60 hover:text-white transition">DEV MENU</a>
      </div>`;
  }

  async function initMenu() {
    if (!clientSlug) return showUnavailable('رابط المنيو غير مكتمل', 'امسح رمز QR الموجود على الطاولة، أو اطلب الرابط الصحيح من المطعم.');

    const { data: p, error } = await supabaseClient.from('public_clients').select('*').eq('client_slug', clientSlug).maybeSingle();
    if (error) { console.error(error); return showUnavailable('تعذر تحميل المنيو', 'تحقق من اتصالك بالإنترنت ثم أعد تحميل الصفحة.'); }
    if (!p) return showUnavailable('المنيو غير متاح حالياً', 'هذا المنيو غير موجود أو متوقف مؤقتاً.');

    project = p;
    document.title = `${p.name || 'Dev Menu'} | المنيو الرقمي`;
    document.getElementById('project-title').textContent = p.name || 'Dev Menu';
    const logo = safeUrl(p.logo_url);
    if (logo) document.getElementById('project-logo').src = logo;

    const promoBanner = document.getElementById('promo-banner');
    if (p.promo_message && p.promo_message.trim() !== '') {
      document.getElementById('promo-text').textContent = p.promo_message;
      promoBanner.classList.remove('hidden');
    }

    renderSocialLinks(p);

    const video = safeUrl(p.bg_video_url), image = safeUrl(p.bg_image_url);
    if (video) {
      const bgVideo = document.getElementById('bg-video');
      bgVideo.src = video;
      bgVideo.classList.remove('hidden');
      bgVideo.play().catch(e => console.log('Autoplay failed:', e));
    } else if (image) {
      const bgImage = document.getElementById('bg-image');
      bgImage.src = image;
      bgImage.classList.remove('hidden');
    }

    const [catRes, prodRes] = await Promise.all([
      supabaseClient.from('categories').select('*').eq('client_id', p.id).order('id', { ascending: true }),
      supabaseClient.from('products').select('*').eq('client_id', p.id).order('id', { ascending: false })
    ]);
    allCategories = catRes.data || [];
    allProducts = prodRes.data || [];

    renderFilterBar();
    renderMenu(allProducts, false);
  }

  function renderSocialLinks(p) {
    const container = document.getElementById('social-links-container');
    const base = 'w-10 h-10 rounded-full flex items-center justify-center transition border';
    const plain = `${base} bg-white/10 hover:bg-white/20 border-white/20 text-white`;
    const wa = String(p.whatsapp_number || '').replace(/\D/g, '');
    const links = [
      [safeUrl(p.website_url),   'fa-solid fa-globe',     plain],
      [safeUrl(p.tiktok_url),    'fa-brands fa-tiktok',   plain],
      [safeUrl(p.instagram_url), 'fa-brands fa-instagram', plain],
      [wa ? `https://wa.me/${wa}` : '', 'fa-brands fa-whatsapp', `${base} bg-green-600/30 hover:bg-green-600/50 border-green-500/40 text-green-300`],
      [safeUrl(p.snapchat_url),  'fa-brands fa-snapchat', plain]
    ].filter(([url]) => url);

    if (links.length === 0) return container.classList.add('hidden');
    container.innerHTML = links.map(([url, icon, cls]) =>
      `<a href="${esc(url)}" target="_blank" rel="noopener" class="${cls}"><i class="${icon}"></i></a>`).join('');
    container.classList.remove('hidden');
  }

  // ─── العرض ───
  const productsIn = (cat, list) => list.filter(p => p.category === cat.key || p.category === cat.name);

  function renderFilterBar() {
    const bar = document.getElementById('fast-filter-bar');
    const cats = allCategories.filter(c => productsIn(c, allProducts).length > 0);
    bar.parentElement.classList.toggle('hidden', cats.length === 0);
    bar.innerHTML = cats.map((c, i) => `
      <button type="button" data-cat="${esc(c.id)}" class="cat-pill ${i === 0 ? 'active' : ''} px-4 py-2 rounded-xl bg-white/10 border border-white/25 shrink-0 text-xs text-white font-bold transition">
        ${esc(tr(c.name))}
      </button>`).join('');
  }

  function productCard(p) {
    const available = p.is_available !== false;
    const img = safeUrl(p.image_url);
    const name = productName(p), desc = productDesc(p);
    const cur = currentLang === 'ar' ? 'ر.س' : 'SAR';
    const cls = available
      ? 'glass-card p-3 flex gap-3 items-center cursor-pointer shadow-lg'
      : 'glass-card p-3 flex gap-3 items-center opacity-45 grayscale';
    return `
      <article ${available ? `data-product="${esc(p.id)}" role="button" tabindex="0"` : ''} class="${cls}">
        ${img
          ? `<img src="${esc(img)}" alt="" loading="lazy" class="product-img">`
          : `<div class="w-[90px] h-[90px] bg-white/10 rounded-2xl flex items-center justify-center shrink-0"><i class="fa-solid fa-utensils text-gray-400"></i></div>`}
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5 min-w-0">
              <h4 class="font-bold text-sm text-white truncate">${esc(name)}</h4>
              ${p.is_bestseller === true ? `<span class="bg-white/20 text-white text-[9px] px-1.5 py-0.5 rounded font-bold border border-white/30 shrink-0"><i class="fa-solid fa-fire text-amber-400"></i> ${currentLang === 'ar' ? 'مميز' : 'Featured'}</span>` : ''}
            </div>
            <span class="leader-line"></span>
            <span class="font-black text-sm text-white shrink-0">${esc(p.price)} ${cur}</span>
          </div>
          ${desc ? `<p class="text-[11px] text-gray-300 line-clamp-2 mt-1">${esc(desc)}</p>` : ''}
          ${!available ? `<p class="text-[10px] font-bold text-red-300 mt-1">${currentLang === 'ar' ? 'غير متوفر حالياً' : 'Currently unavailable'}</p>` : ''}
        </div>
      </article>`;
  }

  function renderMenu(products, isSearch) {
    const container = document.getElementById('dynamic-menu-sections');
    const groups = allCategories.map(c => [c, productsIn(c, products)]).filter(([, ps]) => ps.length > 0);

    if (groups.length === 0) {
      const msg = isSearch
        ? (currentLang === 'ar' ? 'لا توجد نتائج مطابقة لبحثك.' : 'No dishes match your search.')
        : (currentLang === 'ar' ? 'لم تتم إضافة أطباق لهذا المنيو بعد.' : 'No dishes added yet.');
      container.innerHTML = `<p class="text-center text-xs text-gray-400 py-10">${msg}</p>`;
      return;
    }

    container.innerHTML = groups.map(([cat, ps]) => `
      <section id="section-${esc(cat.id)}" class="space-y-3 scroll-mt-24">
        <h3 class="font-bold text-base text-white tracking-wide border-b border-white/30 pb-1.5">${esc(tr(cat.name))}</h3>
        <div class="space-y-2.5">${ps.map(productCard).join('')}</div>
      </section>`).join('');
  }

  function handleSearch() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    if (!q) return renderMenu(allProducts, false);
    const filtered = allProducts.filter(p =>
      [p.name, p.description, p.name_en, p.description_en, translationCache[p.name], translationCache[p.description]]
        .some(t => t && String(t).toLowerCase().includes(q)));
    renderMenu(filtered, true);
  }

  // ─── التنقل بين الأقسام ───
  document.getElementById('fast-filter-bar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    const target = document.getElementById(`section-${btn.dataset.cat}`);
    if (target) window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
  });

  let scrollTick = false;
  window.addEventListener('scroll', () => {
    if (scrollTick) return;
    scrollTick = true;
    requestAnimationFrame(() => {
      scrollTick = false;
      const sections = [...document.querySelectorAll('#dynamic-menu-sections section')];
      let current = sections[0];
      for (const s of sections) if (s.getBoundingClientRect().top < 120) current = s;
      if (!current) return;
      const id = current.id.replace('section-', '');
      document.querySelectorAll('.cat-pill').forEach(b => {
        const on = b.dataset.cat === id;
        b.classList.toggle('active', on);
        if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      });
    });
  }, { passive: true });

  // ─── نافذة تفاصيل الطبق ───
  const menuEl = document.getElementById('dynamic-menu-sections');
  menuEl.addEventListener('click', (e) => {
    const card = e.target.closest('[data-product]');
    if (card) openModal(card.dataset.product);
  });
  menuEl.addEventListener('keydown', (e) => {
    const card = e.target.closest('[data-product]');
    if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openModal(card.dataset.product); }
  });

  function openModal(id) {
    const p = allProducts.find(x => String(x.id) === String(id));
    if (!p) return;
    const img = safeUrl(p.image_url);
    const modalImg = document.getElementById('modalImg');
    modalImg.parentElement.classList.toggle('hidden', !img);
    modalImg.src = img || '';
    document.getElementById('modalTitle').closest('.p-5').classList.toggle('pt-14', !img);
    document.getElementById('modalTitle').textContent = productName(p);
    document.getElementById('modalPrice').textContent = `${p.price} ${currentLang === 'ar' ? 'ر.س' : 'SAR'}`;
    document.getElementById('modalDesc').textContent = productDesc(p);
    document.getElementById('productModal').classList.remove('opacity-0', 'pointer-events-none');
  }

  function closeModal() {
    document.getElementById('productModal').classList.add('opacity-0', 'pointer-events-none');
  }
  document.getElementById('productModal').addEventListener('click', (e) => { if (e.target.id === 'productModal') closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  initMenu();
</script>
</body>
</html>
