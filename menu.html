<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنيو الرقمي  | Dev Menu</title>

<!-- Tailwind CSS & FontAwesome -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="js/api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  /* رمز الريال السعودي الجديد ⃁ (U+20C1): خط مخصص يُستخدم لهذا الرمز فقط */
  @font-face {
    font-family: 'SaudiRiyal';
    src: url('https://cdn.jsdelivr.net/npm/@emran-alhaddad/saudi-riyal-font@1.1.0/fonts/regular/saudi_riyal.woff2') format('woff2');
    font-weight: 100 600; font-display: swap; unicode-range: U+20C1;
  }
  @font-face {
    font-family: 'SaudiRiyal';
    src: url('https://cdn.jsdelivr.net/npm/@emran-alhaddad/saudi-riyal-font@1.1.0/fonts/bold/saudi_riyal.woff2') format('woff2');
    font-weight: 700 900; font-display: swap; unicode-range: U+20C1;
  }
  body {
    font-family: 'SaudiRiyal', 'Cairo', sans-serif;
    background-color: #0b0b0b;
    color: #f5f5f5;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #bg-media-container {
    position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden;
  }
  #bg-video, #bg-image {
    width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75) contrast(1.05);
  }
  .bg-overlay {
    position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(10,10,10,0.4) 0%, rgba(10,10,10,0.85) 100%); z-index: -1;
  }
  .glass-card {
    background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 18px;
    transition: all 0.3s ease;
  }
  .glass-card:active { transform: scale(0.98); }
  .glass-header {
    background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  }
  .leader-line {
    flex: 1 1 10px; border-bottom: 1.5px dotted rgba(255, 255, 255, 0.3); margin: 0 8px 6px 8px;
  }
  .product-img {
    width: 90px; height: 90px; object-fit: cover; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .cat-pill.active {
    background: #ffffff; color: #000000; font-weight: 800; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25);
  }
</style>
</head>

<body class="font-sans antialiased pb-16">

<!-- ميديا الخلفية -->
<div id="bg-media-container">
  <video id="bg-video" autoplay loop muted playsinline class="hidden"></video>
  <img id="bg-image" class="hidden">
</div>
<div class="bg-overlay"></div>

<!-- المحتوى الرئيسي للمنيو -->
<div id="app-content" class="w-full max-w-md mx-auto px-4 pt-4 relative z-10 space-y-5">

  <!-- زر تبديل اللغة وشعار الديجيتال منيو -->
  <div class="flex justify-between items-center">
    <button onclick="toggleLanguage()" class="bg-white/10 hover:bg-white/20 text-white px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition flex items-center gap-2 backdrop-blur-md">
      <i class="fa-solid fa-globe text-white"></i>
      <span id="lang-btn-text">English</span>
    </button>
    <span class="text-[10px] bg-white/10 text-white/80 border border-white/20 px-3 py-1 rounded-full font-bold">Digital Menu</span>
  </div>

  <!-- شريط العروض والرسائل الترويجية -->
  <div id="promo-banner" class="hidden bg-white text-black p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white">
    <div class="w-8 h-8 rounded-xl bg-black text-white flex items-center justify-center shrink-0 text-xs">
      <i class="fa-solid fa-bullhorn"></i>
    </div>
    <div class="flex-1 min-w-0">
      <p id="promo-label" class="text-[10px] font-black uppercase tracking-wider text-gray-600">إعلان / عرض خاص</p>
      <p id="promo-text" class="text-xs font-bold text-black"></p>
    </div>
  </div>

  <!-- الترويسة والشعار -->
  <header class="text-center space-y-3 pt-1">
    <div class="relative w-32 h-32 mx-auto">
      <div class="absolute inset-0 bg-white/10 rounded-full blur-xl"></div>
      <div class="relative w-full h-full p-2 rounded-full bg-black/90 border-2 border-white/40 shadow-2xl flex items-center justify-center overflow-hidden">
        <img id="project-logo" src="images/logo.jpeg" class="w-full h-full object-cover rounded-full" onerror="this.src='https://via.placeholder.com/150/000000/ffffff?text=LOGO'">
      </div>
    </div>
    <div class="space-y-1">
      <h1 id="project-title" class="text-2xl font-black text-white tracking-widest uppercase">Dev Menu</h1>
      <p id="project-type" class="text-xs text-gray-300 font-semibold tracking-wider">RESTAURANT &amp; CAFE</p>
    </div>
    <div id="info-bar" class="hidden flex-wrap justify-center gap-2 pt-1"></div>
  </header>

  <!-- البحث السريع -->
  <div class="relative">
    <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3.5 text-gray-400 text-xs"></i>
    <input type="text" id="search-input" oninput="handleSearch()" placeholder="ابحث عن طبقك المفضل..." 
      class="w-full bg-black/60 border border-white/20 rounded-2xl pr-10 pl-4 py-2.5 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-white backdrop-blur-md shadow-lg">
  </div>

  <!-- شريط الأقسام السريع -->
  <div class="sticky top-2 z-40">
    <div id="fast-filter-bar" class="glass-header rounded-2xl p-1.5 flex gap-2 overflow-x-auto no-scrollbar text-xs border border-white/20 shadow-xl"></div>
  </div>

  <!-- الأقسام والمنتجات -->
  <main id="dynamic-menu-sections" class="space-y-8 min-h-[300px]"></main>

  <!-- ملاحظة السعرات (هيئة الغذاء والدواء) -->
  <p id="calorie-note" class="hidden text-center text-[10px] text-gray-400 leading-relaxed px-4"></p>

  <!-- أزرار التواصل الاجتماعي -->
  <div id="social-links-container" class="hidden pt-4 pb-2 border-t border-white/10 flex justify-center items-center gap-3"></div>

  <!-- التذييل (مُلغى منه زر تسجيل الدخول نهائياً) -->
  <footer class="text-center pt-8 mt-6 border-t border-white/10 space-y-2">
    <a href="index.html" class="inline-block text-xs font-black text-white/80 hover:text-amber-300 transition">DEV MENU — حوّل قائمتك إلى تجربة رقمية</a>
    <p class="text-[9px] font-bold text-gray-600">© DEV MENU 2026</p>
  </footer>

</div>

<!-- Modal تفاصيل المنتج -->
<div id="productModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/85 backdrop-blur-xl opacity-0 pointer-events-none transition-all duration-300">
  <div class="bg-zinc-900 border border-white/20 w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl relative text-right">
    <button onclick="closeModal()" class="absolute top-4 left-4 z-20 w-8 h-8 rounded-full bg-black/80 text-white flex items-center justify-center border border-white/30">
      <i class="fas fa-xmark"></i>
    </button>
    <div class="relative h-60 bg-black">
      <img id="modalImg" src="" class="w-full h-full object-cover">
      <span id="modalCal" class="hidden absolute bottom-3 left-3 items-center gap-1.5 bg-white/95 text-black text-[11px] font-black px-3 py-1.5 rounded-full shadow-lg"></span>
    </div>
    <div class="p-5 space-y-3">
      <h3 id="modalTitle" class="font-black text-xl text-white leading-snug"></h3>
      <div id="modalDetails" class="space-y-1.5 text-xs text-gray-300 leading-relaxed"></div>
      <p id="modalPrice" class="text-lg font-black text-white"></p>
      <div id="modalCoffee" class="hidden space-y-3"></div>
      <div id="modalMeta" class="flex flex-wrap gap-1.5"></div>
      <a id="modalOrder" href="#" target="_blank" rel="noopener" class="hidden w-full bg-[#25d366] hover:bg-[#1ebe5b] text-black font-black text-xs py-3 rounded-2xl items-center justify-center gap-2 transition">
        <i class="fa-brands fa-whatsapp text-base"></i> <span id="modalOrderText">اطلب عبر واتساب</span>
      </a>
    </div>
  </div>
</div>

<script>
  // البيانات كلها تجي من خادمنا: /api/public
  // السعر مع رمز الريال الجديد: "⃁ 25" (الرمز يسار الرقم)
  const SAR = '\u20C1';
  const money = (n) => `\u2066${SAR} ${n}\u2069`;


  // حماية من حقن الكود: أي نص قادم من قاعدة البيانات يمر من هنا قبل عرضه
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // يقبل روابط http/https فقط (يمنع روابط javascript:)
  function safeUrl(u) {
    if (!u) return '';
    try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : ''; }
    catch { return ''; }
  }
  const urlParams = new URLSearchParams(window.location.search);
  const clientSlug = (urlParams.get('client') || '').trim().toLowerCase();
  // مصدر الزيارة: رمز QR المطبوع أو رابط مشارك. نشيل src من الرابط حتى لا تُحسب المشاركات كمسح QR
  const visitSource = urlParams.get('src') === 'qr' ? 'qr' : 'link';
  if (urlParams.has('src')) {
    urlParams.delete('src');
    history.replaceState(null, '', `${location.pathname}?${urlParams.toString()}`);
  }

  let project = null, allProducts = [], allCategories = [];
  let currentLang = 'ar', translating = false;
  const translationCache = {};

  // ─── الترجمة ───
  async function translateText(text) {
    if (!text || translationCache[text]) return;
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|en`);
      const data = await res.json();
      const t = data && data.responseData && data.responseData.translatedText;
      if (t) translationCache[text] = t;
    } catch (e) { console.error(e); }
  }
  // يترجم كل النصوص دفعة وحدة (6 طلبات بالتوازي) بدل طبق طبق
  async function translateAll() {
    const texts = new Set();
    allCategories.forEach(c => { if (!c.name_en && c.name) texts.add(c.name); });
    allProducts.forEach(p => {
      if (!p.name_en && p.name) texts.add(p.name);
      if (!p.description_en && p.description) texts.add(p.description);
      if (p.extra_info) texts.add(p.extra_info);
      if (p.note) texts.add(p.note);
      if (p.coffee) [p.coffee.origin, p.coffee.region, p.coffee.process_other, ...(p.coffee.notes || [])].forEach(t => t && texts.add(t));
    });
    if (project && project.promo_message) texts.add(project.promo_message);
    const list = [...texts].filter(t => !translationCache[t]);
    for (let i = 0; i < list.length; i += 6) await Promise.all(list.slice(i, i + 6).map(translateText));
  }
  const tr = (t) => (currentLang === 'en' && t) ? (translationCache[t] || t) : (t || '');
  const productName = (p) => currentLang === 'en' ? (p.name_en || tr(p.name)) : p.name;
  const productDesc = (p) => currentLang === 'en' ? (p.description_en || tr(p.description)) : (p.description || '');
  // عرض السعرات خيار يفعّله صاحب المتجر (مفعّل افتراضياً)
  const caloriesOn = () => !project || project.show_calories !== false;
  const catName = (c) => currentLang === 'en' ? (c.name_en || tr(c.name)) : c.name;
  const bySort = (a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0) || a.id - b.id;

  // تفاصيل القهوة المختصة [عربي، إنجليزي]
  const COFFEE_PROCESS = { washed: ['مغسولة', 'Washed'], natural: ['مجففة (طبيعية)', 'Natural'], honey: ['عسلية', 'Honey'], anaerobic: ['لاهوائية', 'Anaerobic'], carbonic: ['كربونية', 'Carbonic maceration'], other: ['أخرى', 'Other'] };
  const COFFEE_ROAST   = { light: ['فاتحة', 'Light'], medium: ['متوسطة', 'Medium'], dark: ['داكنة', 'Dark'] };
  const COFFEE_METHODS = { v60: ['V60', 'V60'], chemex: ['كيمكس', 'Chemex'], aeropress: ['إيروبرس', 'AeroPress'], frenchpress: ['فرنش برس', 'French press'], espresso: ['إسبريسو', 'Espresso'], coldbrew: ['كولد برو', 'Cold brew'] };
  const L_ = () => currentLang === 'ar' ? 0 : 1;
  const label = (map, key) => map[key] ? map[key][L_()] : '';

  // تفاصيل القهوة تظهر للمقاهي فقط (إذا كان النوع غير محدد نعرضها لو موجودة)
  const coffeeOn = () => !project || !project.business_type || ['cafe', 'mixed'].includes(project.business_type);

  // "أخرى": نعرض المعالجة اللي كتبها صاحب المقهى
  const processText = (c) => c.process === 'other' ? tr(c.process_other || '') : label(COFFEE_PROCESS, c.process);

  function coffeeLine(c) {
    if (!c || !coffeeOn()) return '';
    return [tr(c.origin), processText(c)].filter(Boolean).join(' · ');
  }

  function renderCoffeeModal(c) {
    const box = document.getElementById('modalCoffee');
    if (!c || !coffeeOn()) { box.classList.add('hidden'); box.innerHTML = ''; return; }
    const ar = L_() === 0;
    const specs = [
      [ar ? 'الأصل' : 'Origin', tr(c.origin), 'fa-earth-africa'],
      [ar ? 'المنطقة' : 'Region', tr(c.region), 'fa-location-dot'],
      [ar ? 'المعالجة' : 'Process', processText(c), 'fa-droplet'],
      [ar ? 'السلالة' : 'Variety', c.variety, 'fa-seedling'],
      [ar ? 'الارتفاع' : 'Altitude', c.altitude ? `${c.altitude} ${ar ? 'م' : 'm'}` : '', 'fa-mountain'],
      [ar ? 'التحميص' : 'Roast', label(COFFEE_ROAST, c.roast), 'fa-fire']
    ].filter(x => x[1]);
    const notes = (c.notes || []).map(tr);
    const methods = (c.methods || []).map(m => label(COFFEE_METHODS, m)).filter(Boolean);

    box.innerHTML = `
      ${specs.length ? `
        <div class="grid grid-cols-2 gap-2">
          ${specs.map(([k, v, icon]) => `
            <div class="bg-white/5 border border-white/10 rounded-xl px-3 py-2">
              <p class="text-[9px] text-gray-400"><i class="fa-solid ${icon} text-amber-300/80"></i> ${k}</p>
              <p class="text-xs font-bold text-white truncate">${esc(v)}</p>
            </div>`).join('')}
        </div>` : ''}
      ${notes.length ? `
        <div>
          <p class="text-[10px] text-gray-400 mb-1.5">${ar ? 'الإيحاءات' : 'Tasting notes'}</p>
          <div class="flex flex-wrap gap-1.5">${notes.map(n => `<span class="bg-amber-400/15 text-amber-200 border border-amber-400/30 text-[11px] font-bold px-2.5 py-1 rounded-full">${esc(n)}</span>`).join('')}</div>
        </div>` : ''}
      ${methods.length ? `
        <div>
          <p class="text-[10px] text-gray-400 mb-1.5">${ar ? 'متوفرة على' : 'Available as'}</p>
          <div class="flex flex-wrap gap-1.5">${methods.map(m => `<span class="bg-white/10 text-gray-100 border border-white/15 text-[11px] font-bold px-2.5 py-1 rounded-full">${esc(m)}</span>`).join('')}</div>
        </div>` : ''}`;
    box.classList.remove('hidden');
  }

  const ALLERGEN_LABELS = {
    gluten: ['الغلوتين', 'Gluten'], milk: ['الحليب', 'Milk'], egg: ['البيض', 'Egg'],
    nuts: ['المكسرات', 'Tree nuts'], peanut: ['الفول السوداني', 'Peanuts'], sesame: ['السمسم', 'Sesame'],
    fish: ['الأسماك', 'Fish'], shellfish: ['القشريات', 'Shellfish'], soy: ['الصويا', 'Soy']
  };

  // إحصائيات مجهولة: مرة واحدة لكل زيارة (بدون أي بيانات شخصية)
  function trackOnce(key, kind, productId = null, source = null) {
    try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch {}
    DM.post('/api/public?action=track', { client_id: project.id, kind, product_id: productId, source })
      .catch(e => console.warn('track', e.message));
  }

  function renderInfoBar() {
    const bar = document.getElementById('info-bar');
    const chip = 'inline-flex items-center gap-1.5 bg-white/10 border border-white/20 text-white text-[10px] font-bold px-3 py-1.5 rounded-full backdrop-blur-md';
    const items = [];
    if (project.opening_hours) items.push(`<span class="${chip}"><i class="fa-regular fa-clock"></i> ${esc(project.opening_hours)}</span>`);
    const loc = safeUrl(project.location_url);
    if (loc) items.push(`<a href="${esc(loc)}" target="_blank" rel="noopener" class="${chip} hover:bg-white/20 transition"><i class="fa-solid fa-location-dot"></i> ${currentLang === 'ar' ? 'موقعنا' : 'Location'}</a>`);
    bar.innerHTML = items.join('');
    bar.classList.toggle('hidden', items.length === 0);
    bar.classList.toggle('flex', items.length > 0);
  }

  function renderCalorieNote() {
    const note = document.getElementById('calorie-note');
    const any = caloriesOn() && allProducts.some(p => p.calories != null);
    note.classList.toggle('hidden', !any);
    note.textContent = currentLang === 'ar'
      ? 'يحتاج البالغون في المتوسط إلى 2000 سعرة حرارية يومياً، وقد تختلف الاحتياجات من شخص لآخر.'
      : 'Adults need an average of 2,000 calories a day; individual needs may vary.';
  }

  async function toggleLanguage() {
    if (translating) return;
    const btnText = document.getElementById('lang-btn-text');
    if (currentLang === 'ar') {
      translating = true;
      btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Translating...';
      currentLang = 'en';
      if (project) trackOnce(`l:${project.id}`, 'lang');
      await translateAll();
      translating = false;
    } else {
      currentLang = 'ar';
    }
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('search-input').placeholder = currentLang === 'ar' ? 'ابحث عن طبقك المفضل...' : 'Search for your favorite dish...';
    document.getElementById('promo-label').textContent = currentLang === 'ar' ? 'إعلان / عرض خاص' : 'Special offer';
    if (project && project.promo_message) document.getElementById('promo-text').textContent = tr(project.promo_message);
    renderFilterBar();
    renderInfoBar();
    renderCalorieNote();
    handleSearch();
    btnText.textContent = currentLang === 'ar' ? 'English' : 'عربي';
  }

  // ─── تحميل المنيو ───
  function showUnavailable(title, sub) {
    document.getElementById('app-content').innerHTML = `
      <div class="min-h-[85vh] flex flex-col items-center justify-center text-center gap-3 px-6">
        <div class="w-16 h-16 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-2xl"><i class="fa-solid fa-store-slash"></i></div>
        <h1 class="text-lg font-black">${esc(title)}</h1>
        <p class="text-xs text-gray-400 max-w-xs leading-relaxed">${esc(sub)}</p>
        <a href="index.html" class="mt-4 text-[11px] font-bold text-white/60 hover:text-white transition">DEV MENU</a>
      </div>`;
  }

  async function initMenu() {
    if (!clientSlug) return showUnavailable('رابط المنيو غير مكتمل', 'امسح رمز QR الموجود على الطاولة، أو اطلب الرابط الصحيح من المطعم.');

    let menuData;
    try {
      menuData = await DM.get(`/api/public?action=menu&slug=${encodeURIComponent(clientSlug)}`);
    } catch (e) {
      if (e.status === 404 || e.status === 400) return showUnavailable('المنيو غير متاح حالياً', 'هذا المنيو غير موجود أو متوقف مؤقتاً.');
      console.error(e);
      return showUnavailable('تعذر تحميل المنيو', 'تحقق من اتصالك بالإنترنت ثم أعد تحميل الصفحة.');
    }
    const p = menuData.store;

    project = p;
    document.title = `${p.name || 'Dev Menu'} | المنيو الرقمي`;
    document.getElementById('project-title').textContent = p.name || 'Dev Menu';
    const TYPE_LABELS = { restaurant: 'RESTAURANT', cafe: 'SPECIALTY COFFEE', mixed: 'RESTAURANT &amp; CAFE', bakery: 'BAKERY &amp; SWEETS' };
    if (p.business_type && TYPE_LABELS[p.business_type]) document.getElementById('project-type').innerHTML = TYPE_LABELS[p.business_type];
    const logo = safeUrl(p.logo_url);
    if (logo) document.getElementById('project-logo').src = logo;

    const promoBanner = document.getElementById('promo-banner');
    if (p.promo_message && p.promo_message.trim() !== '') {
      document.getElementById('promo-text').textContent = p.promo_message;
      promoBanner.classList.remove('hidden');
    }

    renderSocialLinks(p);

    const video = safeUrl(p.bg_video_url), image = safeUrl(p.bg_image_url);
    if (video) {
      const bgVideo = document.getElementById('bg-video');
      bgVideo.src = video;
      bgVideo.classList.remove('hidden');
      bgVideo.play().catch(e => console.log('Autoplay failed:', e));
    } else if (image) {
      const bgImage = document.getElementById('bg-image');
      bgImage.src = image;
      bgImage.classList.remove('hidden');
    }

    allCategories = (menuData.categories || []).sort(bySort);
    allProducts = (menuData.products || []).sort(bySort);

    renderInfoBar();
    renderFilterBar();
    renderMenu(allProducts, false);
    renderCalorieNote();
    trackOnce(`v:${p.id}`, 'view', null, visitSource);
  }

  function renderSocialLinks(p) {
    const container = document.getElementById('social-links-container');
    const base = 'w-10 h-10 rounded-full flex items-center justify-center transition border';
    const plain = `${base} bg-white/10 hover:bg-white/20 border-white/20 text-white`;
    const wa = String(p.whatsapp_number || '').replace(/\D/g, '');
    const links = [
      [safeUrl(p.website_url),   'fa-solid fa-globe',     plain],
      [safeUrl(p.tiktok_url),    'fa-brands fa-tiktok',   plain],
      [safeUrl(p.instagram_url), 'fa-brands fa-instagram', plain],
      [wa ? `https://wa.me/${wa}` : '', 'fa-brands fa-whatsapp', `${base} bg-green-600/30 hover:bg-green-600/50 border-green-500/40 text-green-300`],
      [safeUrl(p.snapchat_url),  'fa-brands fa-snapchat', plain]
    ].filter(([url]) => url);

    if (links.length === 0) return container.classList.add('hidden');
    container.innerHTML = links.map(([url, icon, cls]) =>
      `<a href="${esc(url)}" target="_blank" rel="noopener" class="${cls}"><i class="${icon}"></i></a>`).join('');
    container.classList.remove('hidden');
  }

  // ─── العرض ───
  const productsIn = (cat, list) => list.filter(p => p.category === cat.key || p.category === cat.name).sort(bySort);

  function renderFilterBar() {
    const bar = document.getElementById('fast-filter-bar');
    const cats = allCategories.filter(c => productsIn(c, allProducts).length > 0);
    bar.parentElement.classList.toggle('hidden', cats.length === 0);
    bar.innerHTML = cats.map((c, i) => `
      <button type="button" data-cat="${esc(c.id)}" class="cat-pill ${i === 0 ? 'active' : ''} px-4 py-2 rounded-xl bg-white/10 border border-white/25 shrink-0 text-xs text-white font-bold transition">
        ${esc(catName(c))}
      </button>`).join('');
  }

  function productCard(p) {
    const available = p.is_available !== false;
    const img = safeUrl(p.image_url);
    const name = productName(p), desc = productDesc(p);
    const cls = available
      ? 'glass-card p-3 flex gap-3 items-center cursor-pointer shadow-lg'
      : 'glass-card p-3 flex gap-3 items-center opacity-45 grayscale';
    return `
      <article ${available ? `data-product="${esc(p.id)}" role="button" tabindex="0"` : ''} class="${cls}">
        ${img
          ? `<img src="${esc(img)}" alt="" loading="lazy" class="product-img">`
          : `<div class="w-[90px] h-[90px] bg-white/10 rounded-2xl flex items-center justify-center shrink-0"><i class="fa-solid fa-utensils text-gray-400"></i></div>`}
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5 min-w-0">
              <h4 class="font-bold text-sm text-white truncate">${esc(name)}</h4>
              ${p.is_bestseller === true ? `<span class="bg-white/20 text-white text-[9px] px-1.5 py-0.5 rounded font-bold border border-white/30 shrink-0"><i class="fa-solid fa-fire text-amber-400"></i> ${currentLang === 'ar' ? 'مميز' : 'Featured'}</span>` : ''}
            </div>
            <span class="leader-line"></span>
            <span class="font-black text-sm text-white shrink-0">${esc(money(p.price))}</span>
          </div>
          ${desc ? `<p class="text-[11px] text-gray-300 line-clamp-2 mt-1">${esc(desc)}</p>` : ''}
          ${p.coffee && coffeeOn() ? `
            <div class="mt-1.5 space-y-1">
              ${coffeeLine(p.coffee) ? `<p class="text-[10px] text-amber-200/90 font-bold"><i class="fa-solid fa-mug-hot"></i> ${esc(coffeeLine(p.coffee))}</p>` : ''}
              ${(p.coffee.notes || []).length ? `<div class="flex flex-wrap gap-1">${p.coffee.notes.slice(0, 3).map(n => `<span class="bg-white/10 text-gray-200 text-[9px] font-bold px-1.5 py-0.5 rounded-md">${esc(tr(n))}</span>`).join('')}</div>` : ''}
            </div>` : ''}
          ${caloriesOn() && p.calories != null ? `<p class="text-[10px] text-gray-400 mt-1"><i class="fa-solid fa-fire-flame-simple text-amber-400/80"></i> ${Number(p.calories)} ${currentLang === 'ar' ? 'سعرة حرارية' : 'kcal'}</p>` : ''}
          ${!available ? `<p class="text-[10px] font-bold text-red-300 mt-1">${currentLang === 'ar' ? 'غير متوفر حالياً' : 'Currently unavailable'}</p>` : ''}
        </div>
      </article>`;
  }

  function renderMenu(products, isSearch) {
    const container = document.getElementById('dynamic-menu-sections');
    const groups = allCategories.map(c => [c, productsIn(c, products)]).filter(([, ps]) => ps.length > 0);

    if (groups.length === 0) {
      const msg = isSearch
        ? (currentLang === 'ar' ? 'لا توجد نتائج مطابقة لبحثك.' : 'No dishes match your search.')
        : (currentLang === 'ar' ? 'لم تتم إضافة أطباق لهذا المنيو بعد.' : 'No dishes added yet.');
      container.innerHTML = `<p class="text-center text-xs text-gray-400 py-10">${msg}</p>`;
      return;
    }

    container.innerHTML = groups.map(([cat, ps]) => `
      <section id="section-${esc(cat.id)}" class="space-y-3 scroll-mt-24">
        <h3 class="font-bold text-base text-white tracking-wide border-b border-white/30 pb-1.5">${esc(catName(cat))}</h3>
        <div class="space-y-2.5">${ps.map(productCard).join('')}</div>
      </section>`).join('');
  }

  function handleSearch() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    if (!q) return renderMenu(allProducts, false);
    const filtered = allProducts.filter(p =>
      [p.name, p.description, p.name_en, p.description_en, translationCache[p.name], translationCache[p.description],
       ...(p.coffee && coffeeOn() ? [p.coffee.origin, p.coffee.region, p.coffee.variety, ...(p.coffee.notes || []).flatMap(n => [n, translationCache[n]])] : [])]
        .some(t => t && String(t).toLowerCase().includes(q)));
    renderMenu(filtered, true);
  }

  // ─── التنقل بين الأقسام ───
  document.getElementById('fast-filter-bar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    const target = document.getElementById(`section-${btn.dataset.cat}`);
    if (target) window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
  });

  let scrollTick = false;
  window.addEventListener('scroll', () => {
    if (scrollTick) return;
    scrollTick = true;
    requestAnimationFrame(() => {
      scrollTick = false;
      const sections = [...document.querySelectorAll('#dynamic-menu-sections section')];
      let current = sections[0];
      for (const s of sections) if (s.getBoundingClientRect().top < 120) current = s;
      if (!current) return;
      const id = current.id.replace('section-', '');
      document.querySelectorAll('.cat-pill').forEach(b => {
        const on = b.dataset.cat === id;
        b.classList.toggle('active', on);
        if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      });
    });
  }, { passive: true });

  // ─── نافذة تفاصيل الطبق ───
  const menuEl = document.getElementById('dynamic-menu-sections');
  menuEl.addEventListener('click', (e) => {
    const card = e.target.closest('[data-product]');
    if (card) openModal(card.dataset.product);
  });
  menuEl.addEventListener('keydown', (e) => {
    const card = e.target.closest('[data-product]');
    if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openModal(card.dataset.product); }
  });

  function openModal(id) {
    const p = allProducts.find(x => String(x.id) === String(id));
    if (!p) return;
    const img = safeUrl(p.image_url);
    const modalImg = document.getElementById('modalImg');
    modalImg.parentElement.classList.toggle('hidden', !img);
    modalImg.src = img || '';
    document.getElementById('modalTitle').closest('.p-5').classList.toggle('pt-14', !img);
    document.getElementById('modalTitle').textContent = productName(p);
    document.getElementById('modalPrice').textContent = money(p.price);

    // التفاصيل بالترتيب: الوصف ← معلومات إضافية ← ملاحظة
    const Lx = currentLang === 'ar' ? 0 : 1;
    const details = [
      [['الوصف', 'Description'], productDesc(p)],
      [['معلومات إضافية', 'Additional info'], tr(p.extra_info)],
      [['ملاحظة', 'Note'], tr(p.note)]
    ].filter(([, v]) => v && String(v).trim());
    document.getElementById('modalDetails').innerHTML = details.map(([label, v]) =>
      `<p><b class="text-white font-black">${label[Lx]} :</b> ${esc(v)}</p>`).join('');

    // السعرات على زاوية الصورة (إذا كان المتجر مفعّلها)
    const cal = document.getElementById('modalCal');
    const showCal = caloriesOn() && p.calories != null && !!img;
    cal.classList.toggle('hidden', !showCal);
    cal.classList.toggle('inline-flex', showCal);
    if (showCal) cal.innerHTML = `<i class="fa-solid fa-fire-flame-simple text-amber-500"></i> ${Number(p.calories)} ${Lx ? 'kcal' : 'سعرة حرارية'}`;
    renderCoffeeModal(p.coffee);

    const L = currentLang === 'ar' ? 0 : 1;
    const meta = [];
    if (caloriesOn() && p.calories != null && !img) {
      meta.push(`<span class="inline-flex items-center gap-1 bg-amber-400/15 text-amber-200 border border-amber-400/30 text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-fire-flame-simple"></i> ${Number(p.calories)} ${L ? 'kcal' : 'سعرة حرارية'}</span>`);
    }
    String(p.allergens || '').split(',').filter(k => ALLERGEN_LABELS[k]).forEach(k => {
      meta.push(`<span class="inline-flex items-center gap-1 bg-white/10 text-gray-200 border border-white/15 text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-triangle-exclamation text-[9px] text-amber-300"></i> ${ALLERGEN_LABELS[k][L]}</span>`);
    });
    document.getElementById('modalMeta').innerHTML = meta.join('');

    const order = document.getElementById('modalOrder');
    const wa = String(project.whatsapp_number || '').replace(/\D/g, '');
    const waValid = wa.startsWith('966') ? /^9665\d{8}$/.test(wa) : /^[1-9]\d{10,14}$/.test(wa);
    if (project.whatsapp_orders && waValid) {
      const msg = L
        ? `Hello ${project.name || ''}, I'd like to order: ${productName(p)} (${p.price} SAR)`
        : `مرحباً ${project.name || ''}، أبغى أطلب: ${p.name} (${p.price} ر.س)`;
      order.href = `https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
      document.getElementById('modalOrderText').textContent = L ? 'Order via WhatsApp' : 'اطلب عبر واتساب';
      order.classList.remove('hidden'); order.classList.add('flex');
    } else {
      order.classList.add('hidden'); order.classList.remove('flex');
    }

    currentModalProduct = p.id;
    trackOnce(`d:${p.id}`, 'dish', p.id);
    document.getElementById('productModal').classList.remove('opacity-0', 'pointer-events-none');
  }

  let currentModalProduct = null;
  document.getElementById('modalOrder').addEventListener('click', () => {
    if (currentModalProduct) trackOnce(`o:${currentModalProduct}`, 'order', currentModalProduct);
  });

  function closeModal() {
    document.getElementById('productModal').classList.add('opacity-0', 'pointer-events-none');
  }
  document.getElementById('productModal').addEventListener('click', (e) => { if (e.target.id === 'productModal') closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  initMenu();
</script>
</body>
</html>
