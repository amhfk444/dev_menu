<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>المنيو الرقمي الفاخر | Dev Menu</title>

<!-- Tailwind CSS & FontAwesome -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Cairo', sans-serif;
    background-color: #0b0b0b;
    color: #f5f5f5;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #bg-media-container {
    position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden;
  }
  #bg-video, #bg-image {
    width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75) contrast(1.05);
  }
  .bg-overlay {
    position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(10,10,10,0.4) 0%, rgba(10,10,10,0.85) 100%); z-index: -1;
  }
  .glass-card {
    background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 18px;
    transition: all 0.3s ease;
  }
  .glass-card:active { transform: scale(0.98); }
  .glass-header {
    background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  }
  .leader-line {
    flex: 1 1 10px; border-bottom: 1.5px dotted rgba(255, 255, 255, 0.3); margin: 0 8px 6px 8px;
  }
  .product-img {
    width: 90px; height: 90px; object-fit: cover; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .cat-pill.active {
    background: #ffffff; color: #000000; font-weight: 800; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25);
  }
</style>
</head>

<body class="font-sans antialiased pb-16">

<!-- ميديا الخلفية -->
<div id="bg-media-container">
  <video id="bg-video" autoplay loop muted playsinline class="hidden"></video>
  <img id="bg-image" class="hidden">
</div>
<div class="bg-overlay"></div>

<!-- شاشة الحظر عند انتهاء الاشتراك أو التعطيل -->
<div id="block-screen" class="fixed inset-0 z-50 flex items-center justify-center p-5 bg-black/95 backdrop-blur-xl hidden">
  <div class="glass-card p-8 w-full max-w-sm text-center border border-red-500/30 space-y-5 shadow-2xl">
    <div class="w-16 h-16 bg-red-500/20 text-red-400 border border-red-500/30 rounded-2xl flex items-center justify-center mx-auto text-3xl">
      <i class="fa-solid fa-lock"></i>
    </div>
    <div class="space-y-2">
      <h2 class="text-xl font-bold text-white">الخدمة متوقفة مؤقتاً</h2>
      <p id="block-reason" class="text-xs text-gray-300">عذراً، انتهت فترة الاشتراك أو تم تعليق المنشأة.</p>
    </div>
  </div>
</div>

<!-- المحتوى الرئيسي للمنيو -->
<div id="app-content" class="w-full max-w-md mx-auto px-4 pt-4 relative z-10 space-y-5">

  <!-- شريط العروض والرسائل الترويجية -->
  <div id="promo-banner" class="hidden bg-white text-black p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white">
    <div class="w-8 h-8 rounded-xl bg-black text-white flex items-center justify-center shrink-0 text-xs">
      <i class="fa-solid fa-bullhorn"></i>
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-[10px] font-black uppercase tracking-wider text-gray-600">إعلان / عرض خاص</p>
      <p id="promo-text" class="text-xs font-bold text-black"></p>
    </div>
  </div>

  <!-- الترويسة والشعار -->
  <header class="text-center space-y-3 pt-1">
    <div class="relative w-32 h-32 mx-auto">
      <div class="absolute inset-0 bg-white/10 rounded-full blur-xl"></div>
      <div class="relative w-full h-full p-2 rounded-full bg-black/90 border-2 border-white/40 shadow-2xl flex items-center justify-center overflow-hidden">
        <img id="project-logo" src="images/logo.jpeg" class="w-full h-full object-cover rounded-full" onerror="this.src='https://via.placeholder.com/150/000000/ffffff?text=LOGO'">
      </div>
    </div>
    <div class="space-y-1">
      <h1 id="project-title" class="text-2xl font-black text-white tracking-widest uppercase">Dev Menu</h1>
      <p class="text-xs text-gray-300 font-semibold tracking-wider">RESTURANT & CAFE</p>
    </div>
  </header>

  <!-- البحث السريع -->
  <div class="relative">
    <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3.5 text-gray-400 text-xs"></i>
    <input type="text" id="search-input" oninput="handleSearch()" placeholder="ابحث عن طبقك المفضلة..." 
      class="w-full bg-black/60 border border-white/20 rounded-2xl pr-10 pl-4 py-2.5 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-white backdrop-blur-md shadow-lg">
  </div>

  <!-- شريط الأقسام السريع -->
  <div class="sticky top-2 z-40">
    <div id="fast-filter-bar" class="glass-header rounded-2xl p-1.5 flex gap-2 overflow-x-auto no-scrollbar text-xs border border-white/20 shadow-xl"></div>
  </div>

  <!-- الأقسام والمنتجات -->
  <main id="dynamic-menu-sections" class="space-y-8 min-h-[300px]"></main>

  <!-- أزرار التواصل الاجتماعي -->
  <div id="social-links-container" class="hidden pt-4 pb-2 border-t border-white/10 flex justify-center items-center gap-3"></div>

</div>

<!-- Modal تفاصيل المنتج -->
<div id="productModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/85 backdrop-blur-xl opacity-0 pointer-events-none transition-all duration-300">
  <div class="bg-zinc-900 border border-white/20 w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl relative text-right">
    <button onclick="closeModal()" class="absolute top-4 left-4 z-20 w-8 h-8 rounded-full bg-black/80 text-white flex items-center justify-center border border-white/30">
      <i class="fas fa-xmark"></i>
    </button>
    <div class="relative h-60 bg-black">
      <img id="modalImg" src="" class="w-full h-full object-cover">
    </div>
    <div class="p-5 space-y-3">
      <div class="flex justify-between items-start gap-2">
        <h3 id="modalTitle" class="font-bold text-lg text-white"></h3>
        <span id="modalPrice" class="text-base font-black text-white bg-white/10 px-3 py-1 rounded-xl border border-white/20"></span>
      </div>
      <p id="modalDesc" class="text-xs text-gray-300 leading-relaxed font-normal"></p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://czdoamcgxgkicrbufpcn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6ZG9hbWNneGdraWNyYnVmcGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTA5MzAsImV4cCI6MjEwNTU4NjkzMH0.45zKx4ljXJ27SS-ukc62qiu52movhDgSoC9OEnK9NHk';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// استقبال معرف العميل من الرابط
const urlParams = new URLSearchParams(window.location.search);
const clientSlugFromUrl = urlParams.get('client') || 'alqarya-restaurant';

let currentClientId = null, allProducts = [], allCategories = [];

async function initMenu() {
  let { data: project } = await supabaseClient.from('clients').select('*').eq('client_slug', clientSlugFromUrl).maybeSingle();
  
  if (project) {
    currentClientId = project.id;
    document.getElementById('project-title').textContent = project.name || 'Dev Menu';
    if (project.logo_url) document.getElementById('project-logo').src = project.logo_url;

    // التحقق من حالة الاشتراك أو التعطيل
    if (project.is_active === false) {
      document.getElementById('block-reason').textContent = 'عذراً، تم تعطيل هذا المتجر من الإدارة مؤقتاً.';
      document.getElementById('block-screen').classList.remove('hidden');
      document.getElementById('app-content').classList.add('hidden');
      return;
    }

    // عرض الرسالة الترويجية
    const promoBanner = document.getElementById('promo-banner');
    const promoText = document.getElementById('promo-text');
    if (project.promo_message && project.promo_message.trim() !== '') {
      promoText.textContent = project.promo_message;
      promoBanner.classList.remove('hidden');
    } else {
      promoBanner.classList.add('hidden');
    }

    // روابط التواصل
    renderSocialLinks(project);

    // الخلفية (صورة أو فيديو)
    const bgVideo = document.getElementById('bg-video');
    const bgImage = document.getElementById('bg-image');
    bgVideo.classList.add('hidden');
    bgImage.classList.add('hidden');

    if (project.bg_video_url && project.bg_video_url.trim() !== '') {
      bgVideo.src = project.bg_video_url;
      bgVideo.classList.remove('hidden');
      bgVideo.play().catch(e => console.log("Autoplay failed:", e));
    } else if (project.bg_image_url && project.bg_image_url.trim() !== '') {
      bgImage.src = project.bg_image_url;
      bgImage.classList.remove('hidden');
    }
  } else {
    alert('عذراً، المتجر المطلوب غير موجود.');
    return;
  }

  // جلب الأقسام والمنتجات الخاصة بهذا العميل
  const { data: dbCat } = await supabaseClient.from('categories').select('*').eq('client_id', currentClientId).order('id', { ascending: true });
  allCategories = dbCat || [];

  const { data: dbProd } = await supabaseClient.from('products').select('*').eq('client_id', currentClientId).order('id', { ascending: false });
  allProducts = dbProd || [];

  renderFilterBar();
  renderMenu(allProducts);
}

function renderSocialLinks(p) {
  const container = document.getElementById('social-links-container');
  let html = '';

  if (p.website_url) html += `<a href="${p.website_url}" target="_blank" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-white transition"><i class="fa-solid fa-globe"></i></a>`;
  if (p.tiktok_url) html += `<a href="${p.tiktok_url}" target="_blank" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-white transition"><i class="fa-brands fa-tiktok"></i></a>`;
  if (p.instagram_url) html += `<a href="${p.instagram_url}" target="_blank" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-white transition"><i class="fa-brands fa-instagram"></i></a>`;
  if (p.whatsapp_number) html += `<a href="https://wa.me/${p.whatsapp_number}" target="_blank" class="w-10 h-10 rounded-full bg-green-600/30 hover:bg-green-600/50 border border-green-500/40 flex items-center justify-center text-green-300 transition"><i class="fa-brands fa-whatsapp"></i></a>`;
  if (p.snapchat_url) html += `<a href="${p.snapchat_url}" target="_blank" class="w-10 h-10 rounded-full bg-yellow-500/20 hover:bg-yellow-500/40 border border-yellow-500/30 flex items-center justify-center text-yellow-300 transition"><i class="fa-brands fa-snapchat"></i></a>`;

  if (html !== '') {
    container.innerHTML = html;
    container.classList.remove('hidden');
  } else {
    container.classList.add('hidden');
  }
}

function renderFilterBar() {
  const bar = document.getElementById('fast-filter-bar');
  if (!bar) return;
  bar.innerHTML = allCategories.map((c, i) => `
    <button onclick="scrollToSection('${c.key}', this)" class="cat-pill ${i===0?'active':''} px-4 py-2 rounded-xl bg-white/10 border border-white/25 shrink-0 text-xs text-white font-bold transition">
      ${c.name}
    </button>
  `).join('');
}

function scrollToSection(key, el) {
  document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  const target = document.getElementById(`section-${key}`);
  if (target) window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
}

function renderMenu(products) {
  const container = document.getElementById('dynamic-menu-sections');
  container.innerHTML = '';

  if (allCategories.length === 0) {
    container.innerHTML = `<p class="text-center text-xs text-gray-400 py-10">لم يتم إضافة أقسام أو أطباق لهذا المتجر بعد.</p>`;
    return;
  }

  allCategories.forEach(cat => {
    const catProducts = products.filter(p => p.category === cat.key || p.category === cat.name);
    if (catProducts.length === 0) return;

    const section = document.createElement('div');
    section.id = `section-${cat.key}`;
    section.className = 'space-y-3 scroll-mt-24';

    const items = catProducts.map(p => {
      const isAvailable = (p.is_available !== false);
      const isBestseller = (p.is_bestseller === true);
      const cardClass = isAvailable ? 'glass-card p-3 flex gap-3 items-center cursor-pointer shadow-lg' : 'glass-card p-3 flex gap-3 items-center opacity-45 grayscale pointer-events-none relative';

      return `
        <article onclick="openModal('${p.image_url || ''}', '${p.name}', '${p.price}', '${p.description || ''}')" class="${cardClass}">
          ${p.image_url ? `<img src="${p.image_url}" class="product-img">` : `<div class="w-[90px] h-[90px] bg-white/10 rounded-2xl flex items-center justify-center shrink-0"><i class="fa-solid fa-utensils text-gray-400"></i></div>`}
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-1.5 min-w-0">
                <h4 class="font-bold text-sm text-white truncate">${p.name}</h4>
                ${isBestseller ? `<span class="bg-white/20 text-white text-[9px] px-1.5 py-0.5 rounded font-bold border border-white/30"><i class="fa-solid fa-fire text-amber-400"></i> مميز</span>` : ''}
              </div>
              <span class="leader-line"></span>
              <span class="font-black text-sm text-white shrink-0">${p.price} ر.س</span>
            </div>
            ${p.description ? `<p class="text-[11px] text-gray-300 line-clamp-2 mt-1">${p.description}</p>` : ''}
          </div>
        </article>
      `;
    }).join('');

    section.innerHTML = `<h3 class="font-bold text-base text-white tracking-wide border-b border-white/30 pb-1.5">${cat.name}</h3><div class="space-y-2.5">${items}</div>`;
    container.appendChild(section);
  });
}

function handleSearch() {
  const q = document.getElementById('search-input').value.toLowerCase();
  renderMenu(allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.description && p.description.toLowerCase().includes(q))));
}

function openModal(img, title, price, desc) {
  if (!img) return;
  document.getElementById('modalImg').src = img;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalPrice').textContent = price + ' ر.س';
  document.getElementById('modalDesc').textContent = desc;
  document.getElementById('productModal').classList.remove('opacity-0', 'pointer-events-none');
}

function closeModal() {
  document.getElementById('productModal').classList.add('opacity-0', 'pointer-events-none');
}

document.addEventListener('DOMContentLoaded', initMenu);
</script>
</body>
</html>
