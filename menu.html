<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<meta name="theme-color" content="#0b0b0b">
<title>المنيو الرقمي</title>

<!-- FontAwesome (و Tailwind مبني مسبقاً آخر الـ head، نفس ترتيب Tailwind CDN اللي كان ينضاف بعد الأنماط) -->
<link rel="stylesheet" href="/css/fa-menu.css">
<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script src="js/occasions.js"></script>

<style>
  /* رمز الريال السعودي الجديد ⃁ (U+20C1): خط مخصص يُستخدم لهذا الرمز فقط */
  @font-face {
    font-family: 'SaudiRiyal';
    src: url('/fonts/saudi-riyal-regular.woff2') format('woff2');
    font-weight: 100 600; font-display: swap; unicode-range: U+20C1;
  }
  @font-face {
    font-family: 'SaudiRiyal';
    src: url('/fonts/saudi-riyal-bold.woff2') format('woff2');
    font-weight: 700 900; font-display: swap; unicode-range: U+20C1;
  }
  /* ─── مساعد المنيو الذكي ─── */
  /* زر المساعد: كبسولة فيها شعار المحل و"اسأل المساعد"، وتحتها سطر صغير يتبدل (وش يقدر يجاوب) */
  #chatFab { position: fixed; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 41; display: flex; align-items: center; gap: 9px; direction: rtl;
    padding: 4px 14px 4px 4px; border-radius: 999px; background: #fff; color: #111; border: 0; text-align: right;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.06); transition: padding .25s, gap .25s; }
  #chatFab.hidden { display: none; }   /* يطلع بس لو صاحب المحل شغّل المساعد */
  #chatFab .bot { position: relative; width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
  #chatFab .bot svg { width: 20px; height: 20px; }
  #chatFab .bot.logo { background: #fff; box-shadow: 0 0 0 2px var(--accent); }
  /* مقاس ثابت بالبكسل: Safari ما يلتزم بـ height:100% داخل grid، فالشعار الطولي كان يطلع بيضاوي وبرّا الدائرة */
  #chatFab .bot.logo img { display: block; width: 38px; height: 38px; max-width: none; border-radius: 50%; object-fit: cover; }
  /* نقطة "متصل" */
  #chatFab .bot::after { content: ''; position: absolute; bottom: 0; left: 0; width: 10px; height: 10px; border-radius: 50%; background: #22c55e; border: 2px solid #fff; }
  #chatFab .lbl { display: flex; flex-direction: column; line-height: 1.25; overflow: hidden; max-width: 170px; transition: max-width .25s, opacity .2s; }
  #chatFab .lbl b { font-size: 12.5px; font-weight: 800; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  #chatFab .lbl b em { font-style: normal; font-size: 9px; font-weight: 800; color: #6d28d9; background: rgba(109,40,217,.1); padding: 1px 5px; border-radius: 6px; }
  #chatFab .lbl small { font-size: 10.5px; color: #555; white-space: nowrap; }
  #chatFab .lbl small span { display: inline-block; animation: sayIn .35s ease-out; }
  /* بعد أول محادثة: يصغر للشعار بس عشان ما يغطي المنيو */
  #chatFab.mini { padding: 4px; gap: 0; }
  #chatFab.mini .lbl { max-width: 0; opacity: 0; }
  #chatFab::before { content: ''; position: absolute; inset: -6px; }
  @keyframes sayIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  /* هيكل التحميل: بلون نص الثيم بشفافية، فيطلع مناسب للثيم الفاتح والداكن */
  .sk { display: block; border-radius: 10px; background: currentColor; opacity: .09; animation: skPulse 1.4s ease-in-out infinite; }
  .sk-line { height: 12px; }
  .sk-pill { flex-shrink: 0; width: 76px; height: 34px; border-radius: 12px; }
  .sk-img { width: 88px; height: 88px; border-radius: 14px; flex-shrink: 0; }
  .sk-card { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 22px; border: 1px solid; border-color: color-mix(in srgb, currentColor 12%, transparent); }
  @keyframes skPulse { 50% { opacity: .17; } }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
  @media (prefers-reduced-motion: reduce) { #chatFab, #chatFab .lbl { transition: none; } #chatFab .lbl small span { animation: none; } }
  #cartBar:not(.hidden) ~ #chatFab { bottom: calc(84px + env(safe-area-inset-bottom)); }
  /* النافذة: تاخذ ارتفاع الشاشة الظاهر (visualViewport) عشان الكيبورد ما يغطي خانة الكتابة */
  #chatSheet { position: fixed; left: 0; right: 0; top: 0; height: 100%; z-index: 60; display: none; }
  #chatSheet.open { display: block; }
  #chatSheet .back { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  #chatSheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; height: min(78%, 640px); display: flex; flex-direction: column;
    background: var(--modal); color: var(--fg); border-radius: 22px 22px 0 0; border: 1px solid var(--line); box-shadow: 0 -20px 60px rgba(0,0,0,.4); padding-bottom: env(safe-area-inset-bottom); overflow: hidden; }
  #chatSheet { will-change: transform; }
  #chatSheet.kb .panel { padding-bottom: 0; }
  #chatSheet .hd { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  #chatSheet .av { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; flex-shrink: 0; }
  #chatSheet .av img { display: block; width: 40px; height: 40px; max-width: none; border-radius: 50%; object-fit: cover; }
  #chatSheet .av::after { content: ''; position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; background: #22c55e; border: 2px solid var(--modal); }
  #chatSheet .hd b { font-size: 15px; } #chatSheet .hd small { display: block; font-size: 11px; color: var(--fg3); }
  #chatSheet .x { width: 34px; height: 34px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; flex-shrink: 0; }
  #chatLog { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .cb { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .cb.me { align-self: flex-start; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 6px; }
  .cb.bot { align-self: flex-end; background: var(--chip); border-bottom-left-radius: 6px; }
  /* يكتب الحين: ثلاث نقاط تتحرك */
  .cb.wait { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .cb.wait i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); animation: dotUp 1.2s infinite ease-in-out; }
  .cb.wait i:nth-child(2) { animation-delay: .15s; } .cb.wait i:nth-child(3) { animation-delay: .3s; }
  @keyframes dotUp { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
  #chatChips { display: flex; gap: 6px; overflow-x: auto; padding: 0 14px 10px; scrollbar-width: none; flex-shrink: 0; }
  #chatChips:empty { display: none; }
  #chatChips button { flex-shrink: 0; padding: 7px 12px; border-radius: 999px; background: transparent; border: 1px solid var(--line); font-size: 12.5px; font-weight: 700; color: var(--fg); }
  #chatForm { display: flex; align-items: center; gap: 8px; margin: 0 12px 12px; padding: 5px 5px 5px 5px; border-radius: 999px; background: var(--input-bg); border: 1px solid var(--line); flex-shrink: 0; }
  #chatForm:focus-within { border-color: var(--accent); }
  #chatInput { flex: 1; min-width: 0; padding: 9px 12px; background: transparent; color: var(--fg); border: 0; font-size: 16px; outline: none; }
  #chatForm button { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
  #chatForm button:disabled { opacity: .45; }
  /* وقت المحادثة: الصفحة وراها ما تتحرك */
  /* وقت المحادثة: الصفحة مثبتة مكانها (Safari ما يوقف التمرير بـ overflow بس) */
  html.chat-lock, html.chat-lock body { overflow: hidden; overscroll-behavior: none; }
  html.chat-lock body { position: fixed; left: 0; right: 0; width: 100%; }
  /* ─── الثيم: القيم الافتراضية هنا = الثيم الداكن الأصلي، و js/theme.js يغيّرها حسب اختيار المطعم ─── */
  :root {
    --bg: #0b0b0b; --body-fg: #f5f5f5; --fg: #ffffff; --fg2: #d1d5db; --fg3: #9ca3af;
    --surface: rgba(18, 18, 18, 0.8); --surface-line: rgba(255, 255, 255, 0.18);
    --header: rgba(15, 15, 15, 0.85); --header-line: rgba(255, 255, 255, 0.15);
    --chip: rgba(255, 255, 255, 0.1); --chip2: rgba(255, 255, 255, 0.2);
    --line: rgba(255, 255, 255, 0.2); --line2: rgba(255, 255, 255, 0.3);
    --input-bg: rgba(0, 0, 0, 0.6); --ring-bg: rgba(0, 0, 0, 0.9);
    --modal: #18181b; --modal-head: rgba(24, 24, 27, 0.95);
    --ov-in: rgba(10, 10, 10, 0.4); --ov-out: rgba(10, 10, 10, 0.85); --media-filter: brightness(0.75) contrast(1.05);
    --dot: rgba(255, 255, 255, 0.3); --img-line: rgba(255, 255, 255, 0.2);
    --grp-bg: rgba(0, 0, 0, 0.3); --grp-fg: #ffffff; --grp-line: rgba(255, 255, 255, 0.25);
    --accent: #ffffff; --accent-fg: #000000; --accent-glow: rgba(255, 255, 255, 0.25);
    --price: #ffffff; --sec-line: rgba(255, 255, 255, 0.3);
  }
  body {
    font-family: 'SaudiRiyal', 'Cairo', sans-serif;
    background-color: var(--bg);
    color: var(--body-fg);
    min-height: 100vh;
    overflow-x: hidden;
  }
  #bg-media-container {
    position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden;
  }
  #bg-video, #bg-image {
    width: 100%; height: 100%; object-fit: cover; filter: var(--media-filter);
  }
  .bg-overlay {
    position: fixed; inset: 0; background: radial-gradient(circle at center, var(--ov-in) 0%, var(--ov-out) 100%); z-index: -1;
  }
  .glass-card {
    background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--surface-line); border-radius: 18px;
    transition: all 0.3s ease;
  }
  .glass-card:active { transform: scale(0.98); }
  .glass-header {
    background: var(--header); backdrop-filter: blur(16px); border-bottom: 1px solid var(--header-line);
  }
  .leader-line {
    flex: 1 1 10px; border-bottom: 1.5px dotted var(--dot); margin: 0 8px 6px 8px;
  }
  .product-img {
    width: 90px; height: 90px; object-fit: cover; border-radius: 14px; border: 1px solid var(--img-line); flex-shrink: 0;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  /* شكل "صور كبيرة": الصورة تغطي البطاقة والاسم والسعر فوقها */
  .photo-card { position: relative; border-radius: 22px; overflow: hidden; cursor: pointer; background: #111; aspect-ratio: 4 / 3; box-shadow: 0 18px 40px -22px rgba(0,0,0,.6); }
  .photo-card > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
  .photo-card:active > img { transform: scale(1.02); }
  .photo-card .pc-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 38%, rgba(0,0,0,.55) 65%, rgba(0,0,0,.88) 100%); }
  .photo-card .pc-body { position: absolute; inset-inline: 0; bottom: 0; padding: 14px 16px 14px; color: #fff; }
  .photo-card .pc-name { color: #fff; font-weight: 800; font-size: 17px; line-height: 1.35; }
  .photo-card .pc-desc { color: rgba(255,255,255,.78); font-size: 11.5px; margin-top: 3px; }
  .photo-card .pc-price { color: #fff; font-weight: 900; font-size: 15px; white-space: nowrap; }
  .photo-card.off { opacity: .5; filter: grayscale(1); cursor: default; }
  /* صورة الطبق كاملة بدون قص */
  .img-full { position: relative; background: #000; overflow: hidden; }
  .img-full .blur { position: absolute; inset: -20px; background: center / cover no-repeat; filter: blur(22px) brightness(.55); }
  .img-full img { position: relative; width: 100%; height: 100%; object-fit: contain; }
  #imgViewer img { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: pinch-zoom; }
  /* صور المنيو: بدون "حفظ الصورة" بالضغط المطوّل، وبدون سحبها أو تحديدها */
  img { -webkit-touch-callout: none; -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }
  /* body + :not() حتى يغلب تحويل ألوان الثيم الفاتح بالأسفل */
  body .cat-pill.active, body.tone-light .cat-pill.active:not(.keep-c) {
    background: var(--accent); color: var(--accent-fg); font-weight: 800; box-shadow: 0 4px 15px var(--accent-glow);
  }
  /* الفئات الرئيسية (فطور، غداء...) */
  .grp-btn { background: var(--grp-bg); color: var(--grp-fg); border-color: var(--grp-line); }
  .grp-btn.grp-on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .price { color: var(--price); }
  .sec-title { border-color: var(--sec-line); }
  .modal-panel { background-color: var(--modal); }
  /* اختيار الحجم في نافذة الطبق */
  .size-chip { background: var(--chip); border: 1px solid var(--line); color: var(--fg); }
  .old-price { text-decoration: line-through; opacity: .55; font-weight: 700; font-size: .85em; margin-inline-end: 4px; }
  .deal-badge { background: var(--accent); color: var(--accent-fg); }
  .size-chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .modal-head { background-color: var(--modal-head); }

  /* ─── الثيمات الفاتحة (فاتح / بيج): الصفحة مكتوبة بألوان داكنة ثابتة من Tailwind،
         فنحوّل ألوانها للمتغيرات هنا فقط. الثيم الداكن ما يتأثر بهذا الجزء أبداً ─── */
  body.tone-light .text-white:not(.keep-c), body.tone-light .text-gray-100 { color: var(--fg); }
  body.tone-light .text-white\/80, body.tone-light .text-gray-200, body.tone-light .text-gray-300 { color: var(--fg2); }
  body.tone-light .text-white\/60, body.tone-light .text-gray-400, body.tone-light .text-gray-500, body.tone-light .text-gray-600 { color: var(--fg3); }
  body.tone-light .bg-white\/5, body.tone-light .bg-white\/10 { background-color: var(--chip); }
  body.tone-light .bg-white\/15, body.tone-light .bg-white\/20,
  body.tone-light .hover\:bg-white\/20:hover { background-color: var(--chip2); }
  body.tone-light .border-white\/10, body.tone-light .border-white\/15, body.tone-light .border-white\/20,
  body.tone-light .border-white\/25 { border-color: var(--line); }
  body.tone-light .border-white, body.tone-light .border-white\/30, body.tone-light .border-white\/40,
  body.tone-light .focus\:border-white:focus, body.tone-light .focus\:border-white\/40:focus { border-color: var(--line2); }
  body.tone-light .bg-black\/60 { background-color: var(--input-bg); }
  body.tone-light .bg-black\/90 { background-color: var(--ring-bg); }
  body.tone-light .placeholder-gray-400::placeholder, body.tone-light .placeholder-gray-500::placeholder { color: var(--fg3); }
  body.tone-light .hover\:text-white:hover { color: var(--fg); }
  body.tone-light .text-amber-200, body.tone-light .text-amber-200\/90, body.tone-light .text-amber-300,
  body.tone-light .text-amber-300\/80, body.tone-light .hover\:text-amber-300:hover { color: #a16207; }
  body.tone-light .text-red-300, body.tone-light .hover\:text-red-300:hover { color: #dc2626; }
  body.tone-light .text-green-300 { color: #15803d; }
  body.tone-light #promo-banner, body.tone-light #waitlist-btn { box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.25); border: 1px solid var(--line); }
  .dine-btn { display:flex; align-items:center; justify-content:center; gap:8px; min-height:52px; border-radius:16px; font-weight:900; font-size:15px; color:#fff; background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.18); }
  .dine-btn.on { background:#fff; color:#111; border-color:#fff; }
  #moBar { background:#fff; color:#111; }
  #moBar.st-accepted { background:#fff7dc; } #moBar.st-served { background:#e7f6ec; }
  .mo-steps { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .mo-steps span { font-size:11px; font-weight:800; text-align:center; padding:6px 4px; border-radius:10px; background:rgba(255,255,255,.06); color:rgba(255,255,255,.55); }
  .mo-steps span.on { background:#fff; color:#111; }
</style>
<link rel="stylesheet" href="/css/tw/menu.css">
</head>

<body class="font-sans antialiased pb-16">

<!-- ميديا الخلفية -->
<div id="bg-media-container">
  <video id="bg-video" autoplay loop muted playsinline class="hidden"></video>
  <img id="bg-image" class="hidden">
</div>
<div class="bg-overlay"></div>

<!-- المحتوى الرئيسي للمنيو -->
<div id="app-content" class="w-full max-w-md mx-auto px-4 pt-4 relative z-10 space-y-5">

  <!-- زر تبديل اللغة وشعار الديجيتال منيو -->
  <div class="flex justify-between items-center">
    <button onclick="toggleLanguage()" class="bg-white/10 hover:bg-white/20 text-white px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition flex items-center gap-2 backdrop-blur-md">
      <i class="fa-solid fa-globe text-white"></i>
      <span id="lang-btn-text">English</span>
    </button>
    <span class="text-[10px] bg-white/10 text-white/80 border border-white/20 px-3 py-1 rounded-full font-bold">Digital Menu</span>
  </div>

  <!-- شريط العروض والرسائل الترويجية -->
  <div id="promo-banner" class="hidden bg-white text-black p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white">
    <div class="w-8 h-8 rounded-xl bg-black text-white keep-c flex items-center justify-center shrink-0 text-xs">
      <i class="fa-solid fa-bullhorn"></i>
    </div>
    <div class="flex-1 min-w-0">
      <p id="promo-label" class="text-[10px] font-black uppercase tracking-wider text-gray-600">إعلان / عرض خاص</p>
      <p id="promo-text" class="text-xs font-bold text-black"></p>
    </div>
  </div>

  <!-- أكواد الخصم الظاهرة في المنيو -->
  <div id="promo-codes" class="hidden space-y-2"></div>

  <!-- الترويسة والشعار -->
  <header id="menu-header" class="relative text-center space-y-3 pt-1">
    <div class="relative z-[1] w-32 h-32 mx-auto">
      <div class="absolute inset-0 bg-white/10 rounded-full blur-xl"></div>
      <div class="relative w-full h-full p-2 rounded-full bg-black/90 border-2 border-white/40 shadow-2xl flex items-center justify-center overflow-hidden">
        <img id="project-logo" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" class="w-full h-full object-cover rounded-full" onerror="this.onerror=null;this.src='images/logo.jpeg?v=2'">
      </div>
    </div>
    <div class="space-y-1">
      <h1 id="project-title" class="text-2xl font-black text-white tracking-widest uppercase min-h-[2rem]"></h1>
      <p id="project-type" class="text-xs text-gray-300 font-semibold tracking-wider min-h-[1rem]"></p>
    </div>
    <div id="occasion-greeting" class="hidden relative z-[1]"></div>
    <div id="info-bar" class="hidden flex-wrap justify-center gap-2 pt-1"></div>
  </header>

  <!-- قائمة الانتظار -->
  <a id="waitlist-btn" href="#" class="hidden items-center justify-between gap-3 bg-white text-black rounded-2xl px-4 py-3.5 shadow-2xl active:scale-[.99] transition">
    <span class="flex items-center gap-3">
      <span class="w-10 h-10 rounded-xl bg-black text-white keep-c flex items-center justify-center"><i class="fa-solid fa-hourglass-half"></i></span>
      <span class="leading-tight">
        <b id="waitlist-title" class="block text-sm">انضم لقائمة الانتظار</b>
        <span id="waitlist-sub" class="block text-[11px] text-gray-600">سجّل دورك ونبلغك لما تجهز طاولتك</span>
      </span>
    </span>
    <i class="fa-solid fa-chevron-left text-gray-400"></i>
  </a>

  <!-- تطبيقات التوصيل -->
  <div id="delivery-bar" class="hidden space-y-2">
    <p id="delivery-title" class="text-[11px] font-bold text-gray-300 text-center">اطلب توصيل عبر</p>
    <div id="delivery-list" class="flex gap-2 overflow-x-auto no-scrollbar justify-start sm:justify-center pb-1"></div>
  </div>

  <!-- البحث السريع -->

<script>
  // البيانات كلها تجي من خادمنا: /api/public
  // السعر بعملة المتجر (الافتراضي الريال الجديد "⃁ 25")
  const money = (n) => DM.money(n, project && project.currency, currentLang);


  // حماية من حقن الكود: أي نص قادم من قاعدة البيانات يمر من هنا قبل عرضه
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // يقبل روابط http/https فقط (يمنع روابط javascript:)
  function safeUrl(u) {
    if (!u) return '';
    try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : ''; }
    catch { return ''; }
  }
  const urlParams = new URLSearchParams(window.location.search);
  const clientSlug = (urlParams.get('client') || DM.hostSlug()).trim().toLowerCase();
  // ما نسمح بحفظ صور المنيو: قائمة الزر اليمين والسحب على أي صورة
  document.addEventListener('contextmenu', (e) => { if (e.target.closest('img, .img-full, #imgViewer')) e.preventDefault(); });
  document.addEventListener('dragstart', (e) => { if (e.target.tagName === 'IMG') e.preventDefault(); });
  // شعار المحل واسمه من آخر زيارة: يطلعون على طول بدل شعار DEV MENU لين يوصل المنيو
  const BRAND_KEY = `dm_brand_${clientSlug}`;
  try {
    const b = JSON.parse(localStorage.getItem(BRAND_KEY) || 'null');
    if (b && b.name) { document.getElementById('project-title').textContent = b.name; document.title = `${b.name} | المنيو الرقمي`; }
    if (b && /^https:\/\//.test(b.logo || '')) document.getElementById('project-logo').src = b.logo;
  } catch {}
  // مصدر الزيارة: رمز QR المطبوع أو رابط مشارك. نشيل src من الرابط حتى لا تُحسب المشاركات كمسح QR
  const visitSource = urlParams.get('src') === 'qr' ? 'qr' : 'link';
  if (urlParams.has('src')) {
    urlParams.delete('src');
    const qs = urlParams.toString();
    history.replaceState(null, '', location.pathname + (qs ? `?${qs}` : ''));
  }

  let project = null, allProducts = [], allCategories = [];
  let currentLang = 'ar', translating = false;
  const translationCache = {};

  // ─── الترجمة ───
  // أقسام شائعة بترجمة ثابتة (خدمة الترجمة أحياناً ترجّع "الفطور" بالعربي أو بحروف كبيرة)
  const GLOSSARY = {
    'الفطور': 'Breakfast', 'الافطار': 'Breakfast', 'الإفطار': 'Breakfast', 'فطور': 'Breakfast',
    'الغداء': 'Lunch', 'غداء': 'Lunch', 'العشاء': 'Dinner', 'عشاء': 'Dinner',
    'المشروبات': 'Drinks', 'مشروبات': 'Drinks', 'المشروبات الباردة': 'Cold Drinks', 'المشروبات الساخنة': 'Hot Drinks',
    'القهوة': 'Coffee', 'قهوة': 'Coffee', 'الحلى': 'Desserts', 'الحلويات': 'Desserts', 'حلى': 'Desserts',
    'السلطات': 'Salads', 'سلطات': 'Salads', 'المقبلات': 'Appetizers', 'مقبلات': 'Appetizers',
    'الأطباق الرئيسية': 'Main Dishes', 'الاطباق الرئيسية': 'Main Dishes', 'الشوربات': 'Soups', 'العصائر': 'Juices', 'عصائر': 'Juices',
    'المخبوزات': 'Bakery', 'الساندويتشات': 'Sandwiches', 'السندويتشات': 'Sandwiches', 'البيتزا': 'Pizza', 'البرجر': 'Burgers'
  };
  const hasArabic = (s) => /[؀-ۿ]/.test(s);
  // "SALADS" ← "Salads" و "Breakfast." ← "Breakfast" للنصوص القصيرة فقط
  function tidy(t, src) {
    t = String(t).trim();
    if (src.split(/\s+/).length > 3) return t;
    t = t.replace(/[.。]+$/, '');
    if (t.length > 3 && t === t.toUpperCase()) t = t.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    return t;
  }
  async function translateText(text) {
    if (!text || translationCache[text]) return;
    const fixed = GLOSSARY[text.trim()];
    if (fixed) { translationCache[text] = fixed; return; }
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|en`);
      const data = await res.json();
      // نرفض أي "ترجمة" فيها حروف عربية ونجرب البدائل
      const options = [data && data.responseData && data.responseData.translatedText, ...((data && data.matches) || []).map(m => m.translation)];
      const t = options.find(o => o && !hasArabic(o));
      if (t) translationCache[text] = tidy(t, text);
    } catch (e) { console.error(e); }
  }
  // يترجم كل النصوص دفعة وحدة (6 طلبات بالتوازي) بدل طبق طبق
  async function translateAll() {
    const texts = new Set();
    allCategories.forEach(c => { if (!c.name_en && c.name) texts.add(c.name); });
    allProducts.forEach(p => {
      if (!p.name_en && p.name) texts.add(p.name);
      if (!p.description_en && p.description) texts.add(p.description);
      if (p.extra_info) texts.add(p.extra_info);
      allCategories.forEach(c => c.group_name && texts.add(c.group_name));
      if (p.note) texts.add(p.note);
      (Array.isArray(p.sizes) ? p.sizes : []).forEach(z => { if (z && z.name && !z.name_en) texts.add(z.name); });
      if (p.coffee) [p.coffee.origin, p.coffee.region, p.coffee.process_other, ...(p.coffee.notes || [])].forEach(t => t && texts.add(t));
    });
    if (project && project.promo_message) texts.add(project.promo_message);
    const list = [...texts].filter(t => !translationCache[t]);
    for (let i = 0; i < list.length; i += 6) await Promise.all(list.slice(i, i + 6).map(translateText));
  }
  const tr = (t) => (currentLang === 'en' && t) ? (translationCache[t] || t) : (t || '');
  const productName = (p) => currentLang === 'en' ? (p.name_en || tr(p.name)) : p.name;
  const productDesc = (p) => currentLang === 'en' ? (p.description_en || tr(p.description)) : (p.description || '');
  // عرض السعرات خيار يفعّله صاحب المتجر (مفعّل افتراضياً)
  const caloriesOn = () => !project || project.show_calories !== false;
  // الأحجام: [{name, name_en, price}]. الطبق بدون أحجام سعره p.price
  const sizesOf = (p) => (p && Array.isArray(p.sizes) ? p.sizes.filter(z => z && z.name) : []);
  const sizeName = (z) => currentLang === 'en' ? (z.name_en || tr(z.name)) : z.name;
  function basePrice(p, size) {
    const zs = sizesOf(p);
    if (!zs.length) return Number(p.price);
    const z = zs.find(x => x.name === size);
    return z ? Number(z.price) : null;
  }

  // ─── العروض: خصم تلقائي على الأصناف + كوبونات ظاهرة في المنيو (نفس حسبة الخادم) ───
  const promos = () => (project && Array.isArray(project.promos) ? project.promos : []);
  const catKeyOf = (cat) => { const c = allCategories.find(x => x.key === cat || x.name === cat); return c ? c.key : cat; };
  const promoCovers = (x, p) => x.scope === 'all' || (x.product_ids || []).includes(Number(p.id)) || (x.category_keys || []).includes(catKeyOf(p.category));
  const promoLabel = (x) => x.type === 'percent' ? `${x.value}%` : money(x.value);
  function discounted(p, unit) {
    let best = unit;
    promos().filter(x => x.auto && promoCovers(x, p)).forEach(x => {
      const after = x.type === 'percent' ? unit * (1 - x.value / 100) : Math.max(0, unit - x.value);
      if (after < best) best = after;
    });
    return Math.round(best * 100) / 100;
  }
  // العرض التلقائي اللي يعطي أقل سعر للطبق (لشارة الخصم)
  const afterPromo = (x, unit) => x.type === 'percent' ? unit * (1 - x.value / 100) : Math.max(0, unit - x.value);
  const autoDeal = (p) => {
    const base = sizesOf(p).length ? Math.min(...sizesOf(p).map(z => Number(z.price))) : Number(p.price);
    return promos().filter(x => x.auto && promoCovers(x, p)).sort((a, b) => afterPromo(a, base) - afterPromo(b, base))[0] || null;
  };
  // سعر الوحدة الفعلي (بعد الخصم التلقائي)
  function unitPrice(p, size) { const b = basePrice(p, size); return b == null ? null : discounted(p, b); }
  const minBase = (p) => { const zs = sizesOf(p); return zs.length ? Math.min(...zs.map(z => Number(z.price))) : Number(p.price); };
  const minPrice = (p) => { const zs = sizesOf(p); return zs.length ? Math.min(...zs.map(z => discounted(p, Number(z.price)))) : discounted(p, Number(p.price)); };
  // سعر معروض: القديم مشطوب + الجديد
  const priceHtml = (base, now) => now < base ? `<span class="old-price">${esc(money(base))}</span>${esc(money(now))}` : esc(money(now));

        <span class="deal-badge w-9 h-9 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-ticket"></i></span>
        <span class="flex-1 min-w-0">
          <b class="block text-sm text-white">${T(`خصم ${promoLabel(x)}`, `${promoLabel(x)} off`)} ${x.scope === 'all' ? T('على كل الأصناف', 'on everything') : T('على أصناف مختارة', 'on selected items')}</b>
          <span class="block text-[11px] text-gray-300">${T('استخدم الكود في سلة الطلب', 'Use this code in your order')}${x.min_order ? T(` · أقل طلب ${money(x.min_order)}`, ` · min. order ${money(x.min_order)}`) : ''}</span>
        </span>
        <span class="shrink-0 font-black text-xs text-white border border-dashed border-white/40 rounded-lg px-2.5 py-1.5" dir="ltr">${esc(x.code)}</span>
      </button>`).join('');
  }
  document.getElementById('promo-codes').addEventListener('click', (e) => {
    const b = e.target.closest('[data-code]'); if (!b) return;
    document.getElementById('couponInput').value = b.dataset.code;

    menuToast(T(`تم نسخ الكود ${b.dataset.code}، ويتطبق في سلة الطلب`, `Code ${b.dataset.code} copied — apply it in your order`));
  });
  const catName = (c) => currentLang === 'en' ? (c.name_en || tr(c.name)) : c.name;
  const bySort = (a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0) || a.id - b.id;

  // تفاصيل القهوة المختصة [عربي، إنجليزي]
  const COFFEE_PROCESS = { washed: ['مغسولة', 'Washed'], natural: ['مجففة (طبيعية)', 'Natural'], honey: ['عسلية', 'Honey'], anaerobic: ['لاهوائية', 'Anaerobic'], carbonic: ['كربونية', 'Carbonic maceration'], other: ['أخرى', 'Other'] };
  const COFFEE_ROAST   = { light: ['فاتحة', 'Light'], medium: ['متوسطة', 'Medium'], dark: ['داكنة', 'Dark'] };
  const COFFEE_METHODS = { v60: ['V60', 'V60'], chemex: ['كيمكس', 'Chemex'], aeropress: ['إيروبرس', 'AeroPress'], frenchpress: ['فرنش برس', 'French press'], espresso: ['إسبريسو', 'Espresso'], coldbrew: ['كولد برو', 'Cold brew'] };

  const ALLERGEN_LABELS = {

  // إحصائيات مجهولة: مرة واحدة لكل زيارة (بدون أي بيانات شخصية)

  // يعرض بيانات المنيو. first = أول تحميل، وغيره = تحديث تلقائي (نحافظ على السلة والبحث والتمرير)
  let menuVersion = null;

  // ─── مساعد المنيو الذكي ───
  let chatMsgs = [], chatBusy = false;
  const chatT = (ar, en) => currentLang === 'en' ? en : ar;
  function chatBubble(role, text, cls = '') {
    const el = document.createElement('p'); el.className = `cb ${role === 'user' ? 'me' : 'bot'} ${cls}`; el.textContent = text;
    const log = document.getElementById('chatLog'); log.appendChild(el); log.scrollTop = log.scrollHeight; return el;
  }
  // أول ما تنفتح: ترحيب عفوي بلهجة سعودية
  function chatIntro() {
    chatBubble('assistant', chatT(`يا هلا والله في ${project.name} 👋 اسألني عن أي شي في المنيو: الأسعار، السعرات، وش فيه الطبق، أو قل لي وش تشتهي وأنا أضبطك.`,
      `Hey, welcome to ${project.name} 👋 Ask me anything about the menu: prices, calories, what's in a dish, or tell me what you're craving and I'll sort you out.`));
  }
  // الكيبورد في الجوال: النافذة تاخذ الجزء الظاهر من الشاشة بس، فخانة الكتابة تبقى فوق الكيبورد
  // (تحديث وحد لكل إطار، ونحرّكها بـ transform، وارتفاعها يتحسب هنا بدل ما يقفز بين مقاسين = ما تهتز)
  let fitFrame = 0, lockY = 0;
  function fitChat() {
    if (fitFrame) return;
    fitFrame = requestAnimationFrame(() => {
      fitFrame = 0;
      const sheet = document.getElementById('chatSheet'), vv = window.visualViewport;
      if (!sheet.classList.contains('open') || !vv) return;
      const kb = window.innerHeight - vv.height > 120;   // الكيبورد مفتوح
      sheet.style.height = `${Math.round(vv.height)}px`;
      sheet.style.transform = `translateY(${Math.round(vv.offsetTop)}px)`;
      sheet.classList.toggle('kb', kb);
      sheet.querySelector('.panel').style.height = kb ? `${Math.round(vv.height) - 6}px` : `${Math.min(640, Math.round(vv.height * 0.78))}px`;
      const log = document.getElementById('chatLog'); log.scrollTop = log.scrollHeight;
    });
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', fitChat); visualViewport.addEventListener('scroll', fitChat); }
  // لما يضغط على الخانة: نخلي Safari يطلع الكيبورد براحته، ونلحقه بالمحادثة (بدون ما نرجّع التمرير ونتعارك معه)
  document.getElementById('chatInput').addEventListener('focus', () => { [60, 250, 500].forEach(t => setTimeout(fitChat, t)); });
  // وقت المحادثة: السحب برّا الرسائل ما يحرك الشاشة (عشان المحادثة تبقى ثابتة والرد ظاهر)
  document.addEventListener('touchmove', (e) => {
    if (!document.getElementById('chatSheet').classList.contains('open')) return;
    const box = e.target.closest('#chatLog, #chatChips');
    if (box && box.scrollHeight > box.clientHeight + 1 || box && box.id === 'chatChips') return;
    e.preventDefault();
  }, { passive: false });
  document.getElementById('chatInput').addEventListener('blur', () => setTimeout(fitChat, 120));
  function openChat() {
    document.getElementById('chatSheet').classList.add('open');
    lockY = window.scrollY; document.body.style.top = `-${lockY}px`;
    document.documentElement.classList.add('chat-lock'); window.scrollTo({ top: 0, behavior: 'instant' }); fitChat();
    document.getElementById('chatTitle').textContent = chatT('المساعد الذكي', 'Smart assistant');
    document.getElementById('chatSub').textContent = chatT(`${project ? project.name + ' · ' : ''}يرد خلال ثواني`, `${project ? project.name + ' · ' : ''}Replies in seconds`);
    const av = document.getElementById('chatAv');
    if (project && project.logo_url && !av.querySelector('img')) { const im = new Image(); im.alt = ''; im.onload = () => { av.innerHTML = ''; av.appendChild(im); }; im.src = project.logo_url; }
    document.getElementById('chatInput').placeholder = chatT('اسأل عن أي طبق…', 'Ask about any dish…');
    if (!document.getElementById('chatLog').children.length) {
      chatIntro();
      document.getElementById('chatChips').onclick = (e) => { const b = e.target.closest('button'); if (b) { document.getElementById('chatInput').value = b.textContent; sendChat(); } };
      showChatChips();
      // أكثر أسئلة زبائن المحل تصير أزرار (لو فيه أسئلة كافية)
      DM.get(`/api/public?action=chat-faq&slug=${encodeURIComponent(clientSlug)}`).then(r => { chatFaq = (r.questions || []).filter(Boolean); if (!chatAsked.size) showChatChips(); }).catch(() => {});
    }
    // بعد أول فتح يصغر الزر لأيقونة، والمحادثة تبقى محفوظة لو رجع لها
    document.getElementById('chatFab').classList.add('mini');
    // في الكمبيوتر نحط المؤشر في الخانة، وفي الجوال لا (الكيبورد يغطي المحادثة قبل ما يقرأ الترحيب)
    if (window.matchMedia('(pointer: fine)').matches) setTimeout(() => document.getElementById('chatInput').focus(), 50);
  }
  // السطر الصغير تحت "اسأل المساعد" يتبدل كل 3 ثواني: وش يقدر يجاوب عنه
  let fabTalkTimer = null;
  const FAB_LINES = { ar: ['عن الأسعار والسعرات', 'محتار وش تطلب؟', 'يقترح لك حسب ميزانيتك', 'عن المكونات والحساسية', 'يرد خلال ثواني'],
    en: ['Prices & calories', "Can't decide?", 'Picks for your budget', 'Ingredients & allergies', 'Replies in seconds'] };
  function fabTalk() {
    const fab = document.getElementById('chatFab'), say = document.getElementById('chatFabText');
    document.getElementById('chatFabTitle').textContent = currentLang === 'en' ? 'Ask the assistant' : 'اسأل المساعد';
    let i = 0;
    const show = () => { const lines = FAB_LINES[currentLang === 'en' ? 'en' : 'ar']; say.innerHTML = `<span>${esc(lines[i % lines.length])}</span>`; i++; };
    show();
    fabTalkTimer = setInterval(() => { if (fab.classList.contains('mini')) return clearInterval(fabTalkTimer); show(); }, 3000);
  }
  let chatFaq = [];
  const chatAsked = new Set();
  // الأزرار: الأسئلة الشائعة اللي ما انسألت في هالمحادثة، وإلا أسئلة جاهزة
  function showChatChips() {
    const base = currentLang === 'en' ? ['What do you recommend?', 'Something under 30', "What's your most popular dish?"] : ['وش تنصحني؟', 'أبي شي أقل من 30', 'وش أشهر طبق عندكم؟'];
    const list = [...chatFaq, ...base].filter((q, i, a) => a.indexOf(q) === i && !chatAsked.has(q)).slice(0, 4);
    document.getElementById('chatChips').innerHTML = list.map(c => `<button type="button">${esc(c)}</button>`).join('');
    // الأزرار تاخذ مكان تحت الرسائل: ننزل لآخر رد عشان ما يتغطى
    const log = document.getElementById('chatLog'); log.scrollTop = log.scrollHeight;
  }
  function closeChat() {
    const sheet = document.getElementById('chatSheet');
    document.getElementById('chatInput').blur();
    sheet.classList.remove('open', 'kb'); sheet.style.transform = ''; sheet.style.height = ''; sheet.querySelector('.panel').style.height = '';
    // نرجّع الصفحة لنفس مكانها قبل المحادثة
    document.documentElement.classList.remove('chat-lock'); document.body.style.top = ''; window.scrollTo({ top: lockY, behavior: 'instant' });   // الصفحة فيها scroll-smooth، فنرجعها فوراً بدون حركة
  }
  async function sendChat(e) {
    if (e) e.preventDefault();
    const input = document.getElementById('chatInput'), text = input.value.trim();
    if (!text || chatBusy) return;
    input.value = ''; chatBusy = true; document.getElementById('chatSend').disabled = true;
    document.getElementById('chatChips').innerHTML = '';
    chatAsked.add(text);
    chatBubble('user', text); chatMsgs.push({ role: 'user', content: text });
    const wait = chatBubble('assistant', '', 'wait'); wait.innerHTML = '<i></i><i></i><i></i>'; wait.setAttribute('aria-label', chatT('يكتب…', 'Typing…'));
    try {
      const r = await DM.post('/api/public?action=menu-chat', { slug: clientSlug, messages: chatMsgs.slice(-6) });
      wait.remove(); chatBubble('assistant', r.reply); chatMsgs.push({ role: 'assistant', content: r.reply }); fitChat();
    } catch (err) {
      wait.remove(); chatBubble('assistant', err.message || chatT('ما قدرت أرد الحين، جرّب مرة ثانية', "Couldn't answer right now, try again"));
      chatMsgs.pop();
    } finally { chatBusy = false; document.getElementById('chatSend').disabled = false; showChatChips(); if (document.activeElement === input || window.matchMedia('(pointer: fine)').matches) input.focus(); }
  }

  function applyMenu(menuData, first) {
    const p = menuData.store;
    const prevOccasion = project ? JSON.stringify(project.occasion || null) : null;
    project = p;
    menuVersion = menuData.version || null;

    if (window.DMTheme) DMTheme.apply(p);
    document.title = `${p.name || 'Dev Menu'} | المنيو الرقمي`;
    document.getElementById('project-title').textContent = p.name || 'Dev Menu';
    const TYPE_LABELS = { restaurant: 'RESTAURANT', cafe: 'SPECIALTY COFFEE', mixed: 'RESTAURANT &amp; CAFE', bakery: 'BAKERY &amp; SWEETS', clinic: 'CLINIC', salon: 'SALON', carwash: 'CAR WASH', laundry: 'LAUNDRY', retail: 'STORE', pharmacy: 'PHARMACY', services: 'SERVICES' };
    if (p.business_type && TYPE_LABELS[p.business_type]) document.getElementById('project-type').innerHTML = TYPE_LABELS[p.business_type];
    const logo = safeUrl(p.logo_url);
    const logoEl = document.getElementById('project-logo');
    if (logo) { if (logoEl.getAttribute('src') !== logo) logoEl.src = logo; }
    else logoEl.src = 'images/logo.jpeg?v=2';
    try { localStorage.setItem(BRAND_KEY, JSON.stringify({ name: p.name || '', logo: logo || '' })); } catch {}

    const promo = (p.promo_message || '').trim();
    document.getElementById('promo-text').textContent = tr(promo);
    document.getElementById('promo-banner').classList.toggle('hidden', !promo);

    renderSocialLinks(p);
    renderCustomLinks();
    document.getElementById('chatFab').classList.toggle('hidden', p.menu_chat !== true);
    // زر المساعد بشعار المحل (ولو ما فيه شعار تبقى أيقونة المحادثة)
    if (p.menu_chat === true && p.logo_url) {
      const bot = document.querySelector('#chatFab .bot');
      if (bot.dataset.logo !== p.logo_url) { const im = new Image(); im.alt = ''; im.onload = () => { bot.innerHTML = ''; bot.appendChild(im); bot.classList.add('logo'); bot.dataset.logo = p.logo_url; }; im.src = p.logo_url; }
    }

    if (p.menu_chat === true && !fabTalkTimer) fabTalk();
    // زينة المناسبة الجارية: نعيد رسمها فقط لو تغيّرت (حتى ما تنعاد القصاصات مع كل تحديث)
    if (window.DMOccasions) {
      const header = document.getElementById('menu-header'), greet = document.getElementById('occasion-greeting');
      try {
        if (first || JSON.stringify(p.occasion || null) !== prevOccasion) {
          if (p.occasion) DMOccasions.render(p.occasion, { header, greet, lang: currentLang });
          else DMOccasions.clear(header, greet);
        }
      } catch (e) { console.warn('occasion', e); }
    }
    setBackground(p);

    allCategories = (menuData.categories || []).sort(bySort);
    allProducts = (menuData.products || []).sort(bySort);

    renderInfoBar();
    renderWaitlistBtn();
    renderDeliveryBar();
    renderPromoCodes();
    renderFilterBar();
    renderLayoutToggle();
    loadCart();   // يشيل من السلة أي صنف انحذف أو صار غير متوفر
    if (first) renderMenu(allProducts, false); else handleSearch();
    renderCartBar();
    renderCalorieNote();
    if (first && directMode() === 'table') refreshOrders();   // طلباته السابقة على الطاولة وحالتها
    if (!first && coupon && cart.length) applyCoupon(true);
    // نفس اللغة اللي اختارها الزائر في باقي صفحات DEV MENU
    let saved = ''; try { saved = localStorage.getItem('dm_lang'); } catch {}
    if (first && saved === 'en' && currentLang === 'ar') toggleLanguage();
  }

  function setBackground(p) {
    const video = safeUrl(p.bg_video_url), image = safeUrl(p.bg_image_url);
    const v = document.getElementById('bg-video'), img = document.getElementById('bg-image');
    if (video) {
      if (v.getAttribute('src') !== video) { v.src = video; v.play().catch(e => console.log('Autoplay failed:', e)); }
      v.classList.remove('hidden'); img.classList.add('hidden');
      return;
    }
    if (v.getAttribute('src')) { v.pause(); v.removeAttribute('src'); v.load(); }
    v.classList.add('hidden');
    if (image) { if (img.getAttribute('src') !== image) img.src = image; img.classList.remove('hidden'); }
    else img.classList.add('hidden');
  }

  // ─── التحديث التلقائي: أي تعديل من لوحة التحكم يوصل للمنيو المفتوح بدون تحديث الصفحة ───
  // نسأل عن "بصمة" المنيو كل 12 ثانية (والصفحة ظاهرة فقط)، ولو تغيّرت نجيب المنيو من جديد
  const LIVE_EVERY = 12000;
  let liveTimer = null, liveChecking = false, lastPolledVersion = null;
  async function checkForUpdates(fresh = false) {
    if (liveChecking || document.hidden || !menuVersion) return;
    liveChecking = true;
    try {
      // fresh = جاء تنبيه لحظي من الخادم ← نتجاوز نسخة الـ CDN المخزنة
      const { v } = await DM.get(`/api/public?action=menu-version&slug=${encodeURIComponent(clientSlug)}${fresh ? `&r=${Date.now()}` : ''}`);
      if (v === 'off') { clearInterval(liveTimer); return showUnavailable('المنيو غير متاح حالياً', 'هذا المنيو غير موجود أو متوقف مؤقتاً.'); }
      if (v && v !== menuVersion && v !== lastPolledVersion) {
        lastPolledVersion = v;
        applyMenu(await DM.get(`/api/public?action=menu&slug=${encodeURIComponent(clientSlug)}&v=${encodeURIComponent(v)}`), false);
      }
    } catch (e) {
      if (e.status === 404) { clearInterval(liveTimer); showUnavailable('المنيو غير متاح حالياً', 'هذا المنيو غير موجود أو متوقف مؤقتاً.'); }
    } finally { liveChecking = false; }
  }
  function startLiveUpdates(topic) {
    liveTimer = setInterval(checkForUpdates, LIVE_EVERY);
    // تحديث لحظي: صاحب المطعم يعدّل ← يتحدث المنيو عند الزبون على طول
    DM.live(topic, () => checkForUpdates(true));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdates(); });
  }

  function renderSocialLinks(p) {
    const container = document.getElementById('social-links-container');
    const base = 'w-10 h-10 rounded-full flex items-center justify-center transition border';
    const plain = `${base} bg-white/10 hover:bg-white/20 border-white/20 text-white`;
    const wa = String(p.whatsapp_number || '').replace(/\D/g, '');
    const links = [
      [safeUrl(p.website_url),   'fa-solid fa-globe',     plain],
      [safeUrl(p.tiktok_url),    'fa-brands fa-tiktok',   plain],
      [safeUrl(p.instagram_url), 'fa-brands fa-instagram', plain],
      [wa ? `https://wa.me/${wa}` : '', 'fa-brands fa-whatsapp', `${base} bg-green-600/30 hover:bg-green-600/50 border-green-500/40 text-green-300`],
      [safeUrl(p.snapchat_url),  'fa-brands fa-snapchat', plain]
    ].filter(([url]) => url);

    if (links.length === 0) return container.classList.add('hidden');
    container.innerHTML = links.map(([url, icon, cls]) =>
      `<a href="${esc(url)}" target="_blank" rel="noopener" class="${cls}"><i class="${icon}"></i></a>`).join('');
    container.classList.remove('hidden');
  }

  // ─── العرض ───
  const productsIn = (cat, list) => list.filter(p => p.category === cat.key || p.category === cat.name).sort(bySort);

  // ─── الفئات الرئيسية (فطور، غداء، عشاء...) ───
  const OTHER_GROUP = '__other';
  let activeGroup = null;
  function menuGroups() {
    const cats = allCategories.filter(c => productsIn(c, allProducts).length > 0);
    const names = [...new Set(cats.map(c => c.group_name).filter(Boolean))];
    if (!names.length) return [];
    if (cats.some(c => !c.group_name)) names.push(OTHER_GROUP);
    return names;
  }
  const groupOf = (c) => c.group_name || OTHER_GROUP;
  function visibleCats() {
    const groups = menuGroups();
    if (!groups.length) return allCategories;
    if (!groups.includes(activeGroup)) activeGroup = groups[0];
    return allCategories.filter(c => groupOf(c) === activeGroup);
  }
  function renderGroupBar() {
    const bar = document.getElementById('group-bar');
    const groups = menuGroups();
    bar.classList.toggle('hidden', groups.length === 0);
    bar.classList.toggle('flex', groups.length > 0);
    if (!groups.length) return;
    if (!groups.includes(activeGroup)) activeGroup = groups[0];
    bar.innerHTML = groups.map(g => `
      <button type="button" data-group="${esc(g)}" class="grp-btn shrink-0 px-5 py-2.5 rounded-2xl text-sm font-black transition border ${g === activeGroup ? 'grp-on' : ''}">
        ${esc(g === OTHER_GROUP ? (currentLang === 'ar' ? 'أخرى' : 'More') : tr(g))}
      </button>`).join('');
  }
  document.getElementById('group-bar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-group]'); if (!b) return;
    activeGroup = b.dataset.group;
    document.getElementById('search-input').value = '';
    renderGroupBar(); renderFilterBar(); renderMenu(allProducts, false);
    const bar = document.getElementById('group-bar');
    window.scrollTo({ top: bar.getBoundingClientRect().top + window.scrollY - 16, behavior: 'smooth' });
  });

  function renderFilterBar() {
    renderGroupBar();
    const bar = document.getElementById('fast-filter-bar');
    const cats = visibleCats().filter(c => productsIn(c, allProducts).length > 0);
    bar.parentElement.classList.toggle('hidden', cats.length === 0);
    bar.innerHTML = cats.map((c, i) => `
      <button type="button" data-cat="${esc(c.id)}" class="cat-pill ${i === 0 ? 'active' : ''} px-4 py-2 rounded-xl bg-white/10 border border-white/25 shrink-0 text-xs text-white font-bold transition">
        ${esc(catName(c))}
      </button>`).join('');
  }

  // شارات الخصم على الطبق: خصم تلقائي، أو كوبون ظاهر يشمله
  function dealBadges(p) {
    const out = [];
    const a = autoDeal(p);
    if (a) out.push(`<span class="deal-badge inline-flex items-center gap-1 mt-1 ml-1 text-[10px] px-2 py-0.5 rounded-md font-black"><i class="fa-solid fa-tag"></i> ${T(`خصم ${promoLabel(a)}`, `${promoLabel(a)} off`)}</span>`);
    if (orderingOn()) promos().filter(x => !x.auto && x.code && x.scope !== 'all' && promoCovers(x, p)).slice(0, 1).forEach(x =>
      out.push(`<span class="inline-flex items-center gap-1 mt-1 ml-1 bg-white/10 border border-dashed border-white/30 text-white text-[10px] px-2 py-0.5 rounded-md font-bold"><i class="fa-solid fa-ticket"></i> ${promoLabel(x)} <span dir="ltr">${esc(x.code)}</span></span>`));
    return out.join('');
  }

  function productCard(p) {
    const available = p.is_available !== false;
    const img = safeUrl(p.image_url);
    const name = productName(p), desc = productDesc(p);
    const canOrder = available && orderingOn();
    const inCart = canOrder ? cartQty(p.id) : 0;
    const cls = available

      : 'glass-card p-3 flex gap-3 items-center opacity-45 grayscale';
    return `
      <article ${available ? `data-product="${esc(p.id)}" role="button" tabindex="0"` : ''} class="${cls}">
        ${img
          ? `<img src="${esc(img)}" alt="" loading="lazy" class="product-img">`

        ${canOrder ? `<button type="button" data-add="${esc(p.id)}" aria-label="${currentLang === 'ar' ? 'أضف للطلب' : 'Add to order'}"
            class="absolute bottom-2.5 left-2.5 z-10 min-w-[34px] h-[34px] px-2 rounded-full ${inCart ? 'bg-[#25d366] text-black' : 'bg-white/15 text-white border border-white/25'} text-sm font-black flex items-center justify-center active:scale-90 transition">
            ${inCart ? inCart : '<i class="fa-solid fa-plus text-xs"></i>'}</button>` : ''}
        <div class="flex-1 min-w-0 ${canOrder ? 'pl-9' : ''}">
          <div class="flex items-start justify-between gap-2">
            <h4 class="font-bold text-[15px] sm:text-sm text-white leading-snug line-clamp-2 min-w-0">${esc(name)}</h4>
            <span class="leader-line hidden sm:block self-end"></span>
            <span class="price font-black text-[15px] sm:text-sm shrink-0 whitespace-nowrap">${sizesOf(p).length ? `<span class="text-[10px] font-bold opacity-75">${currentLang === 'ar' ? 'من' : 'From'}</span> ` : ''}${priceHtml(minBase(p), minPrice(p))}</span>
          </div>
          ${dealBadges(p)}
          ${p.is_bestseller === true ? `<span class="inline-flex items-center gap-1 mt-1 bg-white/15 text-white text-[10px] px-2 py-0.5 rounded-md font-bold border border-white/25"><i class="fa-solid fa-fire text-amber-400"></i> ${currentLang === 'ar' ? 'مميز' : 'Featured'}</span>` : ''}
          ${desc ? `<p class="text-[11px] text-gray-300 line-clamp-2 mt-1">${esc(desc)}</p>` : ''}

              ${(p.coffee.notes || []).length ? `<div class="flex flex-wrap gap-1">${p.coffee.notes.slice(0, 3).map(n => `<span class="bg-white/10 text-gray-200 text-[9px] font-bold px-1.5 py-0.5 rounded-md">${esc(tr(n))}</span>`).join('')}</div>` : ''}
            </div>` : ''}
          ${caloriesOn() && p.calories != null ? `<p class="text-[10px] text-gray-400 mt-1"><i class="fa-solid fa-fire-flame-simple text-amber-400/80"></i> ${Number(p.calories)} ${currentLang === 'ar' ? 'سعرة حرارية' : 'kcal'}</p>` : ''}
          ${!available ? `<p class="text-[10px] font-bold text-red-300 mt-1">${currentLang === 'ar' ? 'غير متوفر حالياً' : 'Currently unavailable'}</p>` : ''}
        </div>
      </article>`;
  }

  // شكل الأطباق يختاره الزبون وينحفظ في جواله (وإلا الشكل القديم اللي كان مختار للمحل)
  let menuView = ''; try { menuView = localStorage.getItem('dm_menu_view') || ''; } catch {}

  function renderLayoutToggle() {

  function photoCard(p) {
    const img = safeUrl(p.image_url);
    if (!img) return productCard(p);   // الطبق بدون صورة يطلع بالشكل العادي

        <span class="pc-shade"></span>
        ${canOrder ? `<button type="button" data-add="${esc(p.id)}" aria-label="${currentLang === 'ar' ? 'أضف للطلب' : 'Add to order'}"
            class="absolute top-3 left-3 z-10 min-w-[38px] h-[38px] px-2 rounded-full ${inCart ? 'bg-[#25d366] text-black' : 'text-white keep-c'} text-sm font-black flex items-center justify-center active:scale-90 transition backdrop-blur" style="${inCart ? '' : 'background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3)'}">
            ${inCart ? inCart : '<i class="fa-solid fa-plus text-xs"></i>'}</button>` : ''}
        ${p.is_bestseller === true ? `<span style="background:rgba(0,0,0,.55)" class="absolute top-3 right-3 z-10 inline-flex items-center gap-1 text-white keep-c text-[10px] px-2 py-1 rounded-full font-bold backdrop-blur"><i class="fa-solid fa-fire text-amber-400"></i> ${currentLang === 'ar' ? 'مميز' : 'Featured'}</span>` : ''}
        <div class="pc-body">
          <div class="flex items-end justify-between gap-3">
            <h4 class="pc-name line-clamp-2 min-w-0">${esc(name)}</h4>
