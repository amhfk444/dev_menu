<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<meta name="theme-color" content="#233d2c">
<title>شاشة البيجر | DEV MENU</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --brand: #233d2c; --sand: #f5f2eb; --gold: #c9a227; }
  body { font-family: 'Cairo', sans-serif; background: var(--sand); color: #1b3022; }
  .panel { background: #fff; border: 1.5px solid rgba(35,61,44,.12); border-radius: 26px; }
  .tile { border-radius: 22px; padding: 18px 10px 14px; text-align: center; font-weight: 900; transition: transform .12s, box-shadow .2s; user-select: none; }
  .tile:active { transform: scale(.96); }
  .tile-wait { background: var(--brand); color: var(--sand); box-shadow: 0 14px 26px -16px rgba(35,61,44,.7); cursor: pointer; }
  .tile-wait:hover { box-shadow: 0 18px 30px -14px rgba(35,61,44,.8); }
  .tile-ready { background: #fff7dc; color: #8a6d0f; border: 2px solid rgba(201,162,39,.5); }
  .tile .n { font-size: 46px; line-height: 1; }
  .mini { font-size: 12px; font-weight: 800; border-radius: 12px; padding: 7px 10px; }
  @media print { body * { visibility: hidden; } #print-card, #print-card * { visibility: visible; } #print-card { position: fixed; inset: 0; margin: auto; } }
</style>
</head>
<body class="min-h-screen">
<div id="toast" class="fixed top-4 inset-x-0 mx-auto w-fit z-50 hidden bg-[#15271b] text-[#f5f2eb] text-sm font-black px-5 py-3 rounded-2xl shadow-xl"></div>

<header class="sticky top-0 z-40 bg-[#f5f2eb]/90 backdrop-blur border-b border-[#233d2c]/10">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <a href="admin.html" class="w-10 h-10 rounded-xl bg-white border border-[#233d2c]/15 grid place-items-center text-[#233d2c]" title="لوحة التحكم"><i class="fa-solid fa-arrow-right"></i></a>
      <div class="min-w-0">
        <h1 class="text-base font-black truncate"><i class="fa-solid fa-bell text-[#c9a227]"></i> شاشة البيجر — <span id="store-name">…</span></h1>
        <p class="text-[11px] font-bold opacity-55">اضغط على الرقم لما يجهز الطلب، ويرن جوال العميل</p>
      </div>
    </div>
    <button id="qr-btn" class="mini bg-white border border-[#233d2c]/15 shrink-0"><i class="fa-solid fa-qrcode"></i> QR للطباعة</button>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
  <section class="panel p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-black">قيد التجهيز <span id="wait-count" class="text-sm opacity-50"></span></h2>
      <span class="text-[11px] font-bold opacity-50"><i class="fa-solid fa-rotate"></i> يتحدث تلقائياً</span>
    </div>
    <div class="relative mb-4">
      <i class="fa-solid fa-magnifying-glass absolute start-4 top-1/2 -translate-y-1/2 opacity-40"></i>
      <input id="search" type="text" inputmode="numeric" autocomplete="off" placeholder="ابحث برقم الفاتورة أو رقم البيجر…" class="w-full bg-[#f5f2eb] border border-[#233d2c]/15 rounded-2xl py-3 ps-11 pe-4 text-base font-black outline-none focus:border-[#233d2c]">
    </div>
    <div id="wait-grid" class="grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-7 gap-3"></div>
    <p id="wait-empty" class="text-center text-sm font-bold opacity-50 py-8 hidden">ما فيه أرقام تنتظر. أول ما يمسح العميل الـ QR يطلع رقمه هنا.</p>
  </section>

  <section class="panel p-5">
    <h2 class="text-lg font-black mb-4">جاهز — بانتظار الاستلام <span id="ready-count" class="text-sm opacity-50"></span></h2>
    <div id="ready-grid" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3"></div>
    <p id="ready-empty" class="text-center text-sm font-bold opacity-50 py-6 hidden">ما فيه طلبات جاهزة.</p>
  </section>
</main>

<!-- رقم الفاتورة -->
<div id="inv-modal" class="fixed inset-0 z-50 bg-black/50 hidden items-center justify-center p-5">
  <form id="inv-form" class="bg-white rounded-[28px] p-7 w-full max-w-sm space-y-4">
    <h3 class="text-lg font-black">🧾 رقم الفاتورة للبيجر <span id="inv-num" class="text-[#c9a227]"></span></h3>
    <input id="inv-input" type="text" inputmode="numeric" autocomplete="off" dir="ltr" maxlength="20" placeholder="1045" class="w-full text-center text-3xl font-black tracking-widest bg-[#f5f2eb] border-2 border-[#233d2c]/15 rounded-2xl py-4 outline-none focus:border-[#233d2c]">
    <p id="inv-err" class="hidden text-sm font-bold text-rose-700"></p>
    <div class="flex gap-2">
      <button type="submit" id="inv-save" class="flex-1 bg-[#233d2c] text-[#f5f2eb] font-black rounded-2xl py-3">حفظ</button>
      <button type="button" id="inv-cancel" class="flex-1 bg-white border border-[#233d2c]/20 font-black rounded-2xl py-3">إلغاء</button>
    </div>
  </form>
</div>

<!-- QR -->
<div id="qr-modal" class="fixed inset-0 z-50 bg-black/50 hidden items-center justify-center p-5">
  <div id="print-card" class="bg-white rounded-[28px] p-8 w-full max-w-sm text-center space-y-4">
    <h3 id="qr-store" class="text-xl font-black"></h3>
    <p class="text-base font-black text-[#233d2c]"><i class="fa-solid fa-bell text-[#c9a227]"></i> امسح وخذ رقمك</p>
    <div id="qr-box" class="mx-auto w-fit p-3 bg-white rounded-2xl border border-[#233d2c]/10"></div>
    <p class="text-sm font-bold opacity-70 leading-relaxed">قل رقمك للكاشير مع طلبك،<br>وبنرن جوالك لما يجهز طلبك</p>
    <p id="qr-url" class="text-[11px] font-bold opacity-50 break-all" dir="ltr"></p>
    <div class="flex gap-2 pt-2 print:hidden">
      <button onclick="window.print()" class="flex-1 bg-[#233d2c] text-[#f5f2eb] font-black rounded-2xl py-3"><i class="fa-solid fa-print"></i> طباعة</button>
      <button id="qr-close" class="flex-1 bg-white border border-[#233d2c]/20 font-black rounded-2xl py-3">إغلاق</button>
    </div>
  </div>
</div>

<script>
  const P = new URLSearchParams(location.search);
  const extra = `${P.get('client') ? `&client=${encodeURIComponent(P.get('client'))}` : ''}${P.get('branch') ? `&branch=${encodeURIComponent(P.get('branch'))}` : ''}`;
  const O = (a) => `/api/owner?action=${a}${extra}`;
  const $ = (id) => document.getElementById(id);
  let slug = '', tickets = [], busy = new Set(), maxRings = 5;

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), 2600); }
  const ago = (iso) => { const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000)); return m < 1 ? 'الآن' : `${m} د`; };

  async function call(action, body) {
    try { return body === undefined ? await DM.get(O(action), true) : await DM.post(O(action), body, true); }
    catch (e) { if (e.status === 401) { location.replace('login.html'); } throw e; }
  }

  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const normDigits = (v) => String(v).replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) & 15));

  // ─── رقم الفاتورة ───
  let invId = null;
  function openInvoice(id) {
    const t = tickets.find(x => x.id === id); if (!t) return;
    invId = id; $('inv-num').textContent = t.number; $('inv-input').value = t.invoice_no || '';
    $('inv-err').classList.add('hidden'); $('inv-modal').classList.replace('hidden', 'flex');
    setTimeout(() => $('inv-input').focus(), 50);
  }
  const closeInvoice = () => { invId = null; $('inv-modal').classList.replace('flex', 'hidden'); };
  $('inv-cancel').onclick = closeInvoice;
  $('inv-form').onsubmit = async (e) => {
    e.preventDefault();
    const invoice = normDigits($('inv-input').value.trim());
    $('inv-save').disabled = true;
    try {
      const r = await call('pager-invoice', { id: invId, invoice });
      tickets = tickets.map(t => t.id === r.ticket.id ? { ...t, invoice_no: r.ticket.invoice_no } : t);
      toast(invoice ? `🧾 الفاتورة ${invoice} ← بيجر ${r.ticket.number}` : 'انشال رقم الفاتورة');
      closeInvoice(); render();
    } catch (err) { $('inv-err').textContent = err.message || 'حدث خطأ'; $('inv-err').classList.remove('hidden'); }
    $('inv-save').disabled = false;
  };
  $('search').addEventListener('input', () => render());

  function ringLabel(t) {
    if (t.acked_at) return '<span class="text-emerald-700"><i class="fa-solid fa-circle-check"></i> شاف التنبيه</span>';
    if (!t.has_push) return `<i class="fa-solid fa-bell fa-shake"></i> جاهز من ${ago(t.ready_at)}`;
    const n = t.ring_count || 0;
    return n >= maxRings ? `<i class="fa-solid fa-bell-slash"></i> رنّ ${n} مرات — نادِه` : `<i class="fa-solid fa-bell fa-shake"></i> رنّة ${n}/${maxRings}`;
  }

  // تكرار الإشعار: كل 30 ثانية نطلب من الخادم يعيد الرنين لمن ما شاف التنبيه
  let lastRing = 0;
  async function ringDue() {
    const pending = tickets.some(t => t.status === 'ready' && t.has_push && !t.acked_at && (t.ring_count || 0) < maxRings);
    if (!pending || Date.now() - lastRing < 30000) return;
    lastRing = Date.now();
    try { const r = await call('pager-ring', {}); if (r.rang) load(); } catch {}
  }

  function render() {
    const term = normDigits($('search').value.trim());
    const match = (t) => !term || String(t.number) === term || String(t.invoice_no || '').includes(term);
    const waiting = tickets.filter(t => t.status === 'waiting' && match(t));
    const ready = tickets.filter(t => t.status === 'ready' && match(t));
    $('wait-count').textContent = waiting.length ? `(${waiting.length})` : '';
    $('ready-count').textContent = ready.length ? `(${ready.length})` : '';
    $('wait-empty').classList.toggle('hidden', waiting.length > 0);
    $('ready-empty').classList.toggle('hidden', ready.length > 0);
    $('wait-grid').innerHTML = waiting.map(t => `
      <div class="tile tile-wait">
        <div class="text-[10px] opacity-60">بيجر</div>
        <div class="n">${t.number}</div>
        <button class="mini w-full mt-2 ${t.invoice_no ? 'bg-white/15 text-white' : 'bg-[#c9a227] text-[#15271b]'}" data-invoice="${t.id}">
          ${t.invoice_no ? `🧾 ${esc(t.invoice_no)}` : '🧾 أضف الفاتورة'}
        </button>
        <button class="mini w-full mt-1.5 bg-white text-[#233d2c]" data-ready="${t.id}" ${busy.has(t.id) ? 'disabled' : ''}>
          ${busy.has(t.id) ? '<i class="fa-solid fa-spinner fa-spin"></i>' : '<i class="fa-solid fa-bell"></i> جاهز'}
        </button>
        <div class="text-[10px] mt-1.5 opacity-50">${ago(t.created_at)}${t.has_push ? ' · <i class="fa-solid fa-mobile-screen" title="الإشعارات مفعّلة"></i>' : ''}</div>
      </div>`).join('');
    $('ready-grid').innerHTML = ready.map(t => `
      <div class="tile tile-ready">
        <div class="n">${t.number}</div>
        ${t.invoice_no ? `<div class="text-[12px] font-black mt-1">🧾 ${esc(t.invoice_no)}</div>` : ''}
        <div class="text-[11px] mt-1 opacity-70">${ringLabel(t)}</div>
        <div class="flex gap-1.5 mt-3">
          <button class="mini flex-1 bg-[#233d2c] text-white" data-done="${t.id}"><i class="fa-solid fa-check"></i> استلم</button>
          <button class="mini bg-white border border-[#c9a227]/40" data-undo="${t.id}" title="إرجاع للتجهيز"><i class="fa-solid fa-rotate-left"></i></button>
        </div>
      </div>`).join('');
  }

  async function setStatus(id, status, msg) {
    busy.add(id); render();
    try {
      const r = await call('pager-update', { id, status });
      tickets = tickets.map(t => t.id === id ? { ...t, ...r.ticket } : t);
      if (msg) toast(msg.replace('#', r.ticket.number) + (status === 'ready' && r.push === 'sent' ? ' 📲 وانرسل له إشعار' : ''));
    } catch (e) { toast(e.message || 'حدث خطأ'); }
    busy.delete(id); render();
  }

  document.addEventListener('click', (e) => {
    const r = e.target.closest('[data-ready]'), d = e.target.closest('[data-done]'), u = e.target.closest('[data-undo]'), inv = e.target.closest('[data-invoice]');
    if (inv) return openInvoice(+inv.dataset.invoice);
    if (r) setStatus(+r.dataset.ready, 'ready', '🔔 جوال رقم # يرن الحين');
    if (d) setStatus(+d.dataset.done, 'done', '✓ رقم # استلم طلبه');
    if (u) setStatus(+u.dataset.undo, 'waiting', 'رقم # رجع للتجهيز');
  });

  let timer = null;
  async function load() {
    clearTimeout(timer);
    try {
      const r = await call('pager');
      slug = r.slug; $('store-name').textContent = r.name || ''; maxRings = r.max_rings || 5;
      // ما نلمس الأرقام اللي جاري تحديثها
      tickets = r.tickets.map(t => busy.has(t.id) ? (tickets.find(x => x.id === t.id) || t) : t);
      if (invId) return void (timer = setTimeout(load, 4000));   // النافذة مفتوحة: لا نعيد الرسم
      render(); ringDue();
    } catch (e) { if (e.status !== 401) toast(e.message || 'تعذر التحديث'); }
    timer = setTimeout(load, document.hidden ? 15000 : 4000);
  }

  $('qr-btn').onclick = () => {
    if (!slug) return;
    const url = DM.storeUrl(slug, 'pager');
    $('qr-store').textContent = $('store-name').textContent;
    $('qr-url').textContent = url;
    $('qr-box').innerHTML = '';
    new QRCode($('qr-box'), { text: url, width: 220, height: 220, colorDark: '#15271b', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    $('qr-modal').classList.replace('hidden', 'flex');
  };
  $('qr-close').onclick = () => $('qr-modal').classList.replace('flex', 'hidden');
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

  if (!DM.signedIn()) location.replace('login.html');
  else { DM.watchAccount(); load(); }
</script>
</body>
</html>
