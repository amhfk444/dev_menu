<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Menu | لوحة تحكم الأدمن العامة</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="js/api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* رمز الريال السعودي الجديد ⃁ (U+20C1): خط مخصص يُستخدم لهذا الرمز فقط */
  @font-face {
    font-family: 'SaudiRiyal';
    src: url('https://cdn.jsdelivr.net/npm/@emran-alhaddad/saudi-riyal-font@1.1.0/fonts/regular/saudi_riyal.woff2') format('woff2');
    font-weight: 100 600; font-display: swap; unicode-range: U+20C1;
  }
  @font-face {
    font-family: 'SaudiRiyal';
    src: url('https://cdn.jsdelivr.net/npm/@emran-alhaddad/saudi-riyal-font@1.1.0/fonts/bold/saudi_riyal.woff2') format('woff2');
    font-weight: 700 900; font-display: swap; unicode-range: U+20C1;
  }
  body { font-family: 'SaudiRiyal', 'Cairo', sans-serif; background-color: #0b0b0b; color: #ffffff; min-height: 100vh; }
  .pro-card { background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; }
  .input-pro { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 0.5rem; color: #fff; font-size: 0.75rem; }
</style>
</head>
<body class="py-6 px-4 max-w-6xl mx-auto space-y-6">

  <div id="auth-loading" class="fixed inset-0 z-40 flex flex-col items-center justify-center gap-3 text-xs text-gray-400 text-center px-6">
    <i class="fa-solid fa-spinner fa-spin text-lg"></i>
    <span>جاري التحقق من الصلاحية...</span>
  </div>

  <div id="toast" class="fixed bottom-5 left-5 z-[60] hidden px-5 py-3 rounded-2xl shadow-2xl border text-xs font-bold"></div>

  <!-- نافذة التأكيد -->
  <div id="dlg" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
    <div role="dialog" aria-modal="true" aria-labelledby="dlg-title" class="w-full max-w-md bg-zinc-950 border border-white/15 rounded-2xl shadow-2xl overflow-hidden">
      <div class="p-6 space-y-4">
        <div class="flex items-start gap-3.5">
          <div id="dlg-icon" class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0"></div>
          <div class="space-y-1.5 min-w-0 pt-0.5">
            <h2 id="dlg-title" class="text-sm font-black text-white leading-snug"></h2>
            <p id="dlg-message" class="text-xs text-gray-400 leading-relaxed"></p>
          </div>
        </div>
        <ul id="dlg-list" class="hidden text-xs text-gray-200 bg-white/[0.04] border border-white/10 rounded-xl p-3.5 space-y-2"></ul>
        <div id="dlg-confirm-wrap" class="hidden space-y-2">
          <label for="dlg-input" class="text-[11px] text-gray-400 block">للتأكيد، اكتب رابط المتجر: <b id="dlg-expected" class="text-white font-mono select-all" dir="ltr"></b></label>
          <input id="dlg-input" type="text" dir="ltr" autocomplete="off" spellcheck="false" class="input-pro font-mono !text-sm !py-2.5 focus:outline-none focus:border-red-500/60">
        </div>
      </div>
      <div class="flex gap-2 justify-end px-6 py-4 bg-white/[0.03] border-t border-white/10">
        <button id="dlg-cancel" type="button" class="px-4 py-2 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/15 text-white transition">إلغاء</button>
        <button id="dlg-ok" type="button"></button>
      </div>
    </div>
  </div>

  <div id="app" class="space-y-6" style="visibility:hidden">
    <header class="pro-card p-4 flex flex-wrap gap-3 justify-between items-center">
      <h1 class="text-base font-black text-amber-400"><i class="fa-solid fa-crown"></i> إدارة مشتركي DEV MENU</h1>
      <div class="flex flex-wrap items-center gap-2 text-xs">
        <span class="bg-white/10 px-3 py-1 rounded-xl">الكل: <b id="count-all">0</b></span>
        <span class="bg-green-500/15 text-green-300 px-3 py-1 rounded-xl">ساري: <b id="count-live">0</b></span>
        <span class="bg-amber-500/15 text-amber-300 px-3 py-1 rounded-xl">ينتهي خلال 3 أيام: <b id="count-soon">0</b></span>
        <span class="bg-red-500/15 text-red-300 px-3 py-1 rounded-xl">منتهي/موقوف: <b id="count-dead">0</b></span>
        <button onclick="logout()" class="bg-white/10 hover:bg-white/20 px-3 py-1 rounded-xl border border-white/20"><i class="fa-solid fa-right-from-bracket text-[10px]"></i> خروج</button>
      </div>
    </header>

    <div class="pro-card p-5 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-white/10 pb-3">
        <h3 class="text-xs font-bold text-white">قائمة العملاء والمطاعم</h3>
        <div class="flex flex-wrap items-center gap-2">
          <div id="filter-tabs" class="flex gap-1 text-[11px] font-bold">
            <button data-f="all" class="ftab px-3 py-1.5 rounded-lg bg-white text-black">الكل</button>
            <button data-f="soon" class="ftab px-3 py-1.5 rounded-lg bg-white/10 text-white">ينتهي قريباً</button>
            <button data-f="dead" class="ftab px-3 py-1.5 rounded-lg bg-white/10 text-white">منتهي/موقوف</button>
          </div>
          <input type="text" id="search" oninput="renderClients()" placeholder="بحث بالاسم أو الرابط أو البريد..." class="input-pro max-w-xs">
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-right text-xs">
          <thead class="bg-white/5 text-gray-300 border-b border-white/10">
            <tr>
              <th class="p-3">المتجر والتواصل</th>
              <th class="p-3">الاشتراك</th>
              <th class="p-3">إشعار للعميل</th>
              <th class="p-3 text-center">الإجراءات</th>
            </tr>
          </thead>
          <tbody id="admin-clients-list" class="divide-y divide-white/10">
            <tr><td colspan="4" class="text-center py-6 text-gray-400">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  // كل عمليات المدير العام تمر عبر خادمنا: /api/admin (يتحقق من الصلاحية بنفسه)
  const A = (action) => `/api/admin?action=${action}`;
  // السعر مع رمز الريال الجديد: "⃁ 25" (الرمز يسار الرقم)
  const SAR = '\u20C1';
  const money = (n) => `\u2066${SAR} ${n}\u2069`;


  // حماية من حقن الكود: أي نص قادم من قاعدة البيانات يمر من هنا قبل عرضه
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // يقبل روابط http/https فقط (يمنع روابط javascript:)
  function safeUrl(u) {
    if (!u) return '';
    try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : ''; }
    catch { return ''; }
  }
  let clients = [];

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `fixed bottom-5 left-5 z-50 px-5 py-3 rounded-2xl shadow-2xl border text-xs font-bold ${isError ? 'bg-zinc-900 border-red-500 text-white' : 'bg-white border-white text-black'}`;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => t.classList.add('hidden'), 3200);
  }

  // نافذة تأكيد بتصميم اللوحة بدل نوافذ المتصفح
  function confirmDialog({ title, message, items = [], confirmText = 'تأكيد', tone = 'danger', expected = '' }) {
    return new Promise(resolve => {
      const $ = (id) => document.getElementById(id);
      const dlg = $('dlg'), ok = $('dlg-ok'), cancel = $('dlg-cancel'), input = $('dlg-input');
      const tones = {
        danger:  { icon: 'fa-trash-can',   box: 'bg-red-500/15 text-red-400 border border-red-500/30',             btn: 'bg-red-600 hover:bg-red-500',         item: 'fa-xmark text-red-400' },
        success: { icon: 'fa-circle-check', box: 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30', btn: 'bg-emerald-600 hover:bg-emerald-500', item: 'fa-check text-emerald-400' },
        warning: { icon: 'fa-pause',        box: 'bg-amber-500/15 text-amber-400 border border-amber-500/30',       btn: 'bg-amber-600 hover:bg-amber-500',     item: 'fa-minus text-amber-400' }
      };
      const t = tones[tone] || tones.danger;

      $('dlg-icon').className = `w-11 h-11 rounded-xl flex items-center justify-center shrink-0 ${t.box}`;
      $('dlg-icon').innerHTML = `<i class="fa-solid ${t.icon}"></i>`;
      $('dlg-title').textContent = title;
      $('dlg-message').textContent = message;
      const list = $('dlg-list');
      list.innerHTML = items.map(x => `<li class="flex items-center gap-2.5"><i class="fa-solid ${t.item} text-[10px] w-3"></i><span>${esc(x)}</span></li>`).join('');
      list.classList.toggle('hidden', items.length === 0);
      $('dlg-confirm-wrap').classList.toggle('hidden', !expected);
      $('dlg-expected').textContent = expected;
      input.value = '';
      ok.textContent = confirmText;
      ok.className = `px-4 py-2 rounded-xl text-xs font-bold text-white transition disabled:opacity-40 disabled:cursor-not-allowed ${t.btn}`;

      const valid = () => !expected || input.value.trim().toLowerCase() === expected.toLowerCase();
      ok.disabled = !valid();

      const close = (result) => {
        dlg.classList.add('hidden'); dlg.classList.remove('flex');
        document.removeEventListener('keydown', onKey);
        ok.onclick = cancel.onclick = dlg.onclick = input.oninput = null;
        resolve(result);
      };
      const onKey = (e) => {
        if (e.key === 'Escape') close(false);
        if (e.key === 'Enter' && valid() && (expected ? document.activeElement === input : true)) { e.preventDefault(); close(true); }
      };
      input.oninput = () => { ok.disabled = !valid(); };
      ok.onclick = () => { if (valid()) close(true); };
      cancel.onclick = () => close(false);
      dlg.onclick = (e) => { if (e.target === dlg) close(false); };
      document.addEventListener('keydown', onKey);

      dlg.classList.remove('hidden'); dlg.classList.add('flex');
      (expected ? input : tone === 'danger' ? cancel : ok).focus();
    });
  }

  async function logout() {
    await DM.logout();
    window.location.replace('login.html');
  }

  function statusOf(c) {
    const end = c.subscription_status === 'active' ? c.subscription_end_date : c.trial_ends_at;
    const left = end ? Math.ceil((new Date(end) - Date.now()) / 86400000) : null;
    const endText = end ? new Date(end).toLocaleDateString('ar-SA-u-ca-gregory') : 'بدون تاريخ';
    if (c.is_active === false) return { live: false, badge: 'bg-red-500/20 text-red-300', label: 'موقوف', endText, left };
    if (c.subscription_status === 'trial' && (left === null || left > 0)) return { live: true, badge: 'bg-blue-500/20 text-blue-300', label: 'تجريبي', endText, left };
    if (c.subscription_status === 'active' && (left === null || left > 0)) return { live: true, badge: 'bg-green-500/20 text-green-300', label: 'مشترك مدفوع', endText, left };
    return { live: false, badge: 'bg-red-500/20 text-red-300', label: 'منتهي', endText, left };
  }

  async function init() {
    if (!DM.signedIn()) return window.location.replace('login.html');
    let isAdmin = false;
    try { await DM.get(A('check'), true); isAdmin = true; }
    catch (e) { if (e.status === 401) return window.location.replace('login.html'); }
    if (!isAdmin) {
      document.getElementById('auth-loading').innerHTML = `
        <i class="fa-solid fa-lock text-lg"></i><span>هذه الصفحة للمدير العام فقط.</span>
        <a href="admin.html" class="bg-white text-black font-bold px-4 py-2 rounded-xl mt-2">لوحة متجري</a>`;
      return;
    }
    document.getElementById('auth-loading').remove();
    document.getElementById('app').style.visibility = 'visible';
    loadClients();
  }

  async function loadClients() {
    try { clients = (await DM.get(A('list'), true)).clients || []; }
    catch (e) { console.error(e); return showToast(`تعذر تحميل العملاء: ${e.message}`, true); }
    const liveCount = clients.filter(c => statusOf(c).live).length;
    document.getElementById('count-all').textContent = clients.length;
    document.getElementById('count-live').textContent = liveCount;
    document.getElementById('count-dead').textContent = clients.length - liveCount;
    document.getElementById('count-soon').textContent = clients.filter(isSoon).length;
    renderClients();
  }

  let currentFilter = 'all';
  document.getElementById('filter-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    currentFilter = b.dataset.f;
    document.querySelectorAll('.ftab').forEach(x => {
      const on = x === b;
      x.classList.toggle('bg-white', on); x.classList.toggle('text-black', on);
      x.classList.toggle('bg-white/10', !on); x.classList.toggle('text-white', !on);
    });
    renderClients();
  });

  // ينتهي خلال 3 أيام (ولسا شغال)
  const isSoon = (c) => { const st = statusOf(c); return st.live && st.left !== null && st.left <= 3; };

  // رسالة واتساب جاهزة لصاحب المتجر
  // يحوّل 05xxxxxxxx أو +9665xxxxxxxx إلى 9665xxxxxxxx (صيغة واتساب)
  function waPhone(raw) {
    let d = String(raw || '').replace(/\D/g, '');
    if (d.startsWith('00')) d = d.slice(2);
    if (d.startsWith('05')) d = '966' + d.slice(1);
    else if (d.startsWith('5') && d.length === 9) d = '966' + d;
    return /^9665\d{8}$/.test(d) ? d : '';
  }

  function reminderLink(c) {
    const phone = waPhone(c.phone);
    if (!phone) return '';
    const st = statusOf(c);
    const menu = new URL(`menu.html?client=${encodeURIComponent(c.client_slug)}`, window.location.href).href;
    const msg = st.live
      ? `مرحباً، معك فريق DEV MENU 👋\nنذكّرك إن ${c.subscription_status === 'trial' ? 'التجربة المجانية' : 'اشتراك'} منيو "${c.name}" ينتهي خلال ${st.left} ${st.left === 1 ? 'يوم' : 'أيام'}.\nللتجديد: الباقة الشهرية 99 ر.س أو السنوية 1149 ر.س.\nرابط منيوك: ${menu}`
      : `مرحباً، معك فريق DEV MENU 👋\nمنيو "${c.name}" متوقف حالياً عن الزبائن بسبب انتهاء الاشتراك.\nتقدر تجدده الآن ويرجع فوراً: الباقة الشهرية 99 ر.س أو السنوية 1149 ر.س.`;
    return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  }

  function renderClients() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const list = clients
      .filter(c => currentFilter === 'all' || (currentFilter === 'soon' ? isSoon(c) : !statusOf(c).live))
      .filter(c => !q || [c.name, c.client_slug, c.email, c.phone].some(v => v && String(v).toLowerCase().includes(q)));
    const tbody = document.getElementById('admin-clients-list');

    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-400">${clients.length ? 'لا توجد نتائج' : 'لا يوجد عملاء بعد'}</td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(c => {
      const id = Number(c.id), st = statusOf(c);
      const slug = encodeURIComponent(c.client_slug || '');
      return `
        <tr class="hover:bg-white/5 align-top">
          <td class="p-3 space-y-0.5">
            <p class="font-bold text-white">${esc(c.name || 'بدون اسم')}</p>
            <p class="text-[10px] text-gray-400 font-mono" dir="ltr">${esc(c.client_slug)}</p>
            <p class="text-[10px] text-gray-400" dir="ltr">${esc(c.email || '— بدون بريد —')}</p>
            ${c.phone ? (waPhone(c.phone) ? `<a href="https://wa.me/${waPhone(c.phone)}" target="_blank" rel="noopener" class="text-[10px] text-green-300" dir="ltr">${esc(c.phone)}</a>` : `<p class="text-[10px] text-gray-400" dir="ltr">${esc(c.phone)}</p>`) : ''}
          </td>
          <td class="p-3 space-y-1">
            <span class="${st.badge} px-2 py-0.5 rounded-full text-[10px] font-bold">${st.label}</span>
            <p class="text-[10px] ${isSoon(c) ? 'text-amber-300 font-bold' : 'text-gray-400'}">ينتهي: ${esc(st.endText)}${st.left !== null && st.left > 0 ? ` (${st.left} يوم)` : ''}</p>
            ${reminderLink(c) ? `<a href="${esc(reminderLink(c))}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 bg-green-600/20 hover:bg-green-600/35 border border-green-500/30 text-green-300 text-[10px] font-bold px-2 py-1 rounded-lg transition"><i class="fa-brands fa-whatsapp"></i> ${st.live ? 'تذكير بالتجديد' : 'رسالة تجديد'}</a>` : ''}
          </td>
          <td class="p-3 space-y-1 min-w-[180px]">
            <input type="text" id="notif-${id}" placeholder="اكتب إشعاراً للعميل..." class="input-pro" value="${esc(c.admin_notification || '')}">
            <button onclick="sendNotification(${id})" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] px-2.5 py-1 rounded">حفظ الإشعار</button>
          </td>
          <td class="p-3">
            <div class="flex flex-wrap justify-center gap-1">
              <button onclick="activate(${id}, 'month')" class="bg-amber-600 hover:bg-amber-500 text-white px-2 py-1.5 rounded text-[10px] font-bold">+ شهر (${totalFor(c, 'month')})</button>
              <button onclick="activate(${id}, 'year')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1.5 rounded text-[10px] font-bold">+ سنة (${totalFor(c, 'year')})</button>
              <button onclick="setWaitlistAddon(${id}, ${!c.waitlist_enabled})" title="إضافة قائمة الانتظار المدفوعة" class="${c.waitlist_enabled ? 'bg-sky-600 text-white hover:bg-sky-500' : 'bg-white/10 text-white hover:bg-white/20'} px-2 py-1.5 rounded text-[10px] font-bold"><i class="fa-solid fa-hourglass-half text-[9px]"></i> ${c.waitlist_enabled ? 'الانتظار مفعّل' : 'تفعيل الانتظار'}</button>
              <button onclick="setActive(${id}, ${c.is_active === false})" class="${c.is_active === false ? 'bg-green-700 hover:bg-green-600' : 'bg-red-600/50 hover:bg-red-600'} text-white px-2 py-1.5 rounded text-[10px]">${c.is_active === false ? 'إعادة تشغيل' : 'إيقاف'}</button>
              <button onclick="setFeatured(${id}, ${!c.is_featured})" title="عرض المتجر كمثال في الصفحة الرئيسية" class="${c.is_featured ? 'bg-[#c9a227] text-black hover:bg-[#d8b13a]' : 'bg-white/10 text-white hover:bg-white/20'} px-2 py-1.5 rounded text-[10px] font-bold"><i class="fa-solid fa-star text-[9px]"></i> ${c.is_featured ? 'معروض كمثال' : 'اعرضه كمثال'}</button>
              <a href="admin.html?client=${slug}" target="_blank" class="bg-white/10 hover:bg-white/20 text-white px-2 py-1.5 rounded text-[10px]">لوحته</a>
              <a href="menu.html?client=${slug}" target="_blank" class="bg-white/10 hover:bg-white/20 text-white px-2 py-1.5 rounded text-[10px]">المنيو</a>
              <button onclick="deleteClient(${id})" class="bg-red-900/60 hover:bg-red-700 text-red-100 px-2 py-1.5 rounded text-[10px] border border-red-500/40"><i class="fa-solid fa-trash text-[9px]"></i> حذف</button>
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  async function activate(id, period) {
    const c = clients.find(x => x.id === id);
    const label = period === 'year' ? 'سنة' : 'شهر';
    const confirmed = await confirmDialog({
      title: `تفعيل اشتراك ${label}`,
      message: `سيتم تفعيل اشتراك ${label} لمتجر "${c ? (c.name || c.client_slug) : id}".`,
      items: [
        `المبلغ: ${money(totalFor(c, period))}${c && c.waitlist_enabled ? ` (الباقة ${PLAN_PRICE[period]} + قائمة الانتظار ${WAITLIST_PRICE[period]})` : ''}`,
        'إذا كان الاشتراك سارياً، تُضاف المدة على تاريخ انتهائه الحالي',
        'يعود المنيو للظهور فوراً إذا كان متوقفاً'
      ],
      confirmText: `تفعيل ${label}`,
      tone: 'success'
    });
    if (!confirmed) return;
    const error = await DM.post(A('activate'), { id, period }, true).then(() => null, e => e);
    if (error) { console.error(error); return showToast('تعذر التفعيل', true); }
    showToast(`تم تفعيل ${label}`);
    loadClients();
  }

  async function setActive(id, active) {
    const c = clients.find(x => x.id === id);
    const name = c ? (c.name || c.client_slug) : id;
    const confirmed = await confirmDialog(active
      ? { title: 'إعادة تشغيل المتجر', message: `سيعود منيو "${name}" للظهور للزبائن (إذا كان اشتراكه سارياً).`, confirmText: 'إعادة تشغيل', tone: 'success' }
      : { title: 'إيقاف المتجر', message: `سيختفي منيو "${name}" عن الزبائن فوراً، ويمكنك إعادة تشغيله في أي وقت.`,
          items: ['لا تُحذف أي بيانات', 'صاحب المتجر يرى تنبيه الإيقاف في لوحته'], confirmText: 'إيقاف المتجر', tone: 'warning' });
    if (!confirmed) return;
    const error = await DM.post(A('set-active'), { id, active }, true).then(() => null, e => e);
    if (error) { console.error(error); return showToast('تعذر تنفيذ العملية', true); }
    showToast(active ? 'تمت إعادة تشغيل المتجر' : 'تم إيقاف المتجر');
    loadClients();
  }

  async function sendNotification(id) {
    const msg = document.getElementById(`notif-${id}`).value;
    const error = await DM.post(A('notify'), { id, message: msg }, true).then(() => null, e => e);
    if (error) { console.error(error); return showToast('تعذر حفظ الإشعار', true); }
    showToast(msg.trim() ? 'سيظهر الإشعار في لوحة العميل' : 'تم حذف الإشعار');
    loadClients();
  }

  // ─── عرض المتجر كمثال حقيقي في الصفحة الرئيسية ───
  // الأسعار (نفسها في لوحة صاحب المتجر)
  const PLAN_PRICE = { month: 99, year: 1149 };
  const WAITLIST_PRICE = { month: 49, year: 490 };
  const totalFor = (c, period) => PLAN_PRICE[period] + (c && c.waitlist_enabled ? WAITLIST_PRICE[period] : 0);

  // إضافة قائمة الانتظار: تُفعّل بعد دفع قيمتها، وتنضاف على فاتورة التجديد
  async function setWaitlistAddon(id, enabled) {
    const c = clients.find(x => x.id === id);
    const confirmed = await confirmDialog(enabled
      ? { title: 'تفعيل قائمة الانتظار', message: `لمتجر "${c ? (c.name || c.client_slug) : id}".`,
          items: [`تنضاف على الفاتورة: ${money(WAITLIST_PRICE.month)} شهرياً أو ${money(WAITLIST_PRICE.year)} سنوياً`, 'تظهر له صفحة "قائمة الانتظار" في لوحته فوراً'],
          confirmText: 'تفعيل', tone: 'success' }
      : { title: 'إيقاف قائمة الانتظار', message: 'يختفي زر الانتظار من المنيو وتتوقف التسجيلات. التسجيلات السابقة ما تنحذف.', confirmText: 'إيقاف', tone: 'warning' });
    if (!confirmed) return;
    const error = await DM.post(A('waitlist-addon'), { id, enabled }, true).then(() => null, e => e);
    if (error) { console.error(error); return showToast('تعذر التحديث', true); }
    showToast(enabled ? 'تم تفعيل قائمة الانتظار' : 'تم إيقاف قائمة الانتظار');
    loadClients();
  }

  async function setFeatured(id, featured) {
    const c = clients.find(x => x.id === id);
    const error = await DM.post(A('featured'), { id, featured }, true).then(() => null, e => e);
    if (error) { console.error(error); return showToast('تعذر التحديث', true); }
    if (featured && c && !statusOf(c).live) showToast('تم، لكنه لن يظهر في الرئيسية حتى يكون اشتراكه سارياً');
    else showToast(featured ? 'سيظهر المتجر في أمثلة الصفحة الرئيسية' : 'تمت إزالة المتجر من الأمثلة');
    loadClients();
  }

  // ─── حذف متجر نهائياً ───
  // يحوّل رابط الملف العام إلى مساره داخل bucket menu-images
  function storagePath(url) {
    const marker = '/storage/v1/object/public/menu-images/';
    if (!url) return '';
    const i = url.indexOf(marker);
    return i === -1 ? '' : decodeURIComponent(url.slice(i + marker.length).split('?')[0]);
  }

  async function deleteClient(id) {
    const c = clients.find(x => x.id === id);
    if (!c) return;
    // تجميع ما سيُحذف لعرضه في نافذة التأكيد
    let counts = { products: 0, categories: 0 };
    try { counts = await DM.post(A('summary'), { id }, true); } catch (e) { console.warn(e); }
    const items = [
      `${counts.products} طبق و ${counts.categories} قسم`,
      'الشعار والخلفيات وصور الأطباق',
      'حالة الاشتراك والإشعارات'
    ];
    if (c.email) items.push(`حساب الدخول: ${c.email}`);

    const confirmed = await confirmDialog({
      title: `حذف متجر "${c.name || c.client_slug}" نهائياً`,
      message: 'لا يمكن التراجع عن هذا الإجراء. سيتم حذف:',
      items,
      confirmText: 'حذف نهائي',
      tone: 'danger',
      expected: c.client_slug
    });
    if (!confirmed) return;

    showToast('جاري حذف المتجر...');

    // الخادم يحذف البيانات والملفات وحساب الدخول
    try { await DM.post(A('delete'), { id }, true); }
    catch (e) { console.error(e); return showToast(`تعذر حذف المتجر: ${e.message}`, true); }

    showToast('تم حذف المتجر وكل بياناته');
    loadClients();
  }

  init();
</script>
</body>
</html>
