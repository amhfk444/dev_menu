<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Menu | لوحة تحكم الأدمن العامة</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Cairo', sans-serif; background-color: #0b0b0b; color: #ffffff; min-height: 100vh; }
  .pro-card { background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; }
  .input-pro { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 0.5rem; color: #fff; font-size: 0.75rem; }
</style>
</head>
<body class="py-6 px-4 max-w-6xl mx-auto space-y-6">

  <header class="pro-card p-4 flex justify-between items-center">
    <h1 class="text-base font-black text-amber-400"><i class="fa-solid fa-crown"></i> إدارة مشتركي DEV MENU</h1>
    <span class="text-xs bg-white/10 px-3 py-1 rounded-xl">إجمالي العملاء: <span id="count-clients">0</span></span>
  </header>

  <div class="pro-card p-5 space-y-4">
    <h3 class="text-xs font-bold text-white border-b border-white/10 pb-2">قائمة العملاء والمطاعم</h3>
    <div class="overflow-x-auto">
      <table class="w-full text-right text-xs">
        <thead class="bg-white/5 text-gray-300 border-b border-white/10">
          <tr>
            <th class="p-3">اسم المطعم / المتجر</th>
            <th class="p-3">الحالة والنوع</th>
            <th class="p-3">إرسال إشعار تنبيه</th>
            <th class="p-3 text-center">تفعيل باقة (شهر 99 / سنة 1149) وإجراءات</th>
          </tr>
        </thead>
        <tbody id="admin-clients-list" class="divide-y divide-white/10">
          <tr><td colspan="4" class="text-center py-6 text-gray-400">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://czdoamcgxgkicrbufpcn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6ZG9hbWNneGdraWNyYnVmcGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTA5MzAsImV4cCI6MjEwNTU4NjkzMH0.45zKx4ljXJ27SS-ukc62qiu52movhDgSoC9OEnK9NHk';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadClients() {
    let { data: clients } = await supabaseClient.from('clients').select('*').order('id', { ascending: false });
    if (!clients) return;

    document.getElementById('count-clients').textContent = clients.length;
    const tbody = document.getElementById('admin-clients-list');

    tbody.innerHTML = clients.map(c => {
      let statusBadge = '';
      if (c.subscription_status === 'trial') statusBadge = '<span class="bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full text-[10px] font-bold">تجريبي (7 أيام)</span>';
      else if (c.subscription_status === 'active') statusBadge = '<span class="bg-green-500/20 text-green-300 px-2 py-0.5 rounded-full text-[10px] font-bold">مشترك مدفوع</span>';
      else statusBadge = '<span class="bg-red-500/20 text-red-300 px-2 py-0.5 rounded-full text-[10px] font-bold">منتهي الاشتراك</span>';

      return `
        <tr class="hover:bg-white/5">
          <td class="p-3 font-bold text-white">${c.name || 'بدون اسم'} <br><span class="text-[10px] text-gray-400 font-mono">${c.client_slug}</span></td>
          <td class="p-3">${statusBadge}</td>
          <td class="p-3 space-y-1">
            <input type="text" id="notif-${c.id}" placeholder="اكتب إشعاراً للعميل..." class="input-pro" value="${c.admin_notification || ''}">
            <button onclick="sendNotification(${c.id})" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] px-2.5 py-1 rounded">إرسال إشعار</button>
          </td>
          <td class="p-3 text-center space-x-1 space-x-reverse">
            <button onclick="activateSubscription(${c.id}, 'month')" class="bg-amber-600 hover:bg-amber-500 text-white px-2 py-1.5 rounded text-[10px] font-bold">تفعيل شهر (99 ر.س)</button>
            <button onclick="activateSubscription(${c.id}, 'year')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1.5 rounded text-[10px] font-bold">تفعيل سنة (1149 ر.س)</button>
            <button onclick="toggleSuspend(${c.id}, ${c.is_active})" class="bg-red-600/50 hover:bg-red-600 text-white px-2 py-1.5 rounded text-[10px]">ايقاف</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  async function activateSubscription(id, type) {
    const targetDate = new Date();
    if (type === 'month') targetDate.setMonth(targetDate.getMonth() + 1);
    else targetDate.setFullYear(targetDate.getFullYear() + 1);

    await supabaseClient.from('clients').update({
      subscription_status: 'active',
      is_active: true,
      subscription_end_date: targetDate.toISOString()
    }).eq('id', id);

    alert('تم تفعيل الاشتراك بنجاح!');
    loadClients();
  }

  async function sendNotification(id) {
    const msg = document.getElementById(`notif-${id}`).value;
    await supabaseClient.from('clients').update({ admin_notification: msg }).eq('id', id);
    alert('تم إرسال الإشعار للعميل بنجاح وسيظهر في لوحة تحكمه!');
    loadClients();
  }

  async function toggleSuspend(id, currentStatus) {
    await supabaseClient.from('clients').update({ is_active: !currentStatus }).eq('id', currentStatus);
    loadClients();
  }

  document.addEventListener('DOMContentLoaded', loadClients);
</script>
</body>
</html>
